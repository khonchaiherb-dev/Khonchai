<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b5ed7" />
  <meta name="description" content="ระบบทำข้อสอบนักตรวจสอบภาษีปฏิบัติการ K-EXAM โดยอาจารย์คิม จำนวน 1,000 ข้อ" />
  <title>K-EXAM | ระบบทำข้อสอบนักตรวจสอบภาษีปฏิบัติการ</title>
  <base href="/Khonchai/tax-exam/" />
  <link rel="stylesheet" href="styles.css?v=7-live" />
</head>
<body>
  <div id="app"></div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(list => {
        for (const reg of list) {
          if (reg.scope.includes('/Khonchai/tax-exam/')) reg.unregister();
        }
      }).catch(()=>{});
    }
    if ('caches' in window) {
      caches.keys().then(keys => Promise.all(keys.filter(k => k.startsWith('kexam-tax-')).map(k => caches.delete(k)))).catch(()=>{});
    }
  </script>
  <script src="base64-fix.js?v=7-live"></script>
  <script src="app-v2.js?v=7-live" defer></script>
</body>
</html>
