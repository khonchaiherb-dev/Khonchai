name: KHONCHAIHERB Launch Rang Jued Product

on:
  push:
    branches: [storefront-social-commerce]
    paths:
      - 'functions/api/internal/launch-product-bootstrap.js'
      - '.github/workflows/launch-rang-jued-product.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: khonchaiherb-launch-rang-jued-product
  cancel-in-progress: true

jobs:
  launch-product:
    name: Verify and bootstrap Rang Jued launch SKU
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE_ORIGIN: https://khonchaiherb-commerce.pages.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: khonchaiherb-commerce
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for exact bootstrap build on Pages production
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 180); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" > pages-current.json
            if GITHUB_SHA="$GITHUB_SHA" python3 - <<'PY'
          import json,os
          d=json.load(open('pages-current.json'))
          dep=(d.get('result') or {}).get('canonical_deployment') or {}
          meta=((dep.get('deployment_trigger') or {}).get('metadata') or {})
          commit=str(meta.get('commit_hash') or '')
          status=str((dep.get('latest_stage') or {}).get('status') or '')
          if commit==os.environ['GITHUB_SHA'] and status=='success':
              print('Exact production commit is live:',commit[:12])
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            then found=1; break; fi
            if [ $((attempt % 20)) -eq 0 ]; then echo "Still waiting for exact Pages production commit ($attempt/180)"; fi
            sleep 3
          done
          [ "$found" = "1" ] || { echo 'Exact launch-product build was not observed on Production.' >&2; exit 1; }
          curl --fail --silent --show-error --location --max-time 15 "$SITE_ORIGIN/api/internal/launch-product-bootstrap" > marker.json
          python3 - <<'PY'
          import json
          d=json.load(open('marker.json'))
          assert d.get('service')=='khonchaiherb-launch-product-bootstrap'
          assert d.get('version')=='rang-jued-2026-09-04-v1'
          print('Guarded launch-product endpoint marker verified.')
          PY

      - name: Preflight schemas and static media asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/health" > health-before.json
          python3 - <<'PY'
          import json
          d=json.load(open('health-before.json'))
          assert d.get('databaseReady') is True, 'production D1 runtime unavailable'
          assert d.get('catalogSchemaReady') is True, str(d.get('catalogProbeError') or 'catalog schema unavailable')
          assert d.get('orderSchemaReady') is True, str(d.get('orderProbeError') or 'order schema unavailable')
          assert d.get('checkoutEnabled') is False, 'checkout must remain closed during product bootstrap'
          assert d.get('codConfigured') is False, 'COD must remain closed during product bootstrap'
          print('Preflight schemas ready; checkout remains safely closed.')
          PY
          code=$(curl --silent --show-error --location --max-time 20 --output static-product.webp --write-out '%{http_code}' "$SITE_ORIGIN/assets/products/rang-jued-tea-360.webp")
          [ "$code" = "200" ] || { echo "Static Rang Jued product media returned HTTP $code" >&2; exit 1; }
          [ -s static-product.webp ] || { echo 'Static Rang Jued product media is empty.' >&2; exit 1; }
          echo "Static Rang Jued product media is reachable ($(wc -c < static-product.webp) bytes)."

      - name: Generate one-time product bootstrap credential
        id: bootstrap_secret
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "LAUNCH_PRODUCT_TOKEN=$token" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Temporarily enable guarded product bootstrap
        if: steps.bootstrap_secret.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > pages-product-env.json
          import json,os
          print(json.dumps({'deployment_configs':{'production':{'env_vars':{'LAUNCH_PRODUCT_TOKEN':{'type':'secret_text','value':os.environ['LAUNCH_PRODUCT_TOKEN']}}}}}))
          PY
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data @pages-product-env.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" > pages-product-env-result.json
          python3 - <<'PY'
          import json
          d=json.load(open('pages-product-env-result.json'))
          assert d.get('success'), d.get('errors')
          print('One-time product bootstrap credential configured.')
          PY

      - name: Deploy runtime with one-time product credential
        if: steps.bootstrap_secret.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy public \
            --project-name="$PAGES_PROJECT" --branch="storefront-social-commerce" \
            --commit-hash="$GITHUB_SHA" --commit-message="guarded Rang Jued launch bootstrap"

      - name: Bootstrap verified Rang Jued product with one-unit web safety stock
        if: steps.bootstrap_secret.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 45); do
            code=$(curl --silent --show-error --location --max-time 20 --output product-bootstrap.json --write-out '%{http_code}' \
              -X POST -H "X-KCH-Launch-Product: $LAUNCH_PRODUCT_TOKEN" \
              "$SITE_ORIGIN/api/internal/launch-product-bootstrap")
            if [ "$code" = "200" ] && python3 - <<'PY'
          import json
          d=json.load(open('product-bootstrap.json'))
          assert d.get('ok') is True
          p=d.get('product') or {}
          assert p.get('slug')=='rang-jued-tea'
          assert float(p.get('price') or 0)==120
          assert int(p.get('stock') or 0)==1
          assert int(p.get('sale_verified') or 0)==1
          print('Launch product bootstrapped:',p.get('name'),'฿'+str(p.get('price')),'web safety stock='+str(p.get('stock')))
          PY
            then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = "1" ] || { echo 'Guarded Rang Jued product bootstrap failed.' >&2; cat product-bootstrap.json || true; exit 1; }

      - name: Verify catalog and media launch readiness
        if: steps.bootstrap_secret.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/health" > health-after.json
          curl --fail --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/products" > products-after.json
          media_code=$(curl --silent --show-error --location --max-time 20 --output media-after.webp --write-out '%{http_code}' "$SITE_ORIGIN/media/product?key=static/rang-jued-tea-360.webp")
          [ "$media_code" = "200" ] || { echo "Static product media route returned HTTP $media_code" >&2; exit 1; }
          python3 - <<'PY'
          import json
          h=json.load(open('health-after.json'))
          p=json.load(open('products-after.json'))
          assert h.get('databaseReady') is True
          assert h.get('catalogSchemaReady') is True
          assert h.get('orderSchemaReady') is True
          assert int(h.get('saleReadyProducts') or 0)>=1
          assert int(h.get('staticMediaReadyProducts') or 0)>=1
          assert h.get('productMediaConfigured') is True
          products=p.get('products') or []
          r=next((x for x in products if x.get('slug')=='rang-jued-tea'),None)
          assert r is not None, 'Rang Jued launch SKU missing from public catalog'
          assert float(r.get('price') or 0)==120
          assert int(r.get('stock') or 0)==1
          print('Public catalog ready with verified Rang Jued SKU; checkout remains controlled by launch flags.')
          print('launchBlockers=',','.join(h.get('launchBlockers') or []))
          PY

      - name: Remove one-time product bootstrap credential
        if: always() && steps.bootstrap_secret.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > pages-product-cleanup.json <<'JSON'
          {"deployment_configs":{"production":{"env_vars":{"LAUNCH_PRODUCT_TOKEN":null}}}}
          JSON
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data @pages-product-cleanup.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" > pages-product-cleanup-result.json
          python3 - <<'PY'
          import json
          d=json.load(open('pages-product-cleanup-result.json'))
          assert d.get('success'), d.get('errors')
          print('One-time product bootstrap credential removed.')
          PY

      - name: Redeploy with product bootstrap credential removed
        if: always() && steps.bootstrap_secret.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy public \
            --project-name="$PAGES_PROJECT" --branch="storefront-social-commerce" \
            --commit-hash="$GITHUB_SHA" --commit-message="close Rang Jued launch bootstrap"

      - name: Confirm product bootstrap route is closed
        if: always() && steps.bootstrap_secret.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          closed=0
          for attempt in $(seq 1 45); do
            code=$(curl --silent --show-error --location --max-time 15 --output closed-product.json --write-out '%{http_code}' -X POST "$SITE_ORIGIN/api/internal/launch-product-bootstrap")
            if [ "$code" = "404" ]; then closed=1; break; fi
            sleep 2
          done
          [ "$closed" = "1" ] || { echo 'Product bootstrap route did not close.' >&2; exit 1; }
          echo 'Guarded product bootstrap route is closed.'
