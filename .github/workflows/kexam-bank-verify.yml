name: K-EXAM Verify
on:
  push:
    paths:
      - '.github/workflows/kexam-bank-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify K-EXAM NOVA v25 source, analytics and banks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1
          git show origin/gh-pages:tax-exam/index.html | grep -q 'app-v3.js?v=25'
          git show origin/gh-pages:tax-exam/index.html | grep -q 'analytics-v13.js?v=25'
          git show origin/gh-pages:tax-exam/index.html | grep -q 'cosmic-v12.css?v=25'
          git show origin/gh-pages:tax-exam/index.html | grep -q '2,000'
          git show origin/gh-pages:tax-exam/manifest.webmanifest | grep -q '2,000'
          git show origin/gh-pages:tax-exam/sw-v2.js | grep -q "kexam-tax-v25"
          git show origin/gh-pages:tax-exam/sw-v2.js | grep -q 'question-content-integrity.json'
          git show origin/gh-pages:tax-exam/sw-v2.js | grep -q 'source-reverification-watchlist.json'
          for f in app-v3.js base64-fix.js app-v3-part1.txt app-v3-part2.txt app-v3-part3.txt app-v3-part4.txt positions-v10.css cosmic-v12.css analytics-config.js analytics-v13.js admin/index.html admin/admin-v13.js admin/admin-v13.css sw-v2.js manifest.webmanifest question-publication-manifest.json question-content-integrity.json source-verification-backlog.json source-reverification-watchlist.json source-review-batch-registry.json; do
            git cat-file -e "origin/gh-pages:tax-exam/$f"
          done
          for f in supabase/migrations/20260918_kexam_analytics.sql supabase/migrations/20260918_kexam_item_analytics_v2.sql supabase/migrations/20260918_kexam_item_discrimination_v3.sql supabase/migrations/20260918_kexam_item_psychometrics_v4.sql supabase/migrations/20260918_kexam_quality_review_v5.sql supabase/migrations/20260918_kexam_item_time_v6.sql supabase/functions/kexam-ingest/index.ts supabase/functions/kexam-dashboard/index.ts; do
            test -s "$f"
          done
          grep -q 'discrimination' supabase/migrations/20260918_kexam_item_discrimination_v3.sql
          grep -q 'distractor_efficiency' supabase/migrations/20260918_kexam_item_discrimination_v3.sql
          grep -q 'quality_status' supabase/migrations/20260918_kexam_item_discrimination_v3.sql
          grep -q 'first-response-per-user' supabase/migrations/20260918_kexam_item_psychometrics_v4.sql
          grep -q 'item_first as' supabase/migrations/20260918_kexam_item_psychometrics_v4.sql
          grep -q 'quality_queue as' supabase/migrations/20260918_kexam_quality_review_v5.sql
          grep -q 'quality_summary as' supabase/migrations/20260918_kexam_quality_review_v5.sql
          grep -q 'risk_score' supabase/migrations/20260918_kexam_quality_review_v5.sql
          grep -q 'item_time_rows as' supabase/migrations/20260918_kexam_item_time_v6.sql
          grep -q 'avg_time_seconds' supabase/migrations/20260918_kexam_item_time_v6.sql
          grep -q 'median_time_seconds' supabase/migrations/20260918_kexam_item_time_v6.sql
          grep -q 'slow_items as' supabase/migrations/20260918_kexam_item_time_v6.sql
          git show origin/gh-pages:tax-exam/app-v3.js > /tmp/loader.js
          git show origin/gh-pages:tax-exam/analytics-v13.js > /tmp/analytics.js
          git show origin/gh-pages:tax-exam/admin/admin-v13.js > /tmp/admin.js
          node --check /tmp/loader.js
          node --check /tmp/analytics.js
          node --check /tmp/admin.js
          grep -q "trackOnce('exam_submit'" /tmp/loader.js
          grep -q "position_select" /tmp/loader.js
          grep -q "exam_open" /tmp/loader.js
          grep -q "kexam_analytics_queue_v1" /tmp/analytics.js
          grep -q "dashboardFunction" /tmp/admin.js
          git show origin/gh-pages:tax-exam/app-v3-part1.txt > /tmp/p1
          git show origin/gh-pages:tax-exam/app-v3-part2.txt > /tmp/p2
          git show origin/gh-pages:tax-exam/app-v3-part3.txt > /tmp/p3
          git show origin/gh-pages:tax-exam/app-v3-part4.txt > /tmp/p4
          cat /tmp/p1 /tmp/p2 /tmp/p3 /tmp/p4 > /tmp/app-source.js
          node --check /tmp/app-source.js
          grep -q 'นักตรวจสอบภาษีปฏิบัติการ' /tmp/app-source.js
          grep -q 'นักวิชาการสรรพากรปฏิบัติการ' /tmp/app-source.js
          grep -q 'ส่งคำตอบและประมวลผลคะแนน' /tmp/app-source.js
          grep -q 'id="reviewAll"' /tmp/app-source.js
          grep -q 'สุ่มจำลองสอบ 100 ข้อ' /tmp/app-source.js
          grep -q "const WRONG_SET='wrong'" /tmp/app-source.js
          grep -q "const WEAK_SET='weak'" /tmp/app-source.js
          grep -q "const TOPIC_SET='topic'" /tmp/app-source.js
          grep -q 'function weaknessTopicSummary' /tmp/app-source.js
          grep -q 'function buildTopicPlan' /tmp/app-source.js
          grep -q 'function recordItemStats' /tmp/app-source.js
          grep -q 'function resultTopicStats' /tmp/app-source.js
          grep -q 'topic:Object.fromEntries' /tmp/app-source.js
          grep -q 'localItemStats' /tmp/admin.js
          grep -q 'itemStatsList' /tmp/admin.js
          grep -q 'difficulty_index' /tmp/admin.js
          grep -q 'discrimination' /tmp/admin.js
          grep -q 'distractor_efficiency' /tmp/admin.js
          grep -q 'quality_status' /tmp/admin.js
          grep -q 'first-response-per-user' /tmp/admin.js
          grep -q 'คำตอบครั้งแรกต่อผู้ใช้' /tmp/admin.js
          grep -q 'qualityQueueList' /tmp/admin.js
          grep -q 'qualitySummaryHtml' /tmp/admin.js
          grep -q 'localQualityQueue' /tmp/admin.js
          grep -q 'filteredQualityRows' /tmp/admin.js
          grep -q 'exportQualityCsv' /tmp/admin.js
          grep -q 'slowItemsList' /tmp/admin.js
          grep -q 'avg_time_seconds' /tmp/admin.js
          grep -q 'median_time_seconds' /tmp/admin.js
          grep -q 'contentIntegrityCoverageHtml' /tmp/admin.js
          grep -q 'sourceFreshnessWatchlist' /tmp/admin.js
          grep -q 'sourceFreshnessSummaryHtml' /tmp/admin.js
          grep -q 'filteredFreshnessRows' /tmp/admin.js
          grep -q 'exportFreshnessCsv' /tmp/admin.js
          grep -q 'sourceReviewBatchRegistry' /tmp/admin.js
          grep -q 'sourceBatchSummaryHtml' /tmp/admin.js
          grep -q 'sourceBatchHistoryHtml' /tmp/admin.js
          grep -q 'source-review-batch-registry.json' /tmp/admin.js
          grep -q 'question-content-integrity.json' /tmp/admin.js
          grep -q 'text/csv' /tmp/admin.js
          grep -q '#itemStats' /tmp/admin.js || grep -q "itemStats').innerHTML" /tmp/admin.js
          grep -q "topic-practice" /tmp/loader.js
          grep -q 'item_responses' /tmp/loader.js
          grep -q 'item_times' /tmp/loader.js
          grep -q 'topic_result' /tmp/loader.js
          grep -q "track('question_report'" /tmp/app-source.js
          grep -q 'function questionId' /tmp/app-source.js
          grep -q 'function examTotal' /tmp/app-source.js
          grep -q 'function commitItemTime' /tmp/app-source.js
          grep -q 'itemViewStartedAt' /tmp/app-source.js
          grep -q 'visibilitychange' /tmp/app-source.js
          grep -q 'function beginPractice' /tmp/app-source.js
          grep -q 'wrongIds' /tmp/app-source.js
          grep -q 'openQuestionReport' /tmp/app-source.js
          grep -q 'function deriveTopic' /tmp/app-source.js
          grep -q 'function allocateSample' /tmp/app-source.js
          grep -q 'allocateSample(x.topics,x.quota)' /tmp/app-source.js
          grep -q 'localQuestionReports' /tmp/admin.js
          grep -q 'questionReports' /tmp/admin.js
          grep -q 'รหัสข้อ' /tmp/app-source.js
          grep -q "wrong-practice" /tmp/loader.js
          grep -q "weak-practice" /tmp/loader.js
          grep -q "set('v','25')" /tmp/loader.js
          node <<'NODE'
          const cp=require('child_process');
          const show=p=>cp.execFileSync('git',['show',`origin/gh-pages:tax-exam/${p}`],{encoding:'utf8',maxBuffer:16*1024*1024}).trim();
          const x=JSON.parse(show('source-reverification-watchlist.json'));
          if(x.schema_version!==1)throw new Error('source freshness schema_version must be 1');
          if(!x.summary||!Array.isArray(x.rows))throw new Error('source freshness summary/rows missing');
          if(x.rows.length!==Number(x.summary.total_verified||0))throw new Error('source freshness rows must equal total_verified');
          for(const r of x.rows){
            if(!/^(RA|TA)-S(0[1-9]|10)-Q(0[0-9]{2}|100)$/.test(String(r.question_id||'')))throw new Error('invalid freshness Question ID');
            if(!['ยังสดใหม่','ใกล้ครบกำหนด','เกินกำหนด'].includes(r.status))throw new Error('invalid freshness status '+r.status);
            if(!/^\d{4}-\d{2}-\d{2}$/.test(String(r.checked_at||''))||!/^\d{4}-\d{2}-\d{2}$/.test(String(r.due_at||'')))throw new Error('invalid freshness dates '+r.question_id);
            if(![90,180,365].includes(Number(r.review_interval_days)))throw new Error('invalid freshness interval '+r.question_id);
            if(!/^[a-f0-9]{64}$/.test(String(r.content_sha256||'')))throw new Error('freshness row missing content hash '+r.question_id);
          }
          console.log('PASS source freshness watchlist',JSON.stringify(x.summary));
          NODE
          node <<'NODE'
          const cp=require('child_process');
          const show=p=>cp.execFileSync('git',['show',`origin/gh-pages:tax-exam/${p}`],{encoding:'utf8',maxBuffer:16*1024*1024}).trim();
          const x=JSON.parse(show('question-content-integrity.json'));
          if(x.schema_version!==1||x.algorithm!=='sha256')throw new Error('invalid content integrity schema');
          if(!Array.isArray(x.canonical_fields)||!x.canonical_fields.includes('answer')||!x.canonical_fields.includes('wrong_reasons'))throw new Error('content integrity canonical fields incomplete');
          const ids=Object.keys(x.questions||{});
          if(ids.length!==2000)throw new Error('content integrity baseline must contain exactly 2,000 IDs');
          if(new Set(ids).size!==2000)throw new Error('content integrity baseline contains duplicate IDs');
          if(ids.some(id=>!/^(RA|TA)-S(0[1-9]|10)-Q(0[0-9]{2}|100)$/.test(id)))throw new Error('content integrity baseline contains invalid Question ID');
          console.log('PASS content integrity baseline',ids.length);
          NODE
          node <<'NODE'
          const cp=require('child_process');
          const show=p=>cp.execFileSync('git',['show',`origin/gh-pages:tax-exam/${p}`],{encoding:'utf8',maxBuffer:16*1024*1024}).trim();
          const x=JSON.parse(show('source-review-batch-registry.json'));
          if(x.schema_version!==1||!Array.isArray(x.batches))throw new Error('invalid source review batch registry');
          const idRe=/^SRB-\d{8}-[a-f0-9]{12}$/,hashRe=/^[a-f0-9]{64}$/,qidRe=/^(RA|TA)-S(0[1-9]|10)-Q(0[0-9]{2}|100)$/;
          const seen=new Set(),forbidden=['prompt','choices','correct_answer','explanation','wrong_reasons','source_refs'];
          for(const b of x.batches){
            if(!idRe.test(String(b.batch_id||''))||seen.has(b.batch_id))throw new Error('invalid/duplicate batch_id '+b.batch_id);seen.add(b.batch_id);
            if(!hashRe.test(String(b.batch_snapshot_sha256||'')))throw new Error('invalid batch snapshot '+b.batch_id);
            if(!['generated','applied'].includes(String(b.status||'')))throw new Error('invalid batch status '+b.batch_id);
            if(!Array.isArray(b.question_ids)||b.question_ids.length!==Number(b.batch_size||0)||new Set(b.question_ids).size!==b.question_ids.length||b.question_ids.some(id=>!qidRe.test(String(id))))throw new Error('invalid registry Question IDs '+b.batch_id);
            const raw=JSON.stringify(b);for(const k of forbidden)if(raw.includes('"'+k+'"'))throw new Error('registry leaks '+k);
          }
          console.log('PASS source review batch registry',JSON.stringify({batches:x.batches.length,generated:x.batches.filter(b=>b.status==='generated').length,applied:x.batches.filter(b=>b.status==='applied').length}));
          NODE
          node <<'NODE'
          const cp=require('child_process'),zlib=require('zlib');
          const show=f=>cp.execFileSync('git',['show',`origin/gh-pages:tax-exam/${f}`],{encoding:'utf8',maxBuffer:4*1024*1024}).trim();
          const tax=['bank-01.txt','bank-02-03.txt','bank-04-05.txt','bank-06-07.txt','bank-08-09.txt','bank-10-11.txt','bank-12-13.txt','bank-14-15.txt','bank-16-17.txt','bank-18.txt'];
          const academic=['ra-bank-01.txt','ra-bank-02a.txt','ra-bank-02b.txt','ra-bank-03a.txt','ra-bank-03b.txt','ra-bank-04.txt','ra-bank-05.txt','ra-bank-06.txt','ra-bank-07.txt','ra-bank-08.txt','ra-bank-09.txt','ra-bank-10.txt'];
          function decode(files,label){
            const b64=files.map(show).join('').replace(/\s+/g,'');
            const raw=Buffer.from(b64,'base64');
            if(raw[0]!==0x1f||raw[1]!==0x8b)throw new Error(label+' is not gzip');
            const data=JSON.parse(zlib.gunzipSync(raw).toString('utf8'));
            if(!Array.isArray(data.q)||data.q.length!==10||data.q.some(s=>!Array.isArray(s)||s.length!==100))throw new Error(label+' must be 10 x 100');
            for(const [si,set] of data.q.entries()){
              const answers=[0,0,0,0];
              for(const r of set){if(!Number.isInteger(r[3])||r[3]<0||r[3]>3)throw new Error(`${label} bad answer`);answers[r[3]]++}
              if(label==='academic'&&answers.some(n=>n<22||n>28))throw new Error(`${label} set ${si+1} answer balance must be 22–28 per option: ${answers}`);
              let maxRun=1,run=1,last=null;
              for(const r of set){if(r[3]===last){run++;maxRun=Math.max(maxRun,run)}else{last=r[3];run=1}}
              if(label==='academic'&&maxRun>4)throw new Error(`${label} set ${si+1} has answer run ${maxRun} > 4`);
            }
            const prompts=data.q.flat().map(r=>data.s[r[1]]);
            if(label==='academic'&&new Set(prompts).size!==1000)throw new Error(label+' has exact duplicate prompts');
            const cats={};for(const r of data.q.flat()){const c=data.s[r[0]];cats[c]=(cats[c]||0)+1}
            if(label==='academic'&&Object.keys(cats).length!==4)throw new Error('academic categories must be 4: '+JSON.stringify(cats));
            console.log(`PASS ${label}: 10 sets x 100; unique=${new Set(prompts).size}; categories=${JSON.stringify(cats)}`);
          }
          decode(tax,'tax-auditor');
          decode(academic,'academic');
          NODE
      - name: Verify public GitHub Pages v25
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://khonchaiherb-dev.github.io/Khonchai/tax-exam'
          mkdir -p /tmp/live
          curl -fsSL --retry 20 --retry-all-errors --retry-delay 4 -H 'Cache-Control: no-cache' "$BASE/index.html?v=25-$GITHUB_SHA" -o /tmp/live/index.html
          grep -q 'app-v3.js?v=25' /tmp/live/index.html
          grep -q 'analytics-v13.js?v=25' /tmp/live/index.html
          grep -q 'cosmic-v12.css?v=25' /tmp/live/index.html
          files=(app-v3.js base64-fix.js analytics-config.js analytics-v13.js app-v3-part1.txt app-v3-part2.txt app-v3-part3.txt app-v3-part4.txt cosmic-v12.css ra-bank-01.txt ra-bank-02a.txt ra-bank-02b.txt ra-bank-03a.txt ra-bank-03b.txt ra-bank-04.txt ra-bank-05.txt ra-bank-06.txt ra-bank-07.txt ra-bank-08.txt ra-bank-09.txt ra-bank-10.txt admin/index.html admin/admin-v13.js admin/admin-v13.css source-review-batch-registry.json)
          
          for f in "${files[@]}"; do curl -fsSL --retry 20 --retry-all-errors --retry-delay 4 -H 'Cache-Control: no-cache' "$BASE/$f?v=25-$GITHUB_SHA" -o "/tmp/live/$(basename $f)"; done
          node --check /tmp/live/app-v3.js
          node --check /tmp/live/base64-fix.js
          node --check /tmp/live/analytics-v13.js
          node --check /tmp/live/admin-v13.js
          grep -q 'admin-v13.js?v=29' /tmp/live/index.html
          grep -q 'difficulty_index' /tmp/live/admin-v13.js
          grep -q 'discrimination' /tmp/live/admin-v13.js
          grep -q 'distractor_efficiency' /tmp/live/admin-v13.js
          grep -q 'quality_status' /tmp/live/admin-v13.js
          grep -q 'first-response-per-user' /tmp/live/admin-v13.js
          grep -q 'คำตอบครั้งแรกต่อผู้ใช้' /tmp/live/admin-v13.js
          grep -q 'qualityQueueList' /tmp/live/admin-v13.js
          grep -q 'qualitySummaryHtml' /tmp/live/admin-v13.js
          grep -q 'filteredQualityRows' /tmp/live/admin-v13.js
          grep -q 'exportQualityCsv' /tmp/live/admin-v13.js
          grep -q 'slowItemsList' /tmp/live/admin-v13.js
          grep -q 'avg_time_seconds' /tmp/live/admin-v13.js
          grep -q 'median_time_seconds' /tmp/live/admin-v13.js
          grep -q 'contentIntegrityCoverageHtml' /tmp/live/admin-v13.js
          grep -q 'sourceFreshnessWatchlist' /tmp/live/admin-v13.js
          grep -q 'sourceFreshnessSummaryHtml' /tmp/live/admin-v13.js
          grep -q 'filteredFreshnessRows' /tmp/live/admin-v13.js
          grep -q 'exportFreshnessCsv' /tmp/live/admin-v13.js
          grep -q 'sourceReviewBatchRegistry' /tmp/live/admin-v13.js
          grep -q 'sourceBatchSummaryHtml' /tmp/live/admin-v13.js
          grep -q 'sourceBatchHistoryHtml' /tmp/live/admin-v13.js
          grep -q 'question-content-integrity.json' /tmp/live/admin-v13.js
          grep -q 'text/csv' /tmp/live/admin-v13.js
          grep -q 'K-EXAM Analytics' /tmp/live/index.html || true
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/live/source-review-batch-registry.json','utf8'));
          if(x.schema_version!==1||!Array.isArray(x.batches)||x.batches.length<1)throw new Error('LIVE source review registry missing/invalid');
          if(JSON.stringify(x).match(/"(prompt|choices|correct_answer|explanation|wrong_reasons|source_refs)"/))throw new Error('LIVE registry leaks private review data');
          console.log('PASS LIVE source review registry',x.batches.length);
          NODE
          cat /tmp/live/app-v3-part1.txt /tmp/live/app-v3-part2.txt /tmp/live/app-v3-part3.txt /tmp/live/app-v3-part4.txt > /tmp/live/combined.js
          node --check /tmp/live/combined.js
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const files=['ra-bank-01.txt','ra-bank-02a.txt','ra-bank-02b.txt','ra-bank-03a.txt','ra-bank-03b.txt','ra-bank-04.txt','ra-bank-05.txt','ra-bank-06.txt','ra-bank-07.txt','ra-bank-08.txt','ra-bank-09.txt','ra-bank-10.txt'];
          const b64=files.map(f=>fs.readFileSync('/tmp/live/'+f,'utf8').trim()).join('').replace(/\s+/g,'');
          const data=JSON.parse(zlib.gunzipSync(Buffer.from(b64,'base64')).toString('utf8'));
          if(data.q.length!==10||data.q.some(s=>s.length!==100))throw new Error('LIVE academic bank invalid');
          const prompts=data.q.flat().map(r=>data.s[r[1]]);
          if(new Set(prompts).size!==1000)throw new Error('LIVE academic prompts duplicate');
          console.log('PASS LIVE K-EXAM NOVA v25 + content integrity + centralized analytics: 1,000 academic questions');
          NODE
