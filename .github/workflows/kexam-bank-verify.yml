name: K-EXAM Bank Verify
on:
  push:
    paths:
      - '.github/workflows/kexam-bank-verify.yml'
      - 'tax-exam/bank-*.txt'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate corrupted Base64 character and verify bank
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const files = [
            'bank-01.txt','bank-02-03.txt','bank-04-05.txt','bank-06-07.txt','bank-08-09.txt',
            'bank-10-11.txt','bank-12-13.txt','bank-14-15.txt','bank-16-17.txt','bank-18.txt'
          ];
          const parts=files.map(f=>fs.readFileSync('tax-exam/'+f,'utf8').trim());
          for(let i=0;i<files.length;i++) console.log(files[i],'chars=',parts[i].length);

          function validate(b64){
            try{
              if(b64.length%4===1) return null;
              const padded=b64+'='.repeat((4-b64.length%4)%4);
              const gz=Buffer.from(padded,'base64');
              if(gz[0]!==0x1f||gz[1]!==0x8b) return null;
              const data=JSON.parse(zlib.gunzipSync(gz).toString('utf8'));
              if(!Array.isArray(data.q)||data.q.length!==10) return null;
              const lens=data.q.map(x=>x.length);
              if(lens.some(n=>n!==100)) return null;
              return {data,lens,gzBytes:gz.length};
            }catch{return null;}
          }

          const joined=parts.join('');
          console.log('joined chars=',joined.length,'mod4=',joined.length%4);
          let ok=validate(joined);
          if(ok){
            console.log('PASS: bank is already valid',ok.lens.join(','));
            process.exit(0);
          }

          const targetIndex=8; // bank-16-17.txt
          const target=parts[targetIndex];
          const prefix=parts.slice(0,targetIndex).join('');
          const suffix=parts.slice(targetIndex+1).join('');
          let found=[];
          for(let i=0;i<target.length;i++){
            const candidate=prefix+target.slice(0,i)+target.slice(i+1)+suffix;
            const result=validate(candidate);
            if(result){
              found.push({i,char:target[i],result});
              console.log('FOUND position=',i,'1-based=',i+1,'char=',JSON.stringify(target[i]),'gzipBytes=',result.gzBytes,'counts=',result.lens.join(','));
              break;
            }
            if(i>0 && i%2000===0) console.log('checked',i,'positions');
          }
          if(!found.length) throw new Error('No single-character fix found in bank-16-17.txt');
          console.log('PASS: exact corruption location identified');
          NODE
