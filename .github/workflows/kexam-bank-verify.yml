name: K-EXAM Verify
on:
  push:
    paths:
      - '.github/workflows/kexam-bank-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify K-EXAM NOVA v18 source, analytics and banks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1
          git show origin/gh-pages:tax-exam/index.html | grep -q 'app-v3.js?v=18'
          git show origin/gh-pages:tax-exam/index.html | grep -q 'analytics-v13.js?v=18'
          git show origin/gh-pages:tax-exam/index.html | grep -q 'cosmic-v12.css?v=18'
          git show origin/gh-pages:tax-exam/index.html | grep -q '2,000'
          git show origin/gh-pages:tax-exam/manifest.webmanifest | grep -q '2,000'
          git show origin/gh-pages:tax-exam/sw-v2.js | grep -q "kexam-tax-v18"
          for f in app-v3.js app-v3-part1.txt app-v3-part2.txt app-v3-part3.txt app-v3-part4.txt positions-v10.css cosmic-v12.css analytics-config.js analytics-v13.js admin/index.html admin/admin-v13.js admin/admin-v13.css sw-v2.js manifest.webmanifest; do
            git cat-file -e "origin/gh-pages:tax-exam/$f"
          done
          for f in supabase/migrations/20260918_kexam_analytics.sql supabase/migrations/20260918_kexam_item_analytics_v2.sql supabase/migrations/20260918_kexam_item_discrimination_v3.sql supabase/functions/kexam-ingest/index.ts supabase/functions/kexam-dashboard/index.ts; do
            test -s "$f"
          done
          grep -q 'discrimination' supabase/migrations/20260918_kexam_item_discrimination_v3.sql
          grep -q 'distractor_efficiency' supabase/migrations/20260918_kexam_item_discrimination_v3.sql
          grep -q 'quality_status' supabase/migrations/20260918_kexam_item_discrimination_v3.sql
          git show origin/gh-pages:tax-exam/app-v3.js > /tmp/loader.js
          git show origin/gh-pages:tax-exam/analytics-v13.js > /tmp/analytics.js
          git show origin/gh-pages:tax-exam/admin/admin-v13.js > /tmp/admin.js
          node --check /tmp/loader.js
          node --check /tmp/analytics.js
          node --check /tmp/admin.js
          grep -q "trackOnce('exam_submit'" /tmp/loader.js
          grep -q "position_select" /tmp/loader.js
          grep -q "exam_open" /tmp/loader.js
          grep -q "kexam_analytics_queue_v1" /tmp/analytics.js
          grep -q "dashboardFunction" /tmp/admin.js
          git show origin/gh-pages:tax-exam/app-v3-part1.txt > /tmp/p1
          git show origin/gh-pages:tax-exam/app-v3-part2.txt > /tmp/p2
          git show origin/gh-pages:tax-exam/app-v3-part3.txt > /tmp/p3
          git show origin/gh-pages:tax-exam/app-v3-part4.txt > /tmp/p4
          cat /tmp/p1 /tmp/p2 /tmp/p3 /tmp/p4 > /tmp/app-source.js
          node --check /tmp/app-source.js
          grep -q 'นักตรวจสอบภาษีปฏิบัติการ' /tmp/app-source.js
          grep -q 'นักวิชาการสรรพากรปฏิบัติการ' /tmp/app-source.js
          grep -q 'ส่งคำตอบและประมวลผลคะแนน' /tmp/app-source.js
          grep -q 'id="reviewAll"' /tmp/app-source.js
          grep -q 'สุ่มจำลองสอบ 100 ข้อ' /tmp/app-source.js
          grep -q "const WRONG_SET='wrong'" /tmp/app-source.js
          grep -q "const WEAK_SET='weak'" /tmp/app-source.js
          grep -q "const TOPIC_SET='topic'" /tmp/app-source.js
          grep -q 'function weaknessTopicSummary' /tmp/app-source.js
          grep -q 'function buildTopicPlan' /tmp/app-source.js
          grep -q 'function recordItemStats' /tmp/app-source.js
          grep -q 'function resultTopicStats' /tmp/app-source.js
          grep -q 'topic:Object.fromEntries' /tmp/app-source.js
          grep -q 'localItemStats' /tmp/admin.js
          grep -q 'itemStatsList' /tmp/admin.js
          grep -q 'difficulty_index' /tmp/admin.js
          grep -q 'discrimination' /tmp/admin.js
          grep -q 'distractor_efficiency' /tmp/admin.js
          grep -q 'quality_status' /tmp/admin.js
          grep -q '#itemStats' /tmp/admin.js || grep -q "itemStats').innerHTML" /tmp/admin.js
          grep -q "topic-practice" /tmp/loader.js
          grep -q 'item_responses' /tmp/loader.js
          grep -q 'topic_result' /tmp/loader.js
          grep -q "track('question_report'" /tmp/app-source.js
          grep -q 'function questionId' /tmp/app-source.js
          grep -q 'function examTotal' /tmp/app-source.js
          grep -q 'function beginPractice' /tmp/app-source.js
          grep -q 'wrongIds' /tmp/app-source.js
          grep -q 'openQuestionReport' /tmp/app-source.js
          grep -q 'function deriveTopic' /tmp/app-source.js
          grep -q 'function allocateSample' /tmp/app-source.js
          grep -q 'allocateSample(x.topics,x.quota)' /tmp/app-source.js
          grep -q 'localQuestionReports' /tmp/admin.js
          grep -q 'questionReports' /tmp/admin.js
          grep -q 'รหัสข้อ' /tmp/app-source.js
          grep -q "wrong-practice" /tmp/loader.js
          grep -q "weak-practice" /tmp/loader.js
          grep -q "set('v','18')" /tmp/loader.js
          node <<'NODE'
          const cp=require('child_process'),zlib=require('zlib');
          const show=f=>cp.execFileSync('git',['show',`origin/gh-pages:tax-exam/${f}`],{encoding:'utf8',maxBuffer:4*1024*1024}).trim();
          const tax=['bank-01.txt','bank-02-03.txt','bank-04-05.txt','bank-06-07.txt','bank-08-09.txt','bank-10-11.txt','bank-12-13.txt','bank-14-15.txt','bank-16-17.txt','bank-18.txt'];
          const academic=['ra-bank-01.txt','ra-bank-02a.txt','ra-bank-02b.txt','ra-bank-03a.txt','ra-bank-03b.txt','ra-bank-04.txt','ra-bank-05.txt','ra-bank-06.txt','ra-bank-07.txt','ra-bank-08.txt','ra-bank-09.txt','ra-bank-10.txt'];
          function decode(files,label){
            const b64=files.map(show).join('').replace(/\s+/g,'');
            const raw=Buffer.from(b64,'base64');
            if(raw[0]!==0x1f||raw[1]!==0x8b)throw new Error(label+' is not gzip');
            const data=JSON.parse(zlib.gunzipSync(raw).toString('utf8'));
            if(!Array.isArray(data.q)||data.q.length!==10||data.q.some(s=>!Array.isArray(s)||s.length!==100))throw new Error(label+' must be 10 x 100');
            for(const [si,set] of data.q.entries()){
              const answers=[0,0,0,0];
              for(const r of set){if(!Number.isInteger(r[3])||r[3]<0||r[3]>3)throw new Error(`${label} bad answer`);answers[r[3]]++}
              if(label==='academic'&&answers.some(n=>n<22||n>28))throw new Error(`${label} set ${si+1} answer balance must be 22–28 per option: ${answers}`);
              let maxRun=1,run=1,last=null;
              for(const r of set){if(r[3]===last){run++;maxRun=Math.max(maxRun,run)}else{last=r[3];run=1}}
              if(label==='academic'&&maxRun>4)throw new Error(`${label} set ${si+1} has answer run ${maxRun} > 4`);
            }
            const prompts=data.q.flat().map(r=>data.s[r[1]]);
            if(label==='academic'&&new Set(prompts).size!==1000)throw new Error(label+' has exact duplicate prompts');
            const cats={};for(const r of data.q.flat()){const c=data.s[r[0]];cats[c]=(cats[c]||0)+1}
            if(label==='academic'&&Object.keys(cats).length!==4)throw new Error('academic categories must be 4: '+JSON.stringify(cats));
            console.log(`PASS ${label}: 10 sets x 100; unique=${new Set(prompts).size}; categories=${JSON.stringify(cats)}`);
          }
          decode(tax,'tax-auditor');
          decode(academic,'academic');
          NODE
      - name: Verify public GitHub Pages v18
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://khonchaiherb-dev.github.io/Khonchai/tax-exam'
          mkdir -p /tmp/live
          curl -fsSL --retry 20 --retry-all-errors --retry-delay 4 -H 'Cache-Control: no-cache' "$BASE/index.html?v=18-$GITHUB_SHA" -o /tmp/live/index.html
          grep -q 'app-v3.js?v=18' /tmp/live/index.html
          grep -q 'analytics-v13.js?v=18' /tmp/live/index.html
          grep -q 'cosmic-v12.css?v=18' /tmp/live/index.html
          files=(app-v3.js analytics-config.js analytics-v13.js app-v3-part1.txt app-v3-part2.txt app-v3-part3.txt app-v3-part4.txt cosmic-v12.css ra-bank-01.txt ra-bank-02a.txt ra-bank-02b.txt ra-bank-03a.txt ra-bank-03b.txt ra-bank-04.txt ra-bank-05.txt ra-bank-06.txt ra-bank-07.txt ra-bank-08.txt ra-bank-09.txt ra-bank-10.txt admin/index.html admin/admin-v13.js admin/admin-v13.css)
          
          for f in "${files[@]}"; do curl -fsSL --retry 20 --retry-all-errors --retry-delay 4 -H 'Cache-Control: no-cache' "$BASE/$f?v=18-$GITHUB_SHA" -o "/tmp/live/$(basename $f)"; done
          node --check /tmp/live/app-v3.js
          node --check /tmp/live/analytics-v13.js
          node --check /tmp/live/admin-v13.js
          grep -q 'admin-v13.js?v=19' /tmp/live/index.html || true
          grep -q 'difficulty_index' /tmp/live/admin-v13.js
          grep -q 'discrimination' /tmp/live/admin-v13.js
          grep -q 'distractor_efficiency' /tmp/live/admin-v13.js
          grep -q 'quality_status' /tmp/live/admin-v13.js
          grep -q 'K-EXAM Analytics' /tmp/live/index.html || true
          cat /tmp/live/app-v3-part1.txt /tmp/live/app-v3-part2.txt /tmp/live/app-v3-part3.txt /tmp/live/app-v3-part4.txt > /tmp/live/combined.js
          node --check /tmp/live/combined.js
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const files=['ra-bank-01.txt','ra-bank-02a.txt','ra-bank-02b.txt','ra-bank-03a.txt','ra-bank-03b.txt','ra-bank-04.txt','ra-bank-05.txt','ra-bank-06.txt','ra-bank-07.txt','ra-bank-08.txt','ra-bank-09.txt','ra-bank-10.txt'];
          const b64=files.map(f=>fs.readFileSync('/tmp/live/'+f,'utf8').trim()).join('').replace(/\s+/g,'');
          const data=JSON.parse(zlib.gunzipSync(Buffer.from(b64,'base64')).toString('utf8'));
          if(data.q.length!==10||data.q.some(s=>s.length!==100))throw new Error('LIVE academic bank invalid');
          const prompts=data.q.flat().map(r=>data.s[r[1]]);
          if(new Set(prompts).size!==1000)throw new Error('LIVE academic prompts duplicate');
          console.log('PASS LIVE K-EXAM NOVA v18 + centralized item analytics + subtopic practice: 1,000 academic questions');
          NODE
