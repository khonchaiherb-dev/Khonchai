name: K-EXAM Verify
on:
  push:
    paths:
      - '.github/workflows/kexam-bank-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify K-EXAM v10 source and banks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1
          git show origin/gh-pages:tax-exam/index.html | grep -q 'app-v3.js?v=10'
          git show origin/gh-pages:tax-exam/index.html | grep -q 'positions-v10.css?v=10'
          git show origin/gh-pages:tax-exam/index.html | grep -q '2,000'
          git show origin/gh-pages:tax-exam/manifest.webmanifest | grep -q '2,000'
          for f in app-v3.js app-v3-part1.txt app-v3-part2.txt app-v3-part3.txt app-v3-part4.txt positions-v10.css sw-v2.js manifest.webmanifest; do
            git cat-file -e "origin/gh-pages:tax-exam/$f"
          done
          git show origin/gh-pages:tax-exam/app-v3-part1.txt > /tmp/p1
          git show origin/gh-pages:tax-exam/app-v3-part2.txt > /tmp/p2
          git show origin/gh-pages:tax-exam/app-v3-part3.txt > /tmp/p3
          git show origin/gh-pages:tax-exam/app-v3-part4.txt > /tmp/p4
          cat /tmp/p1 /tmp/p2 /tmp/p3 /tmp/p4 > /tmp/app-source.js
          node --check /tmp/app-source.js
          grep -q 'นักตรวจสอบภาษีปฏิบัติการ' /tmp/app-source.js
          grep -q 'นักวิชาการสรรพากรปฏิบัติการ' /tmp/app-source.js
          grep -q 'ส่งคำตอบและประมวลผลคะแนน' /tmp/app-source.js
          grep -q 'ดูเฉลยทั้ง 100 ข้อ' /tmp/app-source.js
          node <<'NODE'
          const cp=require('child_process'),zlib=require('zlib');
          const show=f=>cp.execFileSync('git',['show',`origin/gh-pages:tax-exam/${f}`],{encoding:'utf8',maxBuffer:4*1024*1024}).trim();
          const tax=['bank-01.txt','bank-02-03.txt','bank-04-05.txt','bank-06-07.txt','bank-08-09.txt','bank-10-11.txt','bank-12-13.txt','bank-14-15.txt','bank-16-17.txt','bank-18.txt'];
          const academic=['ra-bank-01.txt','ra-bank-02a.txt','ra-bank-02b.txt','ra-bank-03a.txt','ra-bank-03b.txt','ra-bank-04.txt','ra-bank-05.txt','ra-bank-06.txt','ra-bank-07.txt','ra-bank-08.txt','ra-bank-09.txt','ra-bank-10.txt'];
          function decode(files,label){
            const b64=files.map(show).join('').replace(/\s+/g,'');
            const raw=Buffer.from(b64,'base64');
            if(raw[0]!==0x1f||raw[1]!==0x8b)throw new Error(label+' is not gzip');
            const data=JSON.parse(zlib.gunzipSync(raw).toString('utf8'));
            if(!Array.isArray(data.q)||data.q.length!==10||data.q.some(s=>!Array.isArray(s)||s.length!==100))throw new Error(label+' must be 10 x 100');
            for(const [si,set] of data.q.entries()){
              const answers=[0,0,0,0];
              for(const r of set){if(!Number.isInteger(r[3])||r[3]<0||r[3]>3)throw new Error(`${label} bad answer`);answers[r[3]]++}
              if(label==='academic'&&answers.some(n=>n!==25))throw new Error(`${label} set ${si+1} answer balance ${answers}`);
            }
            const prompts=data.q.flat().map(r=>data.s[r[1]]);
            if(label==='academic'&&new Set(prompts).size!==1000)throw new Error(label+' has exact duplicate prompts');
            const cats={};for(const r of data.q.flat()){const c=data.s[r[0]];cats[c]=(cats[c]||0)+1}
            if(label==='academic'&&Object.keys(cats).length!==4)throw new Error('academic categories must be 4: '+JSON.stringify(cats));
            console.log(`PASS ${label}: 10 sets x 100; unique=${new Set(prompts).size}; categories=${JSON.stringify(cats)}`);
          }
          decode(tax,'tax-auditor');
          decode(academic,'academic');
          NODE
      - name: Verify public GitHub Pages v10
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://khonchaiherb-dev.github.io/Khonchai/tax-exam'
          mkdir -p /tmp/live
          curl -fsSL --retry 15 --retry-all-errors --retry-delay 4 -H 'Cache-Control: no-cache' "$BASE/index.html?v=10-$GITHUB_SHA" -o /tmp/live/index.html
          grep -q 'app-v3.js?v=10' /tmp/live/index.html
          grep -q 'positions-v10.css?v=10' /tmp/live/index.html
          files=(app-v3.js app-v3-part1.txt app-v3-part2.txt app-v3-part3.txt app-v3-part4.txt positions-v10.css ra-bank-01.txt ra-bank-02a.txt ra-bank-02b.txt ra-bank-03a.txt ra-bank-03b.txt ra-bank-04.txt ra-bank-05.txt ra-bank-06.txt ra-bank-07.txt ra-bank-08.txt ra-bank-09.txt ra-bank-10.txt)
          for f in "${files[@]}"; do curl -fsSL --retry 15 --retry-all-errors --retry-delay 4 -H 'Cache-Control: no-cache' "$BASE/$f?v=10-$GITHUB_SHA" -o "/tmp/live/$f"; done
          cat /tmp/live/app-v3-part1.txt /tmp/live/app-v3-part2.txt /tmp/live/app-v3-part3.txt /tmp/live/app-v3-part4.txt > /tmp/live/combined.js
          node --check /tmp/live/combined.js
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const files=['ra-bank-01.txt','ra-bank-02a.txt','ra-bank-02b.txt','ra-bank-03a.txt','ra-bank-03b.txt','ra-bank-04.txt','ra-bank-05.txt','ra-bank-06.txt','ra-bank-07.txt','ra-bank-08.txt','ra-bank-09.txt','ra-bank-10.txt'];
          const b64=files.map(f=>fs.readFileSync('/tmp/live/'+f,'utf8').trim()).join('').replace(/\s+/g,'');
          const data=JSON.parse(zlib.gunzipSync(Buffer.from(b64,'base64')).toString('utf8'));
          if(data.q.length!==10||data.q.some(s=>s.length!==100))throw new Error('LIVE academic bank invalid');
          const prompts=data.q.flat().map(r=>data.s[r[1]]);
          if(new Set(prompts).size!==1000)throw new Error('LIVE academic prompts duplicate');
          console.log('PASS LIVE K-EXAM v10 academic bank: 1,000 questions');
          NODE
