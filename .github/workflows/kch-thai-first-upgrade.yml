name: Apply KHONCHAIHERB Thai-first storefront upgrade

on:
  push:
    branches:
      - storefront-social-commerce
    paths:
      - .kch-thai-first-trigger

permissions:
  contents: write

jobs:
  thai-first-upgrade:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout storefront branch
        uses: actions/checkout@v6
        with:
          ref: storefront-social-commerce
          fetch-depth: 0

      - name: Apply Thai-first customer UI
        run: python .github/scripts/kch_thai_first.py

      - name: Commit Thai-first storefront
        shell: bash
        run: |
          git config user.name "khonchaiherb-dev"
          git config user.email "khonchaiherb@gmail.com"
          git add public/tshop-v161-hotfix.js public/tshop-v118.js
          if git diff --cached --quiet; then
            echo "No storefront language changes needed."
          else
            git commit -m "feat: make customer storefront Thai-first"
            git push origin HEAD:storefront-social-commerce
          fi

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy Thai-first storefront to Cloudflare Pages
        shell: bash
        run: |
          npx --yes wrangler@latest pages deploy public \
            --project-name=khonchaiherb-commerce \
            --branch=storefront-social-commerce \
            --commit-message="feat: make customer storefront Thai-first"
