name: K-EXAM Publication Lifecycle Verify
on:
  push:
    paths:
      - '.github/workflows/kexam-publication-lifecycle-verify.yml'
      - 'docs/KEXAM_QUESTION_LIFECYCLE.md'
      - 'docs/KEXAM_QUESTION_STANDARD.md'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify lifecycle manifest against deployed banks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1
          grep -q 'SOURCE_GATE_THRESHOLD=70' .github/workflows/kexam-apply-lifecycle-decisions.yml
          grep -q 'validatePublishSourceGate' .github/workflows/kexam-apply-lifecycle-decisions.yml
          grep -q 'SOURCE GATE SELF-TEST PASS' .github/workflows/kexam-apply-lifecycle-decisions.yml
          node <<'NODE'
          const cp=require('child_process'),zlib=require('zlib'),crypto=require('crypto');
          const show=p=>cp.execFileSync('git',['show',`origin/gh-pages:${p}`],{encoding:'utf8',maxBuffer:12*1024*1024}).trim();
          const manifest=JSON.parse(show('tax-exam/question-publication-manifest.json'));
          const integrity=JSON.parse(show('tax-exam/question-content-integrity.json'));
          const backlog=JSON.parse(show('tax-exam/source-verification-backlog.json'));
          if(backlog.schema_version!==1||!Array.isArray(backlog.rows))throw new Error('invalid source-verification backlog');
          let batchRegistry=null;
          try{batchRegistry=JSON.parse(show('tax-exam/source-review-batch-registry.json'))}catch(e){
            console.log('SOURCE REVIEW BATCH REGISTRY not initialized yet');
          }
          if(batchRegistry){
            if(batchRegistry.schema_version!==1||!Array.isArray(batchRegistry.batches))throw new Error('invalid source review batch registry');
            const idRe=/^SRB-\d{8}-[a-f0-9]{12}$/,hashRe=/^[a-f0-9]{64}$/,qidRe=/^(RA|TA)-S(0[1-9]|10)-Q(0[0-9]{2}|100)$/;
            const seenBatch=new Set();
            const forbidden=['prompt','choices','correct_answer','explanation','wrong_reasons','source_refs'];
            for(const b of batchRegistry.batches){
              if(!idRe.test(String(b.batch_id||'')))throw new Error('invalid registry batch_id '+b.batch_id);
              if(seenBatch.has(b.batch_id))throw new Error('duplicate registry batch_id '+b.batch_id);seenBatch.add(b.batch_id);
              if(!hashRe.test(String(b.batch_snapshot_sha256||'')))throw new Error('invalid registry snapshot '+b.batch_id);
              if(!['pending','reverify'].includes(String(b.review_mode||'')))throw new Error('invalid registry review_mode '+b.batch_id);
              if(!['generated','applied'].includes(String(b.status||'')))throw new Error('invalid registry status '+b.batch_id);
              if(!Array.isArray(b.question_ids)||b.question_ids.length!==Number(b.batch_size||0))throw new Error('registry batch_size mismatch '+b.batch_id);
              if(new Set(b.question_ids).size!==b.question_ids.length||b.question_ids.some(id=>!qidRe.test(String(id))))throw new Error('invalid/duplicate registry Question IDs '+b.batch_id);
              const serialized=JSON.stringify(b);
              for(const key of forbidden)if(serialized.includes('"'+key+'"'))throw new Error('registry leaks private review field '+key+' in '+b.batch_id);
              if(b.status==='applied'){
                if(!String(b.applied_at||'').trim()||!b.decision_counts)throw new Error('applied registry entry missing applied_at/decision_counts '+b.batch_id);
                const counts=b.decision_counts||{},sum=(Number(counts.verified)||0)+(Number(counts.needs_revision)||0)+(Number(counts.retired)||0);
                if(sum!==b.question_ids.length)throw new Error('applied registry decision counts mismatch '+b.batch_id);
                if(!Array.isArray(b.applied_question_ids)||new Set(b.applied_question_ids).size!==b.question_ids.length)throw new Error('applied registry Question ID coverage mismatch '+b.batch_id);
              }
            }
            console.log('PASS source review batch registry',JSON.stringify({batches:batchRegistry.batches.length,generated:batchRegistry.batches.filter(x=>x.status==='generated').length,applied:batchRegistry.batches.filter(x=>x.status==='applied').length}));
          }
          const urgentPending=backlog.rows.filter(x=>Number(x.priority_score)>=70);
          console.log('SOURCE GATE GRANDFATHERED CURRENTLY PUBLISHED',JSON.stringify({threshold:70,urgent_pending:urgentPending.length,note:'existing Published items are not withdrawn retroactively; future Verified->Published transitions are gated'}));
          if(integrity.schema_version!==1||integrity.algorithm!=='sha256')throw new Error('invalid question-content-integrity schema');
          if(Object.keys(integrity.questions||{}).length!==2000)throw new Error('content integrity baseline must contain exactly 2,000 Question IDs');
          const canonical=(data,r)=>JSON.stringify({
            category:String(data.s[r[0]]??''),
            prompt:String(data.s[r[1]]??''),
            choices:(r[2]||[]).map(i=>String(data.s[i]??'')),
            answer:r[3],
            explanation:String(data.s[r[4]]??''),
            wrong_reasons:String(data.s[r[5]]??'')
          });
          const sha256=x=>crypto.createHash('sha256').update(x,'utf8').digest('hex');
          const order=['Draft','Reviewed','Verified','Published','Retired'];
          if(manifest.schema_version!==1)throw new Error('manifest schema_version must be 1');
          if(JSON.stringify(manifest.lifecycle_order)!==JSON.stringify(order))throw new Error('lifecycle_order must be Draft -> Reviewed -> Verified -> Published -> Retired');
          if(manifest.publication_policy?.live_status!=='Published')throw new Error('live_status must be Published');
          if(manifest.publication_policy?.required_qa_state!=='verified')throw new Error('Published QA policy must require verified');
          if(manifest.defaults?.Published?.qa_state!=='verified')throw new Error('Published default qa_state must be verified');
          const allowedSource=new Set(['pending','verified','not-applicable']);
          if(!allowedSource.has(manifest.defaults?.Published?.source_state))throw new Error('invalid Published source_state');

          const configs={
            'tax-auditor':{
              prefix:'TA',
              files:['bank-01.txt','bank-02-03.txt','bank-04-05.txt','bank-06-07.txt','bank-08-09.txt','bank-10-11.txt','bank-12-13.txt','bank-14-15.txt','bank-16-17.txt','bank-18.txt']
            },
            'revenue-academic':{
              prefix:'RA',
              files:['ra-bank-01.txt','ra-bank-02a.txt','ra-bank-02b.txt','ra-bank-03a.txt','ra-bank-03b.txt','ra-bank-04.txt','ra-bank-05.txt','ra-bank-06.txt','ra-bank-07.txt','ra-bank-08.txt','ra-bank-09.txt','ra-bank-10.txt']
            }
          };
          const allKnown=new Set();
          const summaries={};

          for(const [position,cfg] of Object.entries(configs)){
            const p=manifest.positions?.[position];
            if(!p)throw new Error('manifest missing position '+position);
            const b64=cfg.files.map(f=>show('tax-exam/'+f)).join('').replace(/\s+/g,'');
            const bank=JSON.parse(zlib.gunzipSync(Buffer.from(b64,'base64')).toString('utf8'));
            if(!Array.isArray(bank.q)||bank.q.length!==10||bank.q.some(set=>!Array.isArray(set)||set.length!==100))throw new Error(position+' bank must be 10 x 100');
            const bankIds=new Set();
            for(let si=0;si<10;si++)for(let qi=0;qi<100;qi++){
              const id=`${cfg.prefix}-S${String(si+1).padStart(2,'0')}-Q${String(qi+1).padStart(3,'0')}`;
              bankIds.add(id);
              const baseline=integrity.questions?.[id];
              if(!baseline)throw new Error('content integrity baseline missing '+id);
              if(baseline.position!==position)throw new Error('content integrity position mismatch for '+id);
              const currentHash=sha256(canonical(bank,bank.q[si][qi]));
              if(baseline.sha256!==currentHash)throw new Error('CONTENT INTEGRITY MISMATCH '+id+' — move the item out of Published, review/QA it, then intentionally refresh baseline');
            }

            const fields={Draft:'draft_ids',Reviewed:'reviewed_ids',Verified:'verified_ids',Published:'published_ids',Retired:'retired_ids'};
            const lifecycleMembership=new Map();
            for(const [status,field] of Object.entries(fields)){
              if(!Array.isArray(p[field]))throw new Error(position+' missing '+field);
              if(new Set(p[field]).size!==p[field].length)throw new Error(position+' duplicate IDs inside '+field);
              for(const id of p[field]){
                if(!new RegExp('^'+cfg.prefix+'-S(0[1-9]|10)-Q(0[0-9]{2}|100)$').test(id))throw new Error('invalid '+position+' Question ID '+id);
                if(!bankIds.has(id))throw new Error(position+' lifecycle ID not found in bank: '+id);
                const prev=lifecycleMembership.get(id);
                if(prev)throw new Error(id+' belongs to multiple lifecycle states: '+prev+' and '+status);
                lifecycleMembership.set(id,status);allKnown.add(id);
              }
            }
            if(lifecycleMembership.size!==bankIds.size){
              const missing=[...bankIds].filter(id=>!lifecycleMembership.has(id)).slice(0,20);
              throw new Error(position+' lifecycle does not cover all bank IDs; missing '+missing.join(', '));
            }
            const published=new Set(p.published_ids);
            if(!published.size)throw new Error(position+' must have at least one Published question');
            const sourceVerified=new Set(p.source_verified_ids||[]);
            for(const id of sourceVerified){
              if(!bankIds.has(id))throw new Error('source_verified ID not in bank: '+id);
              const status=lifecycleMembership.get(id);
              if(status!=='Verified'&&status!=='Published')throw new Error('source_verified ID must be Verified or Published: '+id);
              const o=manifest.source_overrides?.[id];
              if(!o||o.source_state!=='verified'||!Array.isArray(o.source_refs)||!o.source_refs.length)throw new Error('source_verified ID needs verified source_overrides with source_refs: '+id);
              if(o.content_hash_algorithm!=='sha256'||!String(o.content_sha256||'').match(/^[a-f0-9]{64}$/))throw new Error('source_verified ID needs SHA-256 content binding: '+id);
              if(o.content_sha256!==integrity.questions?.[id]?.sha256)throw new Error('source_verified content hash does not match current baseline: '+id);
            }
            summaries[position]={
              Draft:p.draft_ids.length,Reviewed:p.reviewed_ids.length,Verified:p.verified_ids.length,
              Published:p.published_ids.length,Retired:p.retired_ids.length,sourceVerified:sourceVerified.size,
              sourcePending:p.published_ids.length-[...sourceVerified].filter(id=>published.has(id)).length
            };
          }

          for(const [id,o] of Object.entries(manifest.source_overrides||{})){
            if(!allKnown.has(id))throw new Error('source_overrides contains unknown ID '+id);
            if(!allowedSource.has(o.source_state))throw new Error('invalid source_state for '+id);
            if(o.source_state==='verified'){
              if(!Array.isArray(o.source_refs)||!o.source_refs.length)throw new Error('verified source needs source_refs for '+id);
              if(o.content_hash_algorithm!=='sha256'||o.content_sha256!==integrity.questions?.[id]?.sha256)throw new Error('verified source content binding invalid for '+id);
              for(const ref of o.source_refs){
                if(!ref||typeof ref!=='object'||!String(ref.title||'').trim()||!String(ref.url||'').trim()||!/^\d{4}-\d{2}-\d{2}$/.test(String(ref.checked_at||''))){
                  throw new Error('source_ref must include title, url, checked_at YYYY-MM-DD for '+id);
                }
              }
            }
          }

          const app=show('tax-exam/app-v3-part1.txt')+'\n'+show('tax-exam/app-v3-part2.txt')+'\n'+show('tax-exam/app-v3-part3.txt')+'\n'+show('tax-exam/app-v3-part4.txt');
          const sw=show('tax-exam/sw-v2.js');
          const admin=show('tax-exam/admin/admin-v13.js');
          for(const needle of ['loadPublicationManifest','isPublishedQuestionId','publicationInfo','question-publication-manifest.json'])if(!app.includes(needle))throw new Error('runtime publication gate missing '+needle);
          if(!sw.includes('question-publication-manifest.json'))throw new Error('service worker does not cache publication manifest');
          if(!sw.includes('question-content-integrity.json'))throw new Error('service worker does not cache content integrity baseline');
          if(!admin.includes('publicationCoverageHtml'))throw new Error('admin publication coverage missing');
          if(!admin.includes('contentIntegrityCoverageHtml'))throw new Error('admin content integrity coverage missing');
          if(!admin.includes('question-content-integrity.json'))throw new Error('admin integrity baseline fetch missing');
          console.log('PASS publication lifecycle + content integrity',JSON.stringify(summaries));
          NODE
