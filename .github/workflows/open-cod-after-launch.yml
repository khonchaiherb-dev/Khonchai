name: KHONCHAIHERB Open COD After Verified Launch

on:
  push:
    branches: [storefront-social-commerce]
    paths:
      - 'functions/api/internal/launch-product-bootstrap.js'
      - 'functions/_middleware.js'
      - 'public/kch-live-catalog-guard.js'
      - '.github/workflows/open-cod-after-launch.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: khonchaiherb-open-cod-production
  cancel-in-progress: true

jobs:
  open-cod:
    name: Verify all gates and enable COD
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE_ORIGIN: https://khonchaiherb-commerce.pages.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: khonchaiherb-commerce
    steps:
      - name: Checkout production source branch
        uses: actions/checkout@v7
        with:
          ref: storefront-social-commerce

      - name: Wait for verified launch gates
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          mode=''
          for attempt in $(seq 1 240); do
            curl --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/health" > health-before.json || true
            curl --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/products" > products-before.json || true
            curl --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/payment-options" > payments-before.json || true
            curl --silent --show-error --location --max-time 20 "$SITE_ORIGIN/" > storefront-before.html || true
            curl --silent --show-error --location --max-time 20 "$SITE_ORIGIN/kch-live-catalog-guard.js?v=1.0.0" > catalog-guard.js || true
            if python3 - <<'PY' > preflight-mode.txt
          import json
          try:
              h=json.load(open('health-before.json')); p=json.load(open('products-before.json')); pay=json.load(open('payments-before.json'))
          except Exception: raise SystemExit(1)
          required={
            'databaseReady':h.get('databaseReady') is True,
            'catalogSchemaReady':h.get('catalogSchemaReady') is True,
            'orderSchemaReady':h.get('orderSchemaReady') is True,
            'saleReadyProducts':int(h.get('saleReadyProducts') or 0)>=1,
            'productMediaConfigured':h.get('productMediaConfigured') is True,
            'packingVerificationRequired':h.get('packingVerificationRequired') is True,
            'orderIdempotencyRequired':h.get('orderIdempotencyRequired') is True,
            'staffCsrfEnforced':h.get('staffCsrfEnforced') is True,
            'legacyBrowserAdminDisabled':h.get('legacyBrowserAdminEnabled') is False,
            'adminBridgeConfigured':h.get('adminBridgeConfigured') is True,
            'customerAuthConfigured':h.get('customerAuthConfigured') is True,
            'rateLimitPepperConfigured':h.get('rateLimitPepperConfigured') is True,
            'securityBaselineConfigured':h.get('securityBaselineConfigured') is True,
          }
          if not all(required.values()): raise SystemExit(1)
          rows=p.get('products') or []
          if len(rows)!=1: raise SystemExit(1)
          r=rows[0]
          if r.get('slug')!='rang-jued-tea' or float(r.get('price') or 0)!=120 or int(r.get('stock') or 0)!=1: raise SystemExit(1)
          checkout=h.get('checkoutEnabled') is True; cod=h.get('codConfigured') is True
          if checkout != cod: raise SystemExit(1)
          if checkout:
              if h.get('codLaunchReady') is not True or pay.get('checkoutEnabled') is not True: raise SystemExit(1)
              print('already_open')
          else:
              if pay.get('checkoutEnabled') is True: raise SystemExit(1)
              print('open')
          PY
            then
              if grep -Fq 'kch-live-catalog-guard.js?v=1.0.0' storefront-before.html && grep -Fq '__KCH_LIVE_CATALOG_GUARD__' catalog-guard.js; then
                mode=$(cat preflight-mode.txt)
                ready=1
                break
              fi
            fi
            if [ $((attempt % 20)) -eq 0 ]; then echo "Launch gates not complete yet ($attempt/240)"; fi
            sleep 3
          done
          [ "$ready" = "1" ] || { echo 'Refusing COD activation because verified production launch gates did not become ready.' >&2; exit 1; }
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Production launch preflight passed: $mode"

      - name: Enable Checkout and COD only
        if: steps.preflight.outputs.mode == 'open'
        shell: bash
        run: |
          set -euo pipefail
          cat > enable-cod.json <<'JSON'
          {"deployment_configs":{"production":{"env_vars":{"CHECKOUT_ENABLED":{"type":"plain_text","value":"true"},"COD_ENABLED":{"type":"plain_text","value":"true"},"ONLINE_PAYMENTS_ENABLED":{"type":"plain_text","value":"false"}}}}}
          JSON
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @enable-cod.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" > enable-cod-result.json
          python3 - <<'PY'
          import json
          d=json.load(open('enable-cod-result.json'))
          assert d.get('success') is True, d.get('errors')
          print('Production config requests Checkout=true, COD=true, Online payments=false.')
          PY

      - name: Deploy current production source with COD flags
        if: steps.preflight.outputs.mode == 'open'
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          npx --yes wrangler@latest pages deploy public \
            --project-name="$PAGES_PROJECT" \
            --branch="storefront-social-commerce" \
            --commit-hash="$SHA" \
            --commit-message="open verified COD launch"

      - name: Verify COD is live without creating an order
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 90); do
            curl --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/health" > health-after.json || true
            curl --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/payment-options" > payments-after.json || true
            if python3 - <<'PY'
          import json
          try:
              h=json.load(open('health-after.json')); p=json.load(open('payments-after.json'))
          except Exception: raise SystemExit(1)
          if h.get('codLaunchReady') is not True or h.get('orderIntakeReady') is not True: raise SystemExit(1)
          if h.get('launchBlockers'): raise SystemExit(1)
          if h.get('securityBaselineConfigured') is not True: raise SystemExit(1)
          if p.get('checkoutEnabled') is not True: raise SystemExit(1)
          cap=next((x for x in (p.get('capabilities') or []) if x.get('id')=='COD'),None)
          if not cap or cap.get('enabled') is not True: raise SystemExit(1)
          if 'COD' not in {x.get('id') for x in (p.get('methods') or [])}: raise SystemExit(1)
          print('COD order intake is live; no test order was created.')
          PY
            then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = "1" ] || { echo 'COD activation did not pass post-deploy smoke checks.' >&2; exit 1; }

      - name: Verify order API gate is no longer closed
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --location --max-time 20 --output invalid-order.json --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{"items":[]}' "$SITE_ORIGIN/api/orders")
          [ "$code" = "400" ] || { echo "Expected safe empty-order validation HTTP 400 after COD opening, got $code" >&2; exit 1; }
          grep -Fq 'empty_order' invalid-order.json
          echo 'Order API is open behind validation; no order was created.'

      - name: Publish launch verdict
        shell: bash
        run: |
          echo '### KHONCHAIHERB COD launch' >> "$GITHUB_STEP_SUMMARY"
          echo '- Verified product: Rang Jued 30 sachets' >> "$GITHUB_STEP_SUMMARY"
          echo '- Launch price: THB 120' >> "$GITHUB_STEP_SUMMARY"
          echo '- Web safety stock cap: 1' >> "$GITHUB_STEP_SUMMARY"
          echo '- Checkout: ENABLED' >> "$GITHUB_STEP_SUMMARY"
          echo '- COD: ENABLED' >> "$GITHUB_STEP_SUMMARY"
          echo '- Online payment: DISABLED' >> "$GITHUB_STEP_SUMMARY"
          echo '- Storefront live-catalog guard: ACTIVE' >> "$GITHUB_STEP_SUMMARY"
          echo '- Smoke test: PASS without creating an order' >> "$GITHUB_STEP_SUMMARY"
