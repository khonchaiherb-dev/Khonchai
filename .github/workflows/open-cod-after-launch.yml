name: KHONCHAIHERB Open COD After Verified Launch

on:
  push:
    branches: [storefront-social-commerce]
    paths:
      - 'functions/api/internal/launch-product-bootstrap.js'
      - 'functions/_middleware.js'
      - 'public/kch-live-catalog-guard.js'
      - '.github/workflows/open-cod-after-launch.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: khonchaiherb-open-cod-production
  cancel-in-progress: true

jobs:
  open-cod:
    name: Verify all gates and enable COD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_ORIGIN: https://khonchaiherb-commerce.pages.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: khonchaiherb-commerce
      PRODUCTION_BRANCH: storefront-social-commerce
    steps:
      - name: Checkout production source branch
        uses: actions/checkout@v7
        with:
          ref: storefront-social-commerce

      - name: Pin Cloudflare Pages production branch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
            > pages-target-before.json
          current=$(python3 - <<'PY'
          import json
          d=json.load(open('pages-target-before.json'))
          assert d.get('success') is True, d.get('errors')
          print((d.get('result') or {}).get('production_branch') or '')
          PY
          )
          echo "Current Cloudflare production branch: ${current:-<empty>}"
          if [ "$current" != "$PRODUCTION_BRANCH" ]; then
            printf '{"production_branch":"%s"}' "$PRODUCTION_BRANCH" > set-production-branch.json
            curl --fail --silent --show-error -X PATCH \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data @set-production-branch.json \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
              > set-production-branch-result.json
            python3 - <<'PY'
          import json
          d=json.load(open('set-production-branch-result.json'))
          assert d.get('success') is True, d.get('errors')
          actual=(d.get('result') or {}).get('production_branch') or ''
          assert actual=='storefront-social-commerce', f'unexpected production branch: {actual}'
          print('Cloudflare production branch pinned to storefront-social-commerce.')
          PY
          else
            echo 'Cloudflare production branch already correct.'
          fi

      - name: Wait for commerce launch surface
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 120); do
            curl --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/health" > health-before.json || true
            curl --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/products" > products-before.json || true
            curl --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/payment-options" > payments-before.json || true
            curl --silent --show-error --location --max-time 20 "$SITE_ORIGIN/" > storefront-before.html || true
            curl --silent --show-error --location --max-time 20 "$SITE_ORIGIN/kch-live-catalog-guard.js?v=1.0.0" > catalog-guard.js || true
            if python3 - <<'PY'
          import json
          try:
              h=json.load(open('health-before.json')); p=json.load(open('products-before.json'))
          except Exception: raise SystemExit(1)
          if h.get('databaseReady') is not True or h.get('catalogSchemaReady') is not True or h.get('orderSchemaReady') is not True: raise SystemExit(1)
          if int(h.get('saleReadyProducts') or 0)<1 or h.get('productMediaConfigured') is not True: raise SystemExit(1)
          rows=p.get('products') or []
          if len(rows)!=1: raise SystemExit(1)
          r=rows[0]
          if r.get('slug')!='rang-jued-tea' or float(r.get('price') or 0)!=120 or int(r.get('stock') or 0)!=1: raise SystemExit(1)
          raise SystemExit(0)
          PY
            then
              if grep -Fq 'kch-live-catalog-guard.js?v=1.0.0' storefront-before.html && grep -Fq '__KCH_LIVE_CATALOG_GUARD__' catalog-guard.js; then ready=1; break; fi
            fi
            if [ $((attempt % 20)) -eq 0 ]; then echo "Commerce surface not complete yet ($attempt/120)"; fi
            sleep 3
          done
          [ "$ready" = "1" ] || { echo 'Verified product/media/storefront guard did not become ready.' >&2; exit 1; }
          echo 'Commerce launch surface: READY'

      - name: Repair missing production security baseline
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
            > pages-security-before.json
          python3 - <<'PY'
          import json,secrets
          from pathlib import Path
          d=json.load(open('pages-security-before.json'))
          if not d.get('success'):
              raise SystemExit('Cloudflare Pages project lookup failed')
          prod=((d.get('result') or {}).get('deployment_configs') or {}).get('production') or {}
          current=prod.get('env_vars') or {}
          patch={
            'LEGACY_ADMIN_ENABLED':{'type':'plain_text','value':'false'},
            'STAFF_CSRF_ENFORCE':{'type':'plain_text','value':'true'},
            'PACKING_REQUIRE_VERIFICATION':{'type':'plain_text','value':'true'},
            'ORDER_IDEMPOTENCY_REQUIRED':{'type':'plain_text','value':'true'},
          }
          generated=[]
          for name in ('ADMIN_TOKEN','AUTH_PEPPER','RATE_LIMIT_PEPPER'):
              if not current.get(name):
                  patch[name]={'type':'secret_text','value':secrets.token_hex(32)}
                  generated.append(name)
          Path('security-baseline-patch.json').write_text(json.dumps({'deployment_configs':{'production':{'env_vars':patch}}}))
          print('Security baseline plain flags enforced.')
          print('Generated only missing secret keys: '+(','.join(generated) if generated else 'none'))
          PY
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @security-baseline-patch.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
            > security-baseline-result.json
          python3 - <<'PY'
          import json
          d=json.load(open('security-baseline-result.json'))
          assert d.get('success') is True, d.get('errors')
          print('Production security baseline configuration accepted by Cloudflare.')
          PY

      - name: Deploy security baseline before COD
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          npx --yes wrangler@latest pages deploy public \
            --project-name="$PAGES_PROJECT" \
            --branch="$PRODUCTION_BRANCH" \
            --commit-hash="$SHA" \
            --commit-message="enforce production security baseline before COD"

      - name: Wait for repaired security baseline
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 60); do
            curl --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/health" > health-security-repaired.json || true
            if python3 - <<'PY'
          import json
          try: h=json.load(open('health-security-repaired.json'))
          except Exception: raise SystemExit(1)
          checks=[
            h.get('packingVerificationRequired') is True,
            h.get('orderIdempotencyRequired') is True,
            h.get('staffCsrfEnforced') is True,
            h.get('legacyBrowserAdminEnabled') is False,
            h.get('adminBridgeConfigured') is True,
            h.get('customerAuthConfigured') is True,
            h.get('rateLimitPepperConfigured') is True,
            h.get('securityBaselineConfigured') is True,
          ]
          raise SystemExit(0 if all(checks) else 1)
          PY
            then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = "1" ] || { echo 'Production security baseline did not become ready after repair.' >&2; exit 1; }
          echo 'Production security baseline: READY'

      - name: Report sanitized security gates
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/health" > health-security.json
          curl --fail --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/payment-options" > payments-security.json
          python3 - <<'PY' | tee security-gates.txt
          import json
          h=json.load(open('health-security.json')); pay=json.load(open('payments-security.json'))
          checks={
            'packingVerificationRequired':h.get('packingVerificationRequired') is True,
            'orderIdempotencyRequired':h.get('orderIdempotencyRequired') is True,
            'staffCsrfEnforced':h.get('staffCsrfEnforced') is True,
            'legacyBrowserAdminDisabled':h.get('legacyBrowserAdminEnabled') is False,
            'adminBridgeConfigured':h.get('adminBridgeConfigured') is True,
            'customerAuthConfigured':h.get('customerAuthConfigured') is True,
            'rateLimitPepperConfigured':h.get('rateLimitPepperConfigured') is True,
            'securityBaselineConfigured':h.get('securityBaselineConfigured') is True,
          }
          for k,v in checks.items(): print(f'{k}={str(v).lower()}')
          checkout=h.get('checkoutEnabled') is True; cod=h.get('codConfigured') is True
          print('checkoutEnabled='+str(checkout).lower())
          print('codConfigured='+str(cod).lower())
          failed=[k for k,v in checks.items() if not v]
          print('failedSecurityGates='+(','.join(failed) if failed else 'none'))
          if failed: raise SystemExit('SECURITY_GATE_BLOCKED:'+','.join(failed))
          if checkout!=cod: raise SystemExit('CHECKOUT_COD_FLAG_MISMATCH')
          if checkout:
              if h.get('codLaunchReady') is not True or pay.get('checkoutEnabled') is not True: raise SystemExit('ALREADY_OPEN_STATE_INCONSISTENT')
              print('MODE=already_open')
          else:
              if pay.get('checkoutEnabled') is True: raise SystemExit('PAYMENT_API_OPEN_EARLY')
              print('MODE=open')
          PY
          mode=$(awk -F= '/^MODE=/{print $2}' security-gates.txt)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo 'Only boolean readiness was reported; no secret values were read or printed.'

      - name: Enable Checkout and COD only
        if: steps.preflight.outputs.mode == 'open'
        shell: bash
        run: |
          set -euo pipefail
          cat > enable-cod.json <<'JSON'
          {"deployment_configs":{"production":{"env_vars":{"CHECKOUT_ENABLED":{"type":"plain_text","value":"true"},"COD_ENABLED":{"type":"plain_text","value":"true"},"ONLINE_PAYMENTS_ENABLED":{"type":"plain_text","value":"false"}}}}}
          JSON
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @enable-cod.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" > enable-cod-result.json
          python3 - <<'PY'
          import json
          d=json.load(open('enable-cod-result.json'))
          assert d.get('success') is True, d.get('errors')
          print('Production config requests Checkout=true, COD=true, Online payments=false.')
          PY

      - name: Deploy current production source with COD flags
        if: steps.preflight.outputs.mode == 'open'
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          npx --yes wrangler@latest pages deploy public \
            --project-name="$PAGES_PROJECT" \
            --branch="$PRODUCTION_BRANCH" \
            --commit-hash="$SHA" \
            --commit-message="open verified COD launch"

      - name: Verify COD is live without creating an order
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 90); do
            curl --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/health" > health-after.json || true
            curl --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/payment-options" > payments-after.json || true
            if python3 - <<'PY'
          import json
          try:
              h=json.load(open('health-after.json')); p=json.load(open('payments-after.json'))
          except Exception: raise SystemExit(1)
          if h.get('codLaunchReady') is not True or h.get('orderIntakeReady') is not True: raise SystemExit(1)
          if h.get('launchBlockers'): raise SystemExit(1)
          if h.get('securityBaselineConfigured') is not True: raise SystemExit(1)
          if p.get('checkoutEnabled') is not True: raise SystemExit(1)
          cap=next((x for x in (p.get('capabilities') or []) if x.get('id')=='COD'),None)
          if not cap or cap.get('enabled') is not True: raise SystemExit(1)
          if 'COD' not in {x.get('id') for x in (p.get('methods') or [])}: raise SystemExit(1)
          print('COD order intake is live; no test order was created.')
          PY
            then ok=1; break; fi
            if [ $((attempt % 10)) -eq 0 ]; then
              python3 - <<'PY' || true
          import json
          try:
              h=json.load(open('health-after.json')); p=json.load(open('payments-after.json'))
              print('Waiting for COD propagation:', {
                'checkoutEnabled':h.get('checkoutEnabled'),
                'codConfigured':h.get('codConfigured'),
                'codLaunchReady':h.get('codLaunchReady'),
                'launchBlockers':h.get('launchBlockers'),
                'paymentCheckoutEnabled':p.get('checkoutEnabled')
              })
          except Exception as e: print('Waiting for readable health/payment JSON:',e)
          PY
            fi
            sleep 3
          done
          [ "$ok" = "1" ] || { echo 'COD activation did not pass post-deploy smoke checks.' >&2; exit 1; }

      - name: Verify order API gate is no longer closed
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --location --max-time 20 --output invalid-order.json --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{"items":[]}' "$SITE_ORIGIN/api/orders")
          [ "$code" = "400" ] || { echo "Expected safe empty-order validation HTTP 400 after COD opening, got $code" >&2; exit 1; }
          grep -Fq 'empty_order' invalid-order.json
          echo 'Order API is open behind validation; no order was created.'

      - name: Publish launch verdict
        shell: bash
        run: |
          echo '### KHONCHAIHERB COD launch' >> "$GITHUB_STEP_SUMMARY"
          echo '- Cloudflare production branch: storefront-social-commerce' >> "$GITHUB_STEP_SUMMARY"
          echo '- Verified product: Rang Jued 30 sachets' >> "$GITHUB_STEP_SUMMARY"
          echo '- Launch price: THB 120' >> "$GITHUB_STEP_SUMMARY"
          echo '- Web safety stock cap: 1' >> "$GITHUB_STEP_SUMMARY"
          echo '- Security baseline: ENFORCED' >> "$GITHUB_STEP_SUMMARY"
          echo '- Checkout: ENABLED' >> "$GITHUB_STEP_SUMMARY"
          echo '- COD: ENABLED' >> "$GITHUB_STEP_SUMMARY"
          echo '- Online payment: DISABLED' >> "$GITHUB_STEP_SUMMARY"
          echo '- Storefront live-catalog guard: ACTIVE' >> "$GITHUB_STEP_SUMMARY"
          echo '- Smoke test: PASS without creating an order' >> "$GITHUB_STEP_SUMMARY"
