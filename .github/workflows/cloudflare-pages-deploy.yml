name: Deploy KHONCHAIHERB to Cloudflare Pages

on:
  push:
    branches:
      - storefront-social-commerce
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: khonchaiherb-commerce
      CANONICAL_ORIGIN: https://khonchaiherb-commerce.pages.dev
      STOREFRONT_COMMERCE_ASSET: /storefront-v1-commerce.css?v=2026.09.05.6
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi

      - name: Resolve configured Pages production branch
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
            > pages-project.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          from pathlib import Path
          d=json.loads(Path('pages-project.json').read_text())
          if not d.get('success'):
              raise SystemExit('Cloudflare Pages project lookup failed')
          branch=str((d.get('result') or {}).get('production_branch') or '').strip()
          if not branch or not re.fullmatch(r'[A-Za-z0-9._/-]{1,200}',branch):
              raise SystemExit('Cloudflare Pages production branch is missing or invalid')
          print('production_branch='+branch)
          PY
          echo "Resolved Cloudflare Pages production target without changing project settings."

      - name: Deploy storefront to Cloudflare Pages production target
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy public \
            --project-name="$PAGES_PROJECT" \
            --branch="${{ steps.pages.outputs.production_branch }}" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="${{ github.event.head_commit.message || 'KHONCHAIHERB production deployment' }}"

      - name: Verify canonical storefront after deployment
        shell: bash
        run: |
          set -euo pipefail
          rm -f canonical-home.html canonical-headers.txt payment-options.json commerce.css
          ok=0
          for attempt in $(seq 1 12); do
            echo "Canonical verification attempt $attempt/12"
            if curl --fail --silent --show-error --max-time 20 \
                -D canonical-headers.txt \
                -o canonical-home.html \
                "$CANONICAL_ORIGIN/?deploy_verify=$GITHUB_SHA" \
              && grep -Fq "$STOREFRONT_COMMERCE_ASSET" canonical-home.html \
              && grep -Eiq '^X-KCH-Storefront:[[:space:]]*v1-clean' canonical-headers.txt \
              && curl --fail --silent --show-error --max-time 20 \
                -o commerce.css "$CANONICAL_ORIGIN$STOREFRONT_COMMERCE_ASSET" \
              && grep -Fq 'KHONCHAIHERB V1 — sell-now commerce polish' commerce.css \
              && curl --fail --silent --show-error --max-time 20 \
                -o payment-options.json "$CANONICAL_ORIGIN/api/payment-options"; then
              if python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('payment-options.json').read_text())
          if d.get('checkoutEnabled') is not True:
              raise SystemExit('checkoutEnabled is not true')
          rows=[]
          rows.extend(d.get('capabilities') or [])
          rows.extend(d.get('methods') or [])
          cod=any(str(x.get('id','')).upper()=='COD' and x.get('enabled') is True for x in rows if isinstance(x,dict))
          if not cod:
              raise SystemExit('COD is not enabled in payment options')
          PY
              then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "Canonical production did not converge to the deployed clean sell-now storefront."
            echo "--- response headers ---"
            cat canonical-headers.txt 2>/dev/null || true
            echo "--- storefront markers ---"
            grep -Eo 'storefront-v1[^" ]+' canonical-home.html 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "PASS canonical production: clean sell-now stylesheet, V1 response marker, Checkout and COD are live."

      - name: Report production target
        shell: bash
        run: |
          echo "### KHONCHAIHERB Pages production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Production branch resolved from Cloudflare project configuration: \`${{ steps.pages.outputs.production_branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Canonical storefront verified after deployment: \`$CANONICAL_ORIGIN\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Checkout + COD verified from canonical runtime without creating a real order." >> "$GITHUB_STEP_SUMMARY"
