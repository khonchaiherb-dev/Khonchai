name: K-EXAM Apply Source Review Decisions
# gh-pages writer safety: targeted concurrency + rebase retry
on:
  push:
    paths:
      - 'data/kexam-source-review-decisions.json'
      - 'docs/KEXAM_SOURCE_REVIEW_PIPELINE.md'
      - '.github/workflows/kexam-apply-source-review-decisions.yml'
  workflow_dispatch:

concurrency:
  group: kexam-publication-manifest-writer
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate source review decisions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1
          node <<'NODE'
          const cp=require('child_process'),fs=require('fs'),crypto=require('crypto');
          const decisions=JSON.parse(fs.readFileSync('data/kexam-source-review-decisions.json','utf8'));
          if(decisions.schema_version!==1)throw new Error('decision schema_version must be 1');
          if(!Array.isArray(decisions.records))throw new Error('decision records must be an array');

          const show=p=>cp.execFileSync('git',['show',`origin/gh-pages:${p}`],{encoding:'utf8',maxBuffer:32*1024*1024});
          const manifest=JSON.parse(show('tax-exam/question-publication-manifest.json'));
          if(manifest.schema_version!==1)throw new Error('publication manifest schema_version must be 1');
          const integrity=JSON.parse(show('tax-exam/question-content-integrity.json'));
          if(integrity.schema_version!==1||integrity.algorithm!=='sha256')throw new Error('invalid content integrity baseline');
          if(Object.keys(integrity.questions||{}).length!==2000)throw new Error('content integrity baseline must contain exactly 2,000 Question IDs');

          const lifecycleFields={
            Draft:'draft_ids',
            Reviewed:'reviewed_ids',
            Verified:'verified_ids',
            Published:'published_ids',
            Retired:'retired_ids'
          };
          const idToPosition=new Map(),idToStatus=new Map();
          for(const [position,p] of Object.entries(manifest.positions||{})){
            for(const [status,field] of Object.entries(lifecycleFields)){
              if(!Array.isArray(p[field]))throw new Error(position+' missing '+field);
              for(const id of p[field]){
                if(idToPosition.has(id))throw new Error('Question ID appears more than once in lifecycle: '+id);
                idToPosition.set(id,position);idToStatus.set(id,status);
              }
            }
          }

          const seen=new Set();
          const allowed=new Set(['verified','needs_revision','retired']);
          const today=new Date().toISOString().slice(0,10);
          const dateRe=/^\d{4}-\d{2}-\d{2}$/;
          const validDate=s=>dateRe.test(String(s||''))&&!Number.isNaN(Date.parse(String(s)+'T00:00:00Z'))&&String(s)<=today;
          const cleanText=(v,name,id,min=1)=>{const s=String(v||'').trim();if(s.length<min)throw new Error(id+' missing/invalid '+name);return s};
          const hashRe=/^[a-f0-9]{64}$/;
          const batchIdRe=/^SRB-\d{8}-[a-f0-9]{12}$/;
          const validateReviewedContentHash=(id,rec,baseline)=>{
            const reviewedHash=String(rec?.reviewed_content_sha256||'').trim().toLowerCase();
            const existing=manifest.source_overrides?.[id];
            const legacyApplied=existing?.source_state==='verified'
              && existing?.content_sha256===baseline.sha256
              && String(existing?.reviewed_at||'')===String(rec?.reviewed_at||'')
              && String(existing?.review_note||'').trim()===String(rec?.review_note||'').trim();
            if(!reviewedHash){
              if(legacyApplied)return 'legacy-grandfathered';
              throw new Error(id+' verified decision requires reviewed_content_sha256 from the review batch');
            }
            if(!hashRe.test(reviewedHash))throw new Error(id+' reviewed_content_sha256 must be SHA-256 hex');
            if(reviewedHash!==baseline.sha256)throw new Error(id+' review is stale: reviewed_content_sha256 does not match current content baseline');
            return 'bound';
          };
          const currentDecisionRows=decisions.records.filter(rec=>String(rec?.reviewed_content_sha256||'').trim());
          const hasBatchIdentity=Boolean(String(decisions.batch_id||'').trim()||String(decisions.batch_snapshot_sha256||'').trim()||currentDecisionRows.some(rec=>String(rec?.review_batch_id||'').trim()));
          if(hasBatchIdentity){
            const batchId=String(decisions.batch_id||'').trim(),snapshot=String(decisions.batch_snapshot_sha256||'').trim().toLowerCase();
            if(!batchIdRe.test(batchId))throw new Error('invalid or missing batch_id for hash-bound source review decisions');
            if(!hashRe.test(snapshot))throw new Error('invalid or missing batch_snapshot_sha256');
            for(const rec of currentDecisionRows){
              if(String(rec.review_batch_id||'').trim()!==batchId)throw new Error(String(rec.question_id||'record')+' review_batch_id does not match decisions.batch_id');
            }
            const payload=currentDecisionRows.map(rec=>({
              question_id:String(rec.question_id||''),
              content_sha256:String(rec.reviewed_content_sha256||'').trim().toLowerCase()
            })).sort((a,b)=>a.question_id.localeCompare(b.question_id));
            const computed=crypto.createHash('sha256').update(JSON.stringify({review_mode:String(decisions.review_mode||'pending'),questions:payload}),'utf8').digest('hex');
            if(computed!==snapshot)throw new Error('batch_snapshot_sha256 does not match the decision rows');
            const expectedId=`SRB-${String(decisions.updated_at||'').replace(/-/g,'')}-${snapshot.slice(0,12)}`;
            if(batchId!==expectedId)throw new Error('batch_id does not match updated_at + snapshot digest');
            console.log('SOURCE REVIEW BATCH IDENTITY PASS',JSON.stringify({batchId,records:currentDecisionRows.length}));
          }

          {
            const sample=Object.entries(integrity.questions||{}).find(([id])=>!manifest.positions?.[manifest.positions?.['tax-auditor']?.published_ids?.includes(id)?'tax-auditor':'revenue-academic']?.source_verified_ids?.includes(id));
            if(sample){
              const [id,baseline]=sample;
              let blocked=false;
              try{validateReviewedContentHash(id,{reviewed_at:today,review_note:'synthetic source hash self-test'},baseline)}catch(e){blocked=/requires reviewed_content_sha256/.test(String(e.message||e))}
              if(!blocked)throw new Error('reviewed_content_sha256 self-test failed to block unbound verified decision');
              const ok=validateReviewedContentHash(id,{reviewed_at:today,review_note:'synthetic source hash self-test',reviewed_content_sha256:baseline.sha256},baseline);
              if(ok!=='bound')throw new Error('reviewed_content_sha256 self-test failed matching-hash path');
              console.log('SOURCE REVIEW HASH SELF-TEST PASS',id);
            }
          }

          for(const rec of decisions.records){
            const id=cleanText(rec?.question_id,'question_id','record');
            if(seen.has(id))throw new Error('duplicate decision for '+id);seen.add(id);
            if(!idToPosition.has(id))throw new Error('unknown Question ID '+id);
            const decision=String(rec?.decision||'').trim();
            if(!allowed.has(decision))throw new Error(id+' invalid decision '+decision);
            if(!validDate(rec?.reviewed_at))throw new Error(id+' reviewed_at must be valid YYYY-MM-DD and not future');
            cleanText(rec?.review_note,'review_note',id,12);

            if(decision==='verified'){
              const refs=rec?.source_refs;
              if(!Array.isArray(refs)||!refs.length)throw new Error(id+' verified decision requires source_refs');
              for(const [idx,ref] of refs.entries()){
                cleanText(ref?.title,'source_refs['+idx+'].title',id,4);
                const url=cleanText(ref?.url,'source_refs['+idx+'].url',id,8);
                let u;try{u=new URL(url)}catch{throw new Error(id+' invalid source URL '+url)}
                if(u.protocol!=='https:')throw new Error(id+' source URL must use HTTPS');
                if(!validDate(ref?.checked_at))throw new Error(id+' source checked_at must be valid and not future');
                if(ref.section!=null&&String(ref.section).trim().length<2)throw new Error(id+' source section is too short');
              }
              const status=idToStatus.get(id);
              if(status!=='Published'&&status!=='Verified')throw new Error(id+' can only be source-verified from Published or Verified; current='+status);
              const baseline=integrity.questions?.[id];
              if(!baseline||!baseline.sha256)throw new Error(id+' missing content integrity hash');
              if(baseline.position!==idToPosition.get(id))throw new Error(id+' content integrity position mismatch');
              const bindingMode=validateReviewedContentHash(id,rec,baseline);
              if(bindingMode==='legacy-grandfathered')console.log('LEGACY SOURCE REVIEW GRANDFATHERED',id);
            }
          }

          const out=structuredClone(manifest);
          out.source_overrides=out.source_overrides||{};
          let verified=0,needsRevision=0,retired=0;

          const removeFromAll=(p,id)=>{
            for(const field of Object.values(lifecycleFields))p[field]=(p[field]||[]).filter(x=>x!==id);
          };
          const ensureUniquePush=(arr,id)=>{if(!arr.includes(id))arr.push(id);return arr};

          for(const rec of decisions.records){
            const id=String(rec.question_id),position=idToPosition.get(id),p=out.positions[position],decision=String(rec.decision);
            p.source_verified_ids=Array.isArray(p.source_verified_ids)?p.source_verified_ids:[];
            const base={
              reviewed_at:String(rec.reviewed_at),
              review_note:String(rec.review_note).trim()
            };

            if(decision==='verified'){
              p.source_verified_ids=ensureUniquePush(p.source_verified_ids,id);
              out.source_overrides[id]={
                ...(out.source_overrides[id]||{}),
                ...base,
                source_state:'verified',
                content_hash_algorithm:'sha256',
                content_sha256:integrity.questions[id].sha256,
                reviewed_content_sha256:integrity.questions[id].sha256,
                source_refs:rec.source_refs.map(ref=>({
                  title:String(ref.title).trim(),
                  url:String(ref.url).trim(),
                  checked_at:String(ref.checked_at),
                  ...(ref.section?{section:String(ref.section).trim()}:{}),
                  ...(ref.note?{note:String(ref.note).trim()}: {})
                }))
              };
              verified++;
            }else if(decision==='needs_revision'){
              removeFromAll(p,id);ensureUniquePush(p.reviewed_ids,id);
              p.source_verified_ids=p.source_verified_ids.filter(x=>x!==id);
              out.source_overrides[id]={
                ...(out.source_overrides[id]||{}),
                ...base,
                source_state:'pending',
                review_result:'needs_revision'
              };
              delete out.source_overrides[id].content_hash_algorithm;
              delete out.source_overrides[id].content_sha256;
              needsRevision++;
            }else if(decision==='retired'){
              removeFromAll(p,id);ensureUniquePush(p.retired_ids,id);
              p.source_verified_ids=p.source_verified_ids.filter(x=>x!==id);
              out.source_overrides[id]={
                ...(out.source_overrides[id]||{}),
                ...base,
                source_state:'pending',
                review_result:'retired',
                retired_at:String(rec.reviewed_at)
              };
              delete out.source_overrides[id].content_hash_algorithm;
              delete out.source_overrides[id].content_sha256;
              retired++;
            }
          }

          for(const p of Object.values(out.positions||{})){
            for(const field of Object.values(lifecycleFields))p[field]=[...new Set(p[field]||[])].sort();
            p.source_verified_ids=[...new Set(p.source_verified_ids||[])].sort();
          }
          out.generated_at=today;
          fs.writeFileSync('/tmp/question-publication-manifest.json',JSON.stringify(out,null,2)+'\n');
          console.log('SOURCE REVIEW DECISIONS',JSON.stringify({records:decisions.records.length,verified,needsRevision,retired}));
          NODE

      - name: Apply decisions to deployed manifest
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(node -p "require('./data/kexam-source-review-decisions.json').records.length")" = "0" ]; then
            echo "No source review decisions to apply"
            exit 0
          fi
          git fetch origin gh-pages --depth=1
          git checkout -B gh-pages origin/gh-pages
          cp /tmp/question-publication-manifest.json tax-exam/question-publication-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tax-exam/question-publication-manifest.json
          if git diff --cached --quiet; then
            echo "Publication manifest unchanged"
          else
            git commit -m "Apply source review decisions"
            for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            if git rebase origin/gh-pages; then
              if git push origin HEAD:gh-pages; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to update gh-pages after 5 attempts" >&2
          exit 1
          fi

      - name: Refresh source backlog and lifecycle verification
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run kexam-source-verification-backlog.yml --ref main
          gh workflow run kexam-publication-lifecycle-verify.yml --ref main
