name: K-EXAM Academic Quality Gate
on:
  push:
    paths:
      - '.github/workflows/kexam-academic-quality.yml'
      - 'tax-exam/ra-bank-*.txt'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate academic bank using tax-auditor exam standard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1
          node <<'NODE'
          const cp=require('child_process'),zlib=require('zlib');
          const show=f=>cp.execFileSync('git',['show',`origin/gh-pages:tax-exam/${f}`],{encoding:'utf8',maxBuffer:8*1024*1024}).trim();
          const files=['ra-bank-01.txt','ra-bank-02a.txt','ra-bank-02b.txt','ra-bank-03a.txt','ra-bank-03b.txt','ra-bank-04.txt','ra-bank-05.txt','ra-bank-06.txt','ra-bank-07.txt','ra-bank-08.txt','ra-bank-09.txt','ra-bank-10.txt'];
          const required={
            'หลักภาษีอากรและประมวลรัษฎากร':600,
            'กรมสรรพากร':150,
            'เศรษฐกิจ-สังคม-เทคโนโลยี':150,
            'ข้อมูลข่าวสาร/PDPA':100
          };
          const perSet={
            'หลักภาษีอากรและประมวลรัษฎากร':60,
            'กรมสรรพากร':15,
            'เศรษฐกิจ-สังคม-เทคโนโลยี':15,
            'ข้อมูลข่าวสาร/PDPA':10
          };

          const joined=files.map(show).join('').replace(/\s+/g,'');
          if(!/^[A-Za-z0-9+/=]+$/.test(joined))throw new Error('พบอักขระที่ไม่ใช่ Base64 ในคลังข้อสอบ');
          if(joined.length%4!==0)throw new Error('ความยาว Base64 ไม่สมบูรณ์');
          const raw=Buffer.from(joined,'base64');
          if(raw[0]!==0x1f||raw[1]!==0x8b)throw new Error('คลังข้อสอบไม่ใช่ gzip ที่สมบูรณ์');
          const d=JSON.parse(zlib.gunzipSync(raw).toString('utf8'));
          const get=(r,i)=>String(d.s[r[i]]??'').trim();
          if(!Array.isArray(d.q)||d.q.length!==10||d.q.some(s=>!Array.isArray(s)||s.length!==100))throw new Error('ต้องมี 10 ชุด ชุดละ 100 ข้อ');

          const prompts=[];const cats={};const explanations=[];const wrongReasons=[];const choiceSetKeys=[];
          d.q.forEach((set,si)=>{
            const ans=[0,0,0,0];
            const setCats={};
            set.forEach((r,qi)=>{
              if(!Array.isArray(r)||r.length<6)throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: โครงสร้างข้อมูลไม่ครบ`);
              const cat=get(r,0),prompt=get(r,1),choices=Array.isArray(r[2])?r[2].map(x=>String(d.s[x]??'').trim()):[],exp=get(r,4),wrong=get(r,5);
              if(!cat||!prompt)throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: ไม่มีหมวดหรือคำถาม`);
              if(!(cat in required))throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: พบหมวดนอกขอบเขต ${cat}`);
              if(prompt.length<25)throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: คำถามสั้นเกินมาตรฐาน`);
              if(/TODO|PLACEHOLDER|Lorem ipsum/i.test(prompt+exp+wrong))throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: พบข้อความชั่วคราว/placeholder`);
              if(choices.length!==4||choices.some(x=>!x))throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: ต้องมี 4 ตัวเลือก`);
              if(new Set(choices).size!==4)throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: มีตัวเลือกซ้ำ`);
              if(choices.some(x=>x.length<2))throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: ตัวเลือกสั้นผิดปกติ`);
              if(!Number.isInteger(r[3])||r[3]<0||r[3]>3)throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: คำตอบไม่ถูกต้อง`);
              const lens=choices.map(x=>x.length),correctLen=lens[r[3]],other=lens.filter((_,ci)=>ci!==r[3]),maxOther=Math.max(...other),minOther=Math.min(...other);
              if(correctLen-maxOther>=35&&correctLen>maxOther*2.4)throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: คำตอบถูกยาวเด่นกว่าตัวลวงผิดธรรมชาติ (${correctLen} vs max ${maxOther})`);
              if(minOther-correctLen>=35&&correctLen*2.4<minOther)throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: คำตอบถูกสั้นเด่นกว่าตัวลวงผิดธรรมชาติ (${correctLen} vs min ${minOther})`);
              const neg=(prompt.match(/ไม่|มิใช่|ยกเว้น/g)||[]).length;
              if(neg>=3)throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: พบถ้อยคำปฏิเสธซ้อนมากเกินไป ควรแก้โจทย์ให้ชัดเจน`);
              if(exp.length<40)throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: คำอธิบายเพิ่มเติมสั้นเกินมาตรฐาน`);
              if(wrong.length<40)throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: เหตุผลตัวเลือกผิดสั้นเกินมาตรฐาน`);
              if(exp.length>420)throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: คำอธิบายยาวเกินมาตรฐานการอ่านทบทวน`);
              if(wrong.length>800)throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: เหตุผลตัวเลือกผิดยาวเกินมาตรฐานการอ่านทบทวน`);
              if(exp===wrong)throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: คำอธิบายและเหตุผลตัวเลือกผิดซ้ำกันทั้งข้อความ`);
              if(!exp.includes(choices[r[3]]))throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: คำอธิบายไม่อ้างข้อความคำตอบที่ถูกต้อง`);
              for(let ci=0;ci<4;ci++)if(ci!==r[3]&&!wrong.includes(choices[ci]))throw new Error(`ชุด ${si+1} ข้อ ${qi+1}: เหตุผลตัวเลือกผิดไม่อ้างตัวเลือก ${ci+1}`);
              ans[r[3]]++;
              prompts.push(prompt);explanations.push(exp);wrongReasons.push(wrong);choiceSetKeys.push(JSON.stringify([...choices].sort()));
              cats[cat]=(cats[cat]||0)+1;setCats[cat]=(setCats[cat]||0)+1;
            });
            if(ans.some(n=>n<22||n>28))throw new Error(`ชุด ${si+1}: สัดส่วนคำตอบ ก/ข/ค/ง ต้องอยู่ช่วง 22–28 ข้อต่อตัวเลือก แต่ได้ ${ans.join('/')}`);
            let maxRun=1,run=1,last=null;
            for(const r of set){if(r[3]===last){run++;maxRun=Math.max(maxRun,run)}else{last=r[3];run=1}}
            if(maxRun>4)throw new Error(`ชุด ${si+1}: พบคำตอบตัวเดียวติดกัน ${maxRun} ข้อ เกินมาตรฐานสูงสุด 4 ข้อ`);
            for(let period=2;period<=6;period++){
              let same=0,total=0;
              for(let i=period;i<set.length;i++){total++;if(set[i][3]===set[i-period][3])same++}
              const rate=total?same/total:0;
              if(rate>=0.85)throw new Error(`ชุด ${si+1}: พบ pattern คำตอบซ้ำเชิงกล period=${period} rate=${(rate*100).toFixed(1)}%`);
            }
            for(const [k,v] of Object.entries(perSet))if(setCats[k]!==v)throw new Error(`ชุด ${si+1}: หมวด ${k} ต้องมี ${v} ข้อ แต่พบ ${setCats[k]||0}`);
            console.log(`SET ${si+1}: answers=${ans.join('/')} categories=${JSON.stringify(setCats)}`);
          });

          if(new Set(prompts).size!==1000)throw new Error('พบคำถามซ้ำแบบข้อความตรงกัน');
          const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[\\s\\p{P}\\p{S}]+/gu,'');
          if(new Set(prompts.map(norm)).size!==1000)throw new Error('พบคำถามซ้ำหลังปรับรูปแบบตัวอักษร/วรรคตอน');
          const normNoNum=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[0-9๐-๙]+/g,'#').replace(/[\\s\\p{P}\\p{S}]+/gu,'');
          const promptShapeCounts=new Map();let maxPromptShapeReuse=0;
          for(const p of prompts){const k=normNoNum(p),n=(promptShapeCounts.get(k)||0)+1;promptShapeCounts.set(k,n);if(n>maxPromptShapeReuse)maxPromptShapeReuse=n}
          if(maxPromptShapeReuse>8)throw new Error(`พบโครงคำถามซ้ำเชิงรูปแบบเกินมาตรฐาน: สูงสุด ${maxPromptShapeReuse} ข้อ`);
          const choiceSetCounts=new Map();let maxChoiceSetReuse=0;
          for(const k of choiceSetKeys){const n=(choiceSetCounts.get(k)||0)+1;choiceSetCounts.set(k,n);if(n>maxChoiceSetReuse)maxChoiceSetReuse=n}
          if(maxChoiceSetReuse>8)throw new Error(`พบชุดตัวเลือกซ้ำเกินมาตรฐาน: สูงสุด ${maxChoiceSetReuse} ข้อ`);
          const maxReuse=arr=>{
            const m=new Map();let mx=0;
            for(const s of arr){const k=norm(s);const n=(m.get(k)||0)+1;m.set(k,n);if(n>mx)mx=n}
            return mx;
          };
          const maxExpReuse=maxReuse(explanations),maxWrongReuse=maxReuse(wrongReasons);
          if(maxExpReuse>3)throw new Error(`พบคำอธิบายซ้ำมากเกินมาตรฐาน: สูงสุด ${maxExpReuse} ข้อ`);
          if(maxWrongReuse>3)throw new Error(`พบเหตุผลตัวเลือกผิดซ้ำมากเกินมาตรฐาน: สูงสุด ${maxWrongReuse} ข้อ`);
          for(const [k,v] of Object.entries(required))if(cats[k]!==v)throw new Error(`หมวด ${k} ต้องมี ${v} ข้อ แต่พบ ${cats[k]||0}`);

          console.log('CATEGORY COUNTS',JSON.stringify(cats));
          console.log(`UNIQUE EXPLANATIONS ${new Set(explanations).size}/1000`);
          console.log(`UNIQUE WRONG-REASONS ${new Set(wrongReasons).size}/1000`);
          console.log(`MAX NORMALIZED PROMPT-SHAPE REUSE ${maxPromptShapeReuse}`);
          console.log(`MAX EXACT CHOICE-SET REUSE ${maxChoiceSetReuse}`);
          console.log(`MAX NORMALIZED EXPLANATION REUSE ${maxExpReuse}; WRONG-REASON REUSE ${maxWrongReuse}`);
          console.log('PASS: นักวิชาการสรรพากรปฏิบัติการผ่านมาตรฐานโครงสร้างเดียวกับระบบนักตรวจสอบภาษีปฏิบัติการ');
          console.log('10 ชุด x 100 ข้อ, ชุดละ 60/15/15/10 ตามหมวด, 4 ตัวเลือก, 1 คำตอบ, ก/ข/ค/ง สมดุลช่วง 22–28 ต่อชุด, ตรวจ answer-run/pattern, ตรวจตัวเลือกเด่น, ไม่มีคำถามซ้ำ, มีคำอธิบายและเหตุผลตัวเลือกผิดครบ');
          NODE

      - name: Verify public academic bank is readable
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://khonchaiherb-dev.github.io/Khonchai/tax-exam'
          mkdir -p /tmp/academic-live
          files=(ra-bank-01.txt ra-bank-02a.txt ra-bank-02b.txt ra-bank-03a.txt ra-bank-03b.txt ra-bank-04.txt ra-bank-05.txt ra-bank-06.txt ra-bank-07.txt ra-bank-08.txt ra-bank-09.txt ra-bank-10.txt)
          for f in "${files[@]}"; do
            curl -fsSL --retry 15 --retry-all-errors --retry-delay 3 -H 'Cache-Control: no-cache' "$BASE/$f?qa=$GITHUB_SHA" -o "/tmp/academic-live/$f"
          done
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const files=['ra-bank-01.txt','ra-bank-02a.txt','ra-bank-02b.txt','ra-bank-03a.txt','ra-bank-03b.txt','ra-bank-04.txt','ra-bank-05.txt','ra-bank-06.txt','ra-bank-07.txt','ra-bank-08.txt','ra-bank-09.txt','ra-bank-10.txt'];
          const b64=files.map(f=>fs.readFileSync('/tmp/academic-live/'+f,'utf8').trim()).join('').replace(/\s+/g,'');
          const d=JSON.parse(zlib.gunzipSync(Buffer.from(b64,'base64')).toString('utf8'));
          if(!Array.isArray(d.q)||d.q.length!==10||d.q.some(s=>s.length!==100))throw new Error('คลังข้อสอบออนไลน์ไม่ครบ 10 x 100');
          const prompts=d.q.flat().map(r=>String(d.s[r[1]]??'').trim());
          if(new Set(prompts).size!==1000)throw new Error('คลังข้อสอบออนไลน์มีคำถามซ้ำ');
          console.log('PASS LIVE: คลังนักวิชาการสรรพากรปฏิบัติการออนไลน์อ่านได้ครบ 1,000 ข้อ');
          NODE
