name: Storefront Quality Check

on:
  push:
    branches: [storefront-social-commerce]
  pull_request:
    branches: [storefront-social-commerce]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check storefront JavaScript
        run: npm run check
      - name: Validate D1 migrations and seed
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          for path in [
              Path('db/migrations/0001_init.sql'),
              Path('db/migrations/0002_production_hardening.sql'),
              Path('db/migrations/0003_social_commerce.sql'),
              Path('db/migrations/0004_attribution_analytics.sql'),
              Path('db/migrations/0005_growth_engine.sql'),
              Path('db/migrations/0006_customer_platform.sql'),
              Path('db/migrations/0007_customer_service.sql'),
              Path('db/seed.sql'),
              Path('db/seed-social.sql'),
              Path('db/seed-growth.sql'),
          ]:
              db.executescript(path.read_text())
          assert db.execute('select count(*) from products').fetchone()[0] > 0
          assert db.execute('select count(*) from coupons').fetchone()[0] > 0
          assert db.execute('select count(*) from creators').fetchone()[0] >= 3
          assert db.execute('select count(*) from promotions where active=1').fetchone()[0] >= 2
          customer_cols={row[1] for row in db.execute('pragma table_info(customers)')}
          assert {'last_login_at','updated_at'} <= customer_cols
          shipment_cols={row[1] for row in db.execute('pragma table_info(shipments)')}
          assert {'provider','provider_ref'} <= shipment_cols
          commission_cols={row[1] for row in db.execute('pragma table_info(creator_commissions)')}
          assert {'payout_ref','updated_at'} <= commission_cols
          tables={row[0] for row in db.execute("select name from sqlite_master where type='table'")}
          assert {'review_media','promotions','customer_auth_challenges','customer_sessions','customer_recent_products','creator_commissions','shipment_events','return_requests'} <= tables

          # Create a valid relational fixture before testing the return workflow.
          db.execute("insert into customers(phone,full_name) values('0899999999','QA Customer')")
          customer_id=db.execute("select id from customers where phone='0899999999'").fetchone()[0]
          product_id=db.execute('select id from products order by id limit 1').fetchone()[0]
          db.execute("insert into orders(order_no,customer_id,customer_name,phone,address_json,subtotal,discount_total,shipping_total,total,payment_method,payment_status,fulfillment_status,status) values('KCH-QA-RETURN',?,'QA Customer','0899999999','{}',100,0,0,100,'COD','cod_collected','delivered','completed')",(customer_id,))
          order_id=db.execute("select id from orders where order_no='KCH-QA-RETURN'").fetchone()[0]
          db.execute("insert into return_requests(order_id,customer_id,product_id,qty,reason_code,detail) values(?,?,?,?,?,?)",(order_id,customer_id,product_id,1,'other','test request'))
          assert db.execute('select count(*) from return_requests').fetchone()[0] == 1
          print('Database migrations, v0.9 customer service, returns, sessions, commissions and growth engine: OK')
          PY
