name: Storefront Quality Check

on:
  push:
    branches: [storefront-social-commerce]
  pull_request:
    branches: [storefront-social-commerce]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check storefront JavaScript
        run: npm run check
      - name: Validate D1 migrations and seed
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          for path in [
              Path('db/migrations/0001_init.sql'),
              Path('db/migrations/0002_production_hardening.sql'),
              Path('db/migrations/0003_social_commerce.sql'),
              Path('db/migrations/0004_attribution_analytics.sql'),
              Path('db/seed.sql'),
              Path('db/seed-social.sql'),
          ]:
              db.executescript(path.read_text())
          assert db.execute('select count(*) from products').fetchone()[0] > 0
          assert db.execute('select count(*) from coupons').fetchone()[0] > 0
          assert db.execute('select count(*) from creators').fetchone()[0] >= 3
          assert db.execute('select count(*) from social_contents').fetchone()[0] >= 5
          assert db.execute('select count(*) from content_products').fetchone()[0] > 0
          cols={row[1] for row in db.execute('pragma table_info(orders)')}
          assert {'source_channel','creator_id','content_id'} <= cols
          db.execute("insert into commerce_events(event_type,source_channel,creator_id,content_id,product_id) values('content_view','video',1,2,1)")
          assert db.execute('select count(*) from commerce_events').fetchone()[0] == 1
          print('Database migrations, social-commerce schema, attribution and analytics: OK')
          PY
