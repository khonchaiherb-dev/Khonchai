name: Storefront Browser E2E Check

on:
  push:
    branches: [storefront-social-commerce]
  pull_request:
    branches: [storefront-social-commerce]

jobs:
  browser-e2e:
    name: browser-e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-390, tablet-820, desktop-1440]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install E2E dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.project }} E2E
        env:
          CI: '1'
        run: npm run qa:e2e -- --project=${{ matrix.project }}
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: storefront-e2e-diagnostics-${{ matrix.project }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7
      - name: Upload storefront previews
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: storefront-previews-${{ matrix.project }}
          path: preview-screenshots
          if-no-files-found: warn
          retention-days: 7
