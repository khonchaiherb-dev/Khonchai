name: K-EXAM Source Review Batch
on:
  push:
    paths:
      - '.github/workflows/kexam-source-review-batch.yml'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'จำนวนข้อในชุดตรวจ'
        required: false
        default: '50'
      review_mode:
        description: 'pending = ตรวจครั้งแรก, reverify = ทบทวน source-verified ที่ใกล้/เกินกำหนด'
        required: false
        type: choice
        options:
          - pending
          - reverify
        default: pending

concurrency:
  group: kexam-source-review-registry-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build private source review batch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1
          SIZE="${{ github.event.inputs.batch_size || '50' }}"
          MODE="${{ github.event.inputs.review_mode || 'pending' }}"
          if ! [[ "$SIZE" =~ ^[0-9]+$ ]] || [ "$SIZE" -lt 1 ] || [ "$SIZE" -gt 200 ]; then
            echo "batch_size must be 1..200" >&2
            exit 1
          fi
          if [ "$MODE" != "pending" ] && [ "$MODE" != "reverify" ]; then
            echo "review_mode must be pending or reverify" >&2
            exit 1
          fi
          BATCH_SIZE="$SIZE" REVIEW_MODE="$MODE" node <<'NODE'
          const cp=require('child_process'),zlib=require('zlib'),fs=require('fs'),crypto=require('crypto');
          const show=p=>cp.execFileSync('git',['show',`origin/gh-pages:${p}`],{encoding:'utf8',maxBuffer:64*1024*1024});
          const mode=String(process.env.REVIEW_MODE||'pending');
          const size=Number(process.env.BATCH_SIZE||50);
          const manifest=JSON.parse(show('tax-exam/question-publication-manifest.json'));
          const integrity=JSON.parse(show('tax-exam/question-content-integrity.json'));
          if(integrity.schema_version!==1||integrity.algorithm!=='sha256')throw new Error('content integrity baseline invalid');
          let queue;
          if(mode==='pending'){
            queue=JSON.parse(show('tax-exam/source-verification-backlog.json'));
            if(queue.schema_version!==1||!Array.isArray(queue.rows))throw new Error('source backlog invalid');
          }else{
            queue=JSON.parse(show('tax-exam/source-reverification-watchlist.json'));
            if(queue.schema_version!==1||!Array.isArray(queue.rows))throw new Error('source re-verification watchlist invalid');
          }
          let registry={schema_version:1,batches:[]};
          try{registry=JSON.parse(show('tax-exam/source-review-batch-registry.json'))}catch{}
          if(registry.schema_version!==1||!Array.isArray(registry.batches))throw new Error('source review batch registry invalid');
          const now=Date.now(),RESERVATION_DAYS=30;
          const reservationExpiry=b=>{
            const explicit=Date.parse(String(b.reservation_expires_at||''));
            if(Number.isFinite(explicit))return explicit;
            const generated=Date.parse(String(b.generated_at||''));
            return Number.isFinite(generated)?generated+RESERVATION_DAYS*86400000:0;
          };
          const activeReserved=new Set();
          for(const b of registry.batches){
            if(String(b.status||'')!=='generated'||String(b.review_mode||'')!==mode)continue;
            if(reservationExpiry(b)<=now)continue;
            for(const id of b.question_ids||[])activeReserved.add(String(id));
          }

          const configs={
            'tax-auditor':{
              prefix:'TA',
              files:['bank-01.txt','bank-02-03.txt','bank-04-05.txt','bank-06-07.txt','bank-08-09.txt','bank-10-11.txt','bank-12-13.txt','bank-14-15.txt','bank-16-17.txt','bank-18.txt']
            },
            'revenue-academic':{
              prefix:'RA',
              files:['ra-bank-01.txt','ra-bank-02a.txt','ra-bank-02b.txt','ra-bank-03a.txt','ra-bank-03b.txt','ra-bank-04.txt','ra-bank-05.txt','ra-bank-06.txt','ra-bank-07.txt','ra-bank-08.txt','ra-bank-09.txt','ra-bank-10.txt']
            }
          };
          const banks={};
          for(const [position,cfg] of Object.entries(configs)){
            const b64=cfg.files.map(f=>show('tax-exam/'+f).trim()).join('').replace(/\s+/g,'');
            const data=JSON.parse(zlib.gunzipSync(Buffer.from(b64,'base64')).toString('utf8'));
            if(!Array.isArray(data.q)||data.q.length!==10||data.q.some(s=>s.length!==100))throw new Error(position+' bank invalid');
            banks[position]=data;
          }

          const parseId=id=>{const m=/^(RA|TA)-S(\d{2})-Q(\d{3})$/.exec(String(id||''));if(!m)throw new Error('invalid Question ID '+id);return{set:Number(m[2]),question:Number(m[3])}};
          const candidateRows=mode==='pending'
            ? queue.rows
            : queue.rows.filter(r=>r.status==='เกินกำหนด'||r.status==='ใกล้ครบกำหนด');
          const pendingRows=candidateRows.filter(r=>!activeReserved.has(String(r.question_id||'')));
          const reservedSkipped=candidateRows.length-pendingRows.length;
          if(candidateRows.length&&pendingRows.length===0)throw new Error('all eligible source review rows are reserved by active generated batches');

          const allocate=(groups,target)=>{
            const entries=Object.entries(groups).map(([key,rows])=>({key,rows,size:rows.length,raw:0,quota:0}));
            const total=entries.reduce((n,x)=>n+x.size,0);if(!total||target<=0)return new Map();
            for(const x of entries){x.raw=x.size/total*target;x.quota=Math.floor(x.raw)}
            if(target>=entries.length)for(const x of entries)if(x.size>0&&x.quota===0)x.quota=1;
            let used=entries.reduce((n,x)=>n+x.quota,0);
            if(used>target){
              entries.sort((a,b)=>(a.raw-a.quota)-(b.raw-b.quota)||a.size-b.size);
              for(const x of entries){while(used>target&&x.quota>0&&(target<entries.length||x.quota>1)){x.quota--;used--}}
            }else if(used<target){
              entries.sort((a,b)=>(b.raw-b.quota)-(a.raw-a.quota)||b.size-a.size||a.key.localeCompare(b.key,'th'));
              let guard=0;
              while(used<target&&guard++<10000){
                let advanced=false;
                for(const x of entries){if(used>=target)break;if(x.quota<x.size){x.quota++;used++;advanced=true}}
                if(!advanced)break;
              }
            }
            return new Map(entries.map(x=>[x.key,Math.min(x.quota,x.size)]));
          };
          const stratifyTier=(rows,target)=>{
            if(rows.length<=target)return [...rows];
            const byPos={};for(const r of rows)(byPos[r.position]??=[]).push(r);
            const posQuota=allocate(byPos,target),out=[];
            for(const [position,pRows] of Object.entries(byPos)){
              const pq=posQuota.get(position)||0;if(!pq)continue;
              const byTopic={};for(const r of pRows)(byTopic[r.topic||r.category||'อื่น ๆ']??=[]).push(r);
              const topicQuota=allocate(byTopic,pq);
              for(const [topic,tRows] of Object.entries(byTopic)){
                const tq=topicQuota.get(topic)||0;
                out.push(...tRows.slice(0,tq));
              }
              if(out.filter(x=>x.position===position).length<pq){
                const used=new Set(out.map(x=>x.question_id));
                out.push(...pRows.filter(x=>!used.has(x.question_id)).slice(0,pq-out.filter(x=>x.position===position).length));
              }
            }
            if(out.length<target){
              const used=new Set(out.map(x=>x.question_id));
              out.push(...rows.filter(x=>!used.has(x.question_id)).slice(0,target-out.length));
            }
            return out.slice(0,target);
          };
          const selectBalanced=(rows,target)=>{
            if(rows.length<=target)return [...rows];
            const tiers=new Map();
            for(const r of rows){
              const score=mode==='pending'?Number(r.priority_score)||0:(r.status==='เกินกำหนด'?100:r.status==='ใกล้ครบกำหนด'?70:0);
              (tiers.get(score)??tiers.set(score,[]).get(score)).push(r);
            }
            const out=[];
            for(const score of [...tiers.keys()].sort((a,b)=>b-a)){
              const tier=tiers.get(score),left=target-out.length;if(left<=0)break;
              out.push(...stratifyTier(tier,Math.min(left,tier.length)));
            }
            return out.slice(0,target);
          };
          const selected=selectBalanced(pendingRows,size);
          const letters=['ก','ข','ค','ง'];
          const batch=selected.map((row,idx)=>{
            const data=banks[row.position];
            if(!data)throw new Error('unknown position '+row.position);
            const loc=mode==='pending'?{set:Number(row.set),question:Number(row.question)}:parseId(row.question_id);
            const si=loc.set-1,qi=loc.question-1,r=data.q?.[si]?.[qi];
            if(!r)throw new Error('bank row missing '+row.question_id);
            const category=String(data.s[r[0]]||''),prompt=String(data.s[r[1]]||'');
            const choices=(r[2]||[]).map(i=>String(data.s[i]||''));
            const answer=Number(r[3]),answerText=choices[answer];
            const explanation=String(data.s[r[4]]||''),wrongReasons=String(data.s[r[5]]||'');
            if(choices.length!==4||answer<0||answer>3||!answerText)throw new Error('invalid question '+row.question_id);
            return{
              review_order:idx+1,
              question_id:row.question_id,
              position:row.position,
              set:loc.set,
              question:loc.question,
              review_mode:mode,
              priority:mode==='pending'?(row.priority||'ปกติ'):(row.status||'ยังสดใหม่'),
              priority_score:mode==='pending'?(Number(row.priority_score)||0):(row.status==='เกินกำหนด'?100:row.status==='ใกล้ครบกำหนด'?70:0),
              priority_reasons:mode==='pending'?(Array.isArray(row.reasons)?row.reasons:[]):[
                'Source freshness: '+String(row.status||''),
                'ตรวจล่าสุด '+String(row.checked_at||''),
                'ครบกำหนด '+String(row.due_at||'')
              ],
              category,
              topic:row.topic||category,
              prompt,
              choices,
              correct_answer:{index:answer,letter:letters[answer],text:answerText},
              explanation,
              wrong_reasons:wrongReasons,
              current_source_state:mode==='pending'?(row.source_state||'pending'):'verified',
              current_content_sha256:integrity.questions?.[row.question_id]?.sha256||null,
              current_source_verification:mode==='reverify'?(manifest.source_overrides?.[row.question_id]||null):null,
              freshness:mode==='reverify'?{
                status:row.status,
                checked_at:row.checked_at,
                due_at:row.due_at,
                days_until_due:row.days_until_due,
                review_interval_days:row.review_interval_days,
                freshness_tier:row.freshness_tier
              }:null,
              review_form:{
                decision:'',
                reviewed_at:'',
                review_note:'',
                source_refs:[
                  {title:'',url:'',checked_at:'',section:'',note:''}
                ]
              }
            };
          });

          if(mode==='pending'&&!batch.length)throw new Error('source verification backlog is empty');
          const selectionPositions=batch.reduce((m,q)=>{m[q.position]=(m[q.position]||0)+1;return m},{});
          const selectionTopics=batch.reduce((m,q)=>{m[q.topic]=(m[q.topic]||0)+1;return m},{});
          const batchGeneratedAt=new Date().toISOString();
          const batchSnapshotPayload=batch.map(q=>({question_id:q.question_id,content_sha256:q.current_content_sha256})).sort((a,b)=>a.question_id.localeCompare(b.question_id));
          const batchSnapshotSha256=crypto.createHash('sha256').update(JSON.stringify({review_mode:mode,questions:batchSnapshotPayload}),'utf8').digest('hex');
          const batchId=`SRB-${batchGeneratedAt.slice(0,10).replace(/-/g,'')}-${batchSnapshotSha256.slice(0,12)}`;
          const out={
            schema_version:1,
            generated_at:batchGeneratedAt,
            batch_id:batchId,
            batch_snapshot_sha256:batchSnapshotSha256,
            review_mode:mode,
            batch_size:batch.length,
            selection_policy:mode==='pending'?'priority score first, then stratified by position and topic':'freshness priority first, then stratified by position and topic',
            selection_summary:{positions:selectionPositions,topics:selectionTopics},
            reservation_policy:{days:RESERVATION_DAYS,reserved_skipped:reservedSkipped},
            note:mode==='reverify'&&batch.length===0?'ยังไม่มี source-verified ที่ใกล้หรือเกินกำหนดทบทวน':null,
            warning:'ไฟล์นี้มีคำตอบและคำอธิบาย ใช้สำหรับการตรวจภายใน ไม่ควรเผยแพร่เป็นไฟล์สาธารณะ',
            questions:batch
          };
          fs.writeFileSync('/tmp/kexam-source-review-batch.json',JSON.stringify(out,null,2)+'\n');

          const decisionTemplate={
            schema_version:1,
            updated_at:new Date().toISOString().slice(0,10),
            review_mode:mode,
            batch_id:batchId,
            batch_snapshot_sha256:batchSnapshotSha256,
            records:batch.map(q=>({
              question_id:q.question_id,
              review_batch_id:batchId,
              reviewed_content_sha256:q.current_content_sha256,
              decision:'',
              reviewed_at:'',
              review_note:'',
              source_refs:[{title:'',url:'',checked_at:'',section:'',note:''}]
            }))
          };
          fs.writeFileSync('/tmp/kexam-source-review-decisions-template.json',JSON.stringify(decisionTemplate,null,2)+'\n');

          const csvCell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
          const header=['batch_id','batch_snapshot_sha256','review_order','question_id','position','review_mode','priority','priority_score','category','topic','current_content_sha256','freshness_status','checked_at','due_at','days_until_due','prompt','correct_letter','correct_answer','reviewed_content_sha256','decision','reviewed_at','review_note','source_title','source_url','source_checked_at','source_section'];
          const lines=[header.join(',')];
          for(const q of batch){
            lines.push([
              batchId,batchSnapshotSha256,q.review_order,q.question_id,q.position,q.review_mode,q.priority,q.priority_score,q.category,q.topic,q.current_content_sha256,
              q.freshness?.status||'',q.freshness?.checked_at||'',q.freshness?.due_at||'',q.freshness?.days_until_due??'',q.prompt,
              q.correct_answer.letter,q.correct_answer.text,q.current_content_sha256,'','','','','','',''
            ].map(csvCell).join(','));
          }
          fs.writeFileSync('/tmp/kexam-source-review-batch.csv','\ufeff'+lines.join('\r\n'));

          const counts=batch.reduce((m,q)=>{m[q.priority]=(m[q.priority]||0)+1;return m},{});
          const positions=selectionPositions,topics=selectionTopics;
          if(mode==='pending'&&batch.length>=10){
            const availableUrgent=pendingRows.filter(r=>r.priority==='เร่งด่วน');
            const availablePositions=new Set(availableUrgent.map(r=>r.position));
            if(availablePositions.size>=2&&Object.keys(positions).length<2)throw new Error('stratified batch lost a position despite urgent backlog coverage');
            const availableTopics=new Set(availableUrgent.map(r=>r.topic||r.category||'อื่น ๆ'));
            if(availableTopics.size>=3&&Object.keys(topics).length<3)throw new Error('stratified batch should cover at least 3 urgent topics');
            const maxTopic=Math.max(...Object.values(topics));
            if(Object.keys(topics).length>=3&&maxTopic>Math.ceil(batch.length*0.60))throw new Error('stratified batch is too concentrated in one topic: '+maxTopic+'/'+batch.length);
          }
          console.log('SOURCE REVIEW BATCH',JSON.stringify({batch_id:batchId,batch_snapshot_sha256:batchSnapshotSha256,mode,size:batch.length,reserved_skipped:reservedSkipped,active_reserved:activeReserved.size,priority:counts,positions,topics,first:batch[0]?.question_id||null,last:batch.at(-1)?.question_id||null}));
          NODE

      - name: Upload private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: kexam-source-review-batch
          path: |
            /tmp/kexam-source-review-batch.json
            /tmp/kexam-source-review-batch.csv
            /tmp/kexam-source-review-decisions-template.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate public-safe batch registry entry
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const batch=JSON.parse(fs.readFileSync('/tmp/kexam-source-review-batch.json','utf8'));
          const idRe=/^SRB-\d{8}-[a-f0-9]{12}$/,hashRe=/^[a-f0-9]{64}$/,qidRe=/^(RA|TA)-S(0[1-9]|10)-Q(0[0-9]{2}|100)$/;
          if(!idRe.test(String(batch.batch_id||'')))throw new Error('invalid batch_id');
          if(!hashRe.test(String(batch.batch_snapshot_sha256||'')))throw new Error('invalid batch snapshot');
          if(!Array.isArray(batch.questions)||batch.questions.length!==Number(batch.batch_size||0))throw new Error('batch question count mismatch');
          const questionIds=batch.questions.map(q=>String(q.question_id||''));
          if(new Set(questionIds).size!==questionIds.length||questionIds.some(id=>!qidRe.test(id)))throw new Error('invalid/duplicate registry Question IDs');
          let liveRegistry={schema_version:1,batches:[]};
          try{
            const raw=require('child_process').execFileSync('git',['show','origin/gh-pages:tax-exam/source-review-batch-registry.json'],{encoding:'utf8',maxBuffer:8*1024*1024});
            liveRegistry=JSON.parse(raw);
          }catch{}
          const now=Date.now(),activeReserved=new Set();
          for(const b of liveRegistry.batches||[]){
            if(b.status!=='generated'||b.review_mode!==batch.review_mode)continue;
            const expires=Date.parse(String(b.reservation_expires_at||''))||((Date.parse(String(b.generated_at||''))||0)+30*86400000);
            if(expires<=now)continue;
            for(const id of b.question_ids||[])activeReserved.add(String(id));
          }
          const overlap=questionIds.filter(id=>activeReserved.has(id));
          if(overlap.length)throw new Error('new source review batch overlaps active reservation: '+overlap.slice(0,20).join(','));
          console.log('RESERVATION OVERLAP PASS',JSON.stringify({active_reserved:activeReserved.size,new_batch:questionIds.length,overlap:overlap.length}));
          const entry={
            batch_id:batch.batch_id,
            batch_snapshot_sha256:batch.batch_snapshot_sha256,
            generated_at:batch.generated_at,
            review_mode:batch.review_mode,
            batch_size:batch.batch_size,
            selection_policy:batch.selection_policy,
            selection_summary:batch.selection_summary||{positions:{},topics:{}},
            question_ids:questionIds,
            status:'generated',
            created_run_id:String(process.env.GITHUB_RUN_ID||''),
            created_event:String(process.env.GITHUB_EVENT_NAME||''),
            reservation_expires_at:new Date(Date.parse(batch.generated_at)+30*86400000).toISOString(),
            applied_at:null,
            decision_counts:null
          };
          const json=JSON.stringify(entry);
          for(const forbidden of ['prompt','choices','correct_answer','explanation','wrong_reasons','source_refs']){
            if(Object.prototype.hasOwnProperty.call(entry,forbidden)||json.includes('"'+forbidden+'"'))throw new Error('registry entry leaks private review content: '+forbidden);
          }
          fs.writeFileSync('/tmp/kexam-source-review-registry-entry.json',JSON.stringify(entry,null,2)+'\n');
          console.log('REGISTRY ENTRY PASS',JSON.stringify({batch_id:entry.batch_id,size:entry.batch_size,status:entry.status}));
          NODE

      - name: Register source review batch
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1
          git checkout -B gh-pages origin/gh-pages
          node <<'NODE'
          const fs=require('fs');
          const path='tax-exam/source-review-batch-registry.json';
          const entry=JSON.parse(fs.readFileSync('/tmp/kexam-source-review-registry-entry.json','utf8'));
          let registry={schema_version:1,updated_at:new Date().toISOString(),batches:[]};
          if(fs.existsSync(path))registry=JSON.parse(fs.readFileSync(path,'utf8'));
          if(registry.schema_version!==1||!Array.isArray(registry.batches))throw new Error('invalid source review batch registry');
          for(const b of registry.batches){
            if(b.status==='generated'&&!b.reservation_expires_at){
              const t=Date.parse(String(b.generated_at||''));if(Number.isFinite(t))b.reservation_expires_at=new Date(t+30*86400000).toISOString();
            }
          }
          const existing=registry.batches.find(x=>x.batch_id===entry.batch_id);
          if(existing){
            if(existing.batch_snapshot_sha256!==entry.batch_snapshot_sha256)throw new Error('batch_id collision with different snapshot '+entry.batch_id);
            if(JSON.stringify(existing.question_ids||[])!==JSON.stringify(entry.question_ids||[]))throw new Error('batch_id collision with different Question IDs '+entry.batch_id);
            if(!existing.created_run_id)existing.created_run_id=entry.created_run_id;
            if(!existing.reservation_expires_at&&existing.status==='generated')existing.reservation_expires_at=entry.reservation_expires_at;
            console.log('REGISTRY IDEMPOTENT',entry.batch_id,existing.status);
          }else{
            registry.batches.unshift(entry);
            registry.batches=registry.batches.slice(0,500);
            console.log('REGISTRY ADD',entry.batch_id);
          }
          registry.updated_at=new Date().toISOString();
          fs.writeFileSync(path,JSON.stringify(registry,null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tax-exam/source-review-batch-registry.json
          if git diff --cached --quiet; then
            echo "Source review batch registry unchanged"
            exit 0
          fi
          git commit -m "Register source review batch"
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            if git rebase origin/gh-pages; then
              if git push origin HEAD:gh-pages; then exit 0; fi
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to update source review batch registry after 5 attempts" >&2
          exit 1
