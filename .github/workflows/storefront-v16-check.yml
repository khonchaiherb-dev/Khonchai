name: Storefront v1.6 Resilience Check

on:
  push:
    branches: [storefront-v16-resilience, storefront-social-commerce]
  pull_request:
    branches: [storefront-social-commerce]

jobs:
  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check storefront JavaScript
        run: npm run check
      - name: Validate v1.6 schema and integrity queries
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(':memory:')
          files=[
            '0001_init.sql','0002_production_hardening.sql','0003_social_commerce.sql','0004_attribution_analytics.sql',
            '0005_growth_engine.sql','0006_customer_platform.sql','0007_customer_service.sql','0008_production_readiness.sql',
            '0009_fulfillment_finance.sql','0010_warehouse_customer_experience.sql','0011_production_operations.sql',
            '0012_staff_security.sql','0013_session_launch_hardening.sql','0014_resilience_recovery.sql'
          ]
          for f in files: db.executescript(Path('db/migrations',f).read_text())
          for f in ['seed.sql','seed-social.sql','seed-growth.sql','seed-production.sql']: db.executescript(Path('db',f).read_text())
          tables={r[0] for r in db.execute("select name from sqlite_master where type='table'")}
          assert {'order_request_registry','maintenance_runs','system_integrity_snapshots'} <= tables
          queries=[
            "SELECT COUNT(*) c FROM orders o WHERE NOT EXISTS(SELECT 1 FROM order_items i WHERE i.order_id=o.id)",
            "SELECT COUNT(*) c FROM orders o WHERE NOT EXISTS(SELECT 1 FROM payments p WHERE p.order_id=o.id)",
            "SELECT COUNT(*) c FROM orders o WHERE NOT EXISTS(SELECT 1 FROM shipments s WHERE s.order_id=o.id)",
            "SELECT COUNT(*) c FROM orders o LEFT JOIN (SELECT order_id,SUM(line_total) items_total FROM order_items GROUP BY order_id) i ON i.order_id=o.id WHERE ABS(COALESCE(i.items_total,0)-COALESCE(o.discount_total,0)+COALESCE(o.shipping_total,0)-COALESCE(o.total,0))>0.01",
            "SELECT COUNT(*) c FROM products p LEFT JOIN (SELECT product_id,SUM(qty) qty FROM stock_reservations WHERE status='active' AND variant_id IS NULL GROUP BY product_id) r ON r.product_id=p.id WHERE COALESCE(r.qty,0)<>COALESCE(p.reserved_stock,0)",
            "SELECT COUNT(*) c FROM product_variants v LEFT JOIN (SELECT variant_id,SUM(qty) qty FROM stock_reservations WHERE status='active' AND variant_id IS NOT NULL GROUP BY variant_id) r ON r.variant_id=v.id WHERE COALESCE(r.qty,0)<>COALESCE(v.reserved_stock,0)",
            "SELECT COUNT(*) c FROM stock_reservations r JOIN orders o ON o.id=r.order_id WHERE r.status='active' AND o.status='cancelled'",
            "SELECT COUNT(*) c FROM financial_ledger l LEFT JOIN orders o ON o.id=l.order_id WHERE l.order_id IS NOT NULL AND o.id IS NULL",
            "SELECT COUNT(*) c FROM order_request_registry WHERE order_no IS NULL AND first_seen_at<datetime('now','-24 hours')",
            "SELECT COUNT(*) c FROM order_request_registry r LEFT JOIN orders o ON o.order_no=r.order_no WHERE r.order_no IS NOT NULL AND o.id IS NULL"
          ]
          for q in queries: db.execute(q).fetchone()
          db.execute("insert into order_request_registry(idempotency_key,request_fingerprint) values('idem-v16','fp-a')")
          try:
            db.execute("insert into order_request_registry(idempotency_key,request_fingerprint) values('idem-v16','fp-b')")
            raise AssertionError('duplicate idempotency key was not blocked')
          except sqlite3.IntegrityError: pass
          db.execute("insert into maintenance_runs(run_no,job_key,status,affected_rows) values('MNT-TEST','safe_cleanup','completed',0)")
          db.execute("insert into system_integrity_snapshots(status,score,anomalies_count,detail_json) values('healthy',100,0,'{}')")
          assert db.execute("select score from system_integrity_snapshots order by id desc limit 1").fetchone()[0]==100
          print('v1.6 resilience schema and integrity SQL: OK')
          PY
      - name: Validate production resilience source contracts
        run: |
          grep -q "ORDER_IDEMPOTENCY_REQUIRED" functions/api/_middleware.js
          grep -q "order_request_registry" functions/api/_middleware.js
          grep -q "idempotency_conflict" functions/api/_middleware.js
          grep -q "X-Request-ID" functions/api/_middleware.js
          grep -q "rate_limit_secret_not_configured" functions/api/_middleware.js
          ! grep -q "kch-rate-v1" functions/api/_middleware.js
          grep -q "SAFE_MAINTENANCE" functions/api/admin/backup.js
          grep -q "scanIntegrity" functions/api/admin/backup.js
          grep -q "Resilience & recovery schema" functions/api/admin/launch-readiness.js
          grep -q "Integrity & Recovery Center" public/tshop-v16.js
      - name: Validate v1.6 browser assets
        run: |
          grep -q "khonchaiherb-v1.6.0" public/sw.js
          grep -q "tshop-v16.js" public/index.html
          grep -q "tshop-v16.css" public/index.html
          grep -q '"version": "1.6.0"' package.json
