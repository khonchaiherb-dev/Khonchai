name: KHONCHAIHERB Runtime Sale Readiness Repair

on:
  push:
    branches: [storefront-social-commerce]
    paths:
      - 'functions/api/internal/launch-schema-repair.js'
      - '.github/workflows/runtime-sale-readiness-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: khonchaiherb-runtime-sale-readiness-repair
  cancel-in-progress: true

jobs:
  repair:
    name: Repair migration 0018 through Pages runtime
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_ORIGIN: https://khonchaiherb-commerce.pages.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: khonchaiherb-commerce
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for exact commit on Pages production
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
              > pages-current.json
            if GITHUB_SHA="$GITHUB_SHA" python3 - <<'PY'
          import json,os
          d=json.load(open('pages-current.json'))
          r=d.get('result') or {}
          dep=r.get('canonical_deployment') or {}
          trig=dep.get('deployment_trigger') or {}
          meta=trig.get('metadata') or {}
          latest=dep.get('latest_stage') or {}
          commit=str(meta.get('commit_hash') or '')
          status=str(latest.get('status') or '')
          if commit==os.environ['GITHUB_SHA'] and status=='success':
              print('Exact production commit is live:',commit[:12])
              raise SystemExit(0)
          print('Production currently:',commit[:12] or 'unknown','status=',status or 'unknown')
          raise SystemExit(1)
          PY
            then
              found=1
              break
            fi
            sleep 3
          done
          [ "$found" = "1" ] || { echo 'Exact source commit was not observed as successful Pages production deployment.' >&2; exit 1; }
          code=$(curl --silent --show-error --location --max-time 15 --output repair-marker.json --write-out '%{http_code}' "$SITE_ORIGIN/api/internal/launch-schema-repair")
          [ "$code" = "200" ] || { echo 'Repair endpoint marker is not reachable.' >&2; exit 1; }
          python3 - <<'PY'
          import json
          d=json.load(open('repair-marker.json'))
          assert d.get('service')=='khonchaiherb-launch-schema-repair'
          assert d.get('version')=='0018-v2'
          print('Guarded repair build marker verified.')
          PY

      - name: Preflight exact production blocker
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/health" > health-before.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('health-before.json'))
          if not d.get('databaseReady'):
              raise SystemExit('Production D1 runtime is not reachable; refusing schema repair')
          if not d.get('orderSchemaReady'):
              raise SystemExit('Order schema is not ready; refusing narrow migration 0018 repair')
          if d.get('catalogSchemaReady'):
              print('needed=false')
              print('reason=catalog_already_ready')
          else:
              err=str(d.get('catalogProbeError') or '')
              if 'no such column: p.sale_verified' not in err:
                  raise SystemExit('Catalog blocker is not the expected products.sale_verified column; refusing repair: '+err[:160])
              print('needed=true')
              print('reason=missing_sale_verified')
          PY

      - name: Generate one-time masked repair credential
        if: steps.preflight.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "LAUNCH_REPAIR_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Temporarily enable guarded repair endpoint
        if: steps.preflight.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > pages-repair-env.json
          import json,os
          print(json.dumps({'deployment_configs':{'production':{'env_vars':{'LAUNCH_REPAIR_TOKEN':{'type':'secret_text','value':os.environ['LAUNCH_REPAIR_TOKEN']}}}}}))
          PY
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @pages-repair-env.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
            > pages-repair-env-result.json
          python3 - <<'PY'
          import json
          d=json.load(open('pages-repair-env-result.json'))
          assert d.get('success'), d.get('errors')
          print('One-time Pages repair credential configured without exposing its value.')
          PY

      - name: Deploy runtime with one-time credential
        if: steps.preflight.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy public \
            --project-name="$PAGES_PROJECT" \
            --branch="storefront-social-commerce" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="guarded runtime migration 0018 repair"

      - name: Apply only migration 0018 columns through runtime D1 binding
        if: steps.preflight.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 30); do
            code=$(curl --silent --show-error --location --max-time 20 \
              --output repair-result.json --write-out '%{http_code}' \
              -X POST -H "X-KCH-Launch-Repair: $LAUNCH_REPAIR_TOKEN" \
              "$SITE_ORIGIN/api/internal/launch-schema-repair")
            if [ "$code" = "200" ] && python3 - <<'PY'
          import json
          d=json.load(open('repair-result.json'))
          assert d.get('ok') is True
          assert d.get('repair')=='0018_sale_readiness'
          print('Runtime repair applied:', ','.join(d.get('applied') or []) or 'already repaired')
          print('Active products:', int(d.get('activeProducts') or 0))
          PY
            then
              ok=1
              break
            fi
            sleep 3
          done
          [ "$ok" = "1" ] || { echo 'Guarded runtime repair could not be completed.' >&2; exit 1; }

      - name: Verify catalog schema after repair
        if: steps.preflight.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/health" > health-after.json
          python3 - <<'PY'
          import json
          d=json.load(open('health-after.json'))
          print('databaseReady=',d.get('databaseReady'))
          print('catalogSchemaReady=',d.get('catalogSchemaReady'))
          print('orderSchemaReady=',d.get('orderSchemaReady'))
          print('saleReadyProducts=',int(d.get('saleReadyProducts') or 0))
          if d.get('catalogSchemaReady') is not True:
              raise SystemExit('Remaining catalog probe error: '+str(d.get('catalogProbeError') or 'unknown')[:180])
          PY

      - name: Remove one-time repair credential
        if: always() && steps.preflight.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > pages-repair-cleanup.json <<'JSON'
          {"deployment_configs":{"production":{"env_vars":{"LAUNCH_REPAIR_TOKEN":null}}}}
          JSON
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @pages-repair-cleanup.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
            > pages-repair-cleanup-result.json
          python3 - <<'PY'
          import json
          d=json.load(open('pages-repair-cleanup-result.json'))
          assert d.get('success'), d.get('errors')
          print('One-time repair credential removed from Pages production config.')
          PY

      - name: Redeploy with repair credential removed
        if: always() && steps.preflight.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy public \
            --project-name="$PAGES_PROJECT" \
            --branch="storefront-social-commerce" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="close guarded runtime migration repair"

      - name: Confirm repair route is closed
        if: always() && steps.preflight.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          closed=0
          for attempt in $(seq 1 25); do
            curl --silent --show-error --location --max-time 15 "$SITE_ORIGIN/api/internal/launch-schema-repair" > marker-after.json || true
            if python3 - <<'PY'
          import json
          try: d=json.load(open('marker-after.json'))
          except Exception: raise SystemExit(1)
          raise SystemExit(0 if d.get('service')=='khonchaiherb-launch-schema-repair' and d.get('enabled') is False else 1)
          PY
            then
              code=$(curl --silent --show-error --location --max-time 15 --output closed-post.json --write-out '%{http_code}' -X POST "$SITE_ORIGIN/api/internal/launch-schema-repair")
              if [ "$code" = "404" ]; then closed=1; break; fi
            fi
            sleep 2
          done
          [ "$closed" = "1" ] || { echo 'Repair route did not return to closed state.' >&2; exit 1; }
          echo 'Guarded runtime repair route is closed.'
