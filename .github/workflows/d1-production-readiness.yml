name: KHONCHAIHERB Production D1 Readiness

on:
  push:
    branches: [storefront-social-commerce]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khonchaiherb-production-d1-readiness
  cancel-in-progress: true

jobs:
  readiness:
    name: Production D1 runtime readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_ORIGIN: https://khonchaiherb-commerce.pages.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: khonchaiherb-commerce
      DATABASE_NAME: khonchaiherb-commerce
      DATABASE_ID: de66c3d3-0082-47ac-b956-58f9c12d13b1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate repository and Pages D1 binding target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Cloudflare API token is missing'; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'Cloudflare Account ID is missing or invalid'; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('wrangler.jsonc').read_text())
          rows=data.get('d1_databases') or []
          expected='de66c3d3-0082-47ac-b956-58f9c12d13b1'
          assert any(x.get('binding')=='DB' and x.get('database_name')=='khonchaiherb-commerce' and x.get('database_id')==expected for x in rows), 'wrangler D1 target does not match production target'
          print('Repository D1 target is pinned to the expected database.')
          PY
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
            > pages-project.json
          DATABASE_ID="$DATABASE_ID" python3 - <<'PY'
          import json,os
          d=json.load(open('pages-project.json'))
          assert d.get('success') is True, d.get('errors')
          prod=((d.get('result') or {}).get('deployment_configs') or {}).get('production') or {}
          db=(prod.get('d1_databases') or {}).get('DB') or {}
          actual=str(db.get('id') or '')
          assert actual==os.environ['DATABASE_ID'], f'Pages DB binding points to unexpected database: {actual[:8] or "missing"}'
          print('Pages production DB binding matches the pinned production D1 database.')
          PY

      - name: Verify D1 through the live Pages runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location --max-time 20 "$SITE_ORIGIN/api/health" > health.json; then
              if python3 - <<'PY'
          import json
          d=json.load(open('health.json'))
          required=['databaseReady','catalogSchemaReady','orderSchemaReady']
          for key in required:
              print(key+'='+str(bool(d.get(key))).lower())
          print('saleReadyProducts='+str(int(d.get('saleReadyProducts') or 0)))
          print('catalogProbeError='+str(d.get('catalogProbeError') or 'none'))
          print('orderProbeError='+str(d.get('orderProbeError') or 'none'))
          if not d.get('databaseReady'):
              raise SystemExit('Pages Functions cannot reach the production D1 binding')
          if not d.get('catalogSchemaReady'):
              raise SystemExit('Catalog schema probe failed: '+str(d.get('catalogProbeError') or 'unknown')[:180])
          if not d.get('orderSchemaReady'):
              raise SystemExit('Order schema probe failed: '+str(d.get('orderProbeError') or 'unknown')[:180])
          PY
              then
                ok=1
                break
              fi
            fi
            sleep 2
          done
          [ "$ok" = "1" ] || { echo 'Production D1 runtime readiness failed.' >&2; exit 1; }
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('health.json'))
          print('SALE_READY_PRODUCTS='+str(int(d.get('saleReadyProducts') or 0)))
          PY
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Diagnose direct D1 REST permission without blocking runtime readiness
        if: steps.runtime.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DATABASE_ID/query"
          printf '%s' '{"sql":"SELECT 1 AS ok;"}' > d1-probe.json
          code=$(curl --silent --show-error --output d1-rest.json --write-out '%{http_code}' \
            -X POST "$API" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @d1-probe.json)
          if [ "$code" = "200" ]; then
            echo 'DIRECT_D1_API=ready' >> "$GITHUB_ENV"
            echo 'Direct D1 REST diagnostic: READY'
          else
            echo "DIRECT_D1_API=not_authorized_http_$code" >> "$GITHUB_ENV"
            echo "Direct D1 REST diagnostic unavailable (HTTP $code); this does not block sales because the Pages runtime DB binding passed all schema probes."
          fi

      - name: Publish D1 readiness verdict
        shell: bash
        run: |
          set -euo pipefail
          echo "### KHONCHAIHERB production D1 readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages DB binding: expected production database" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime database access: READY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Catalog schema: READY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Order schema: READY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sale-ready products: $SALE_READY_PRODUCTS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Direct D1 REST token diagnostic: ${DIRECT_D1_API:-not_checked}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pages runtime readiness is authoritative because it is the same D1 binding used by customer-facing commerce APIs." >> "$GITHUB_STEP_SUMMARY"
