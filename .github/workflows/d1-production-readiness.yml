name: KHONCHAIHERB Production D1 Readiness

on:
  push:
    branches: [storefront-social-commerce]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khonchaiherb-production-d1-readiness
  cancel-in-progress: true

jobs:
  readiness:
    name: Read-only remote D1 readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: khonchaiherb-commerce
      DATABASE_ID: de66c3d3-0082-47ac-b956-58f9c12d13b1
      SHOP_CODE: THLCRLWLHR
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate production credentials and immutable target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare API token is missing"; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "Cloudflare Account ID is missing or invalid"; exit 1; }
          [[ "$DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Configured D1 Database ID is invalid"; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          text=Path('wrangler.jsonc').read_text()
          data=json.loads(text)
          rows=data.get('d1_databases') or []
          assert any(x.get('binding')=='DB' and x.get('database_name')=='khonchaiherb-commerce' and x.get('database_id')=='de66c3d3-0082-47ac-b956-58f9c12d13b1' for x in rows), 'wrangler D1 target does not match production target'
          print('Production D1 target is pinned to the expected database.')
          PY

      - name: Inspect production D1 directly through Cloudflare REST API
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DATABASE_ID/query"

          query_d1() {
            local sql="$1"
            local out="$2"
            SQL="$sql" python3 - <<'PY' > d1-payload.json
          import json,os
          sql=os.environ['SQL']
          if not sql.lstrip().upper().startswith('SELECT '):
              raise SystemExit('Only SELECT queries are allowed in production readiness')
          print(json.dumps({'sql':sql},ensure_ascii=False))
          PY
            http_code=$(curl --silent --show-error --output "$out" --write-out '%{http_code}' \
              -X POST "$API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data @d1-payload.json)
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "Production D1 query returned HTTP $http_code"
              python3 - "$out" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
              errs=d.get('errors') or []
              for e in errs[:3]: print('Cloudflare:', e.get('message') or e.get('code') or 'query failed')
          except Exception:
              pass
          PY
              exit 1
            fi
            python3 - "$out" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          if not d.get('success'):
              print('Cloudflare D1 API reported success=false')
              for e in (d.get('errors') or [])[:3]: print(e.get('message') or e.get('code') or 'query failed')
              raise SystemExit(1)
          result=d.get('result') or []
          for item in result if isinstance(result,list) else [result]:
              if isinstance(item,dict) and item.get('success') is False:
                  print('D1 statement reported success=false')
                  raise SystemExit(1)
          PY
          }

          QUERY="SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
          query_d1 "$QUERY" d1-tables.json

          QUERY="SELECT 'products' AS table_name,name FROM pragma_table_info('products') UNION ALL SELECT 'product_variants',name FROM pragma_table_info('product_variants') UNION ALL SELECT 'product_media',name FROM pragma_table_info('product_media') UNION ALL SELECT 'orders',name FROM pragma_table_info('orders') UNION ALL SELECT 'order_request_registry',name FROM pragma_table_info('order_request_registry');"
          query_d1 "$QUERY" d1-columns.json

          QUERY="SELECT COUNT(*) AS sale_ready_products FROM products p WHERE p.active=1 AND p.sale_verified=1 AND p.price>0 AND (CASE WHEN EXISTS(SELECT 1 FROM product_variants vx WHERE vx.product_id=p.id AND vx.active=1) THEN COALESCE((SELECT SUM(MAX(0,v.stock-COALESCE(v.reserved_stock,0))) FROM product_variants v WHERE v.product_id=p.id AND v.active=1),0) ELSE MAX(0,p.stock-COALESCE(p.reserved_stock,0)) END)>0 AND EXISTS(SELECT 1 FROM product_media m WHERE m.product_id=p.id AND m.active=1);"
          query_d1 "$QUERY" d1-products.json

          python3 - <<'PY'
          import json

          def rows(path):
              d=json.load(open(path))
              out=[]
              r=d.get('result') or []
              for item in r if isinstance(r,list) else [r]:
                  if isinstance(item,dict): out.extend(item.get('results') or [])
              return out

          table_names={str(x.get('name') or '') for x in rows('d1-tables.json')}
          required_tables={
              'products','product_variants','product_media','orders','order_items',
              'order_request_registry','payments','receipts'
          }
          missing_tables=sorted(required_tables-table_names)

          cols={}
          for x in rows('d1-columns.json'):
              cols.setdefault(str(x.get('table_name') or ''),set()).add(str(x.get('name') or ''))
          required_cols={
              'products':{'active','price','stock','reserved_stock','sale_verified'},
              'product_variants':{'product_id','active','stock','reserved_stock'},
              'product_media':{'product_id','object_key','active'},
              'orders':{'idempotency_key','payment_method','payment_status','fulfillment_status'},
              'order_request_registry':{'idempotency_key','request_fingerprint','order_no'}
          }
          missing_cols=[]
          for table,names in required_cols.items():
              for name in sorted(names-cols.get(table,set())):
                  missing_cols.append(f'{table}.{name}')

          product_rows=rows('d1-products.json')
          sale_ready=int((product_rows[0] if product_rows else {}).get('sale_ready_products') or 0)
          print('sale_ready_products='+str(sale_ready))
          print('missing_tables=' + (','.join(missing_tables) if missing_tables else 'none'))
          print('missing_columns=' + (','.join(missing_cols) if missing_cols else 'none'))

          with open('d1-readiness.env','w') as f:
              f.write(f'SALE_READY_PRODUCTS={sale_ready}\n')
              f.write(f'MISSING_TABLES={";".join(missing_tables)}\n')
              f.write(f'MISSING_COLUMNS={";".join(missing_cols)}\n')

          if missing_tables or missing_cols:
              raise SystemExit('Production D1 core sales schema is not ready')
          PY

          cat d1-readiness.env >> "$GITHUB_ENV"
          echo "reachable=true" >> "$GITHUB_OUTPUT"
          echo "### Production D1 connection: READY" >> "$GITHUB_STEP_SUMMARY"
          echo "Direct read-only query succeeded against the pinned production database." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Koonchaishop source registration when source library exists
        if: steps.d1.outputs.reachable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DATABASE_ID/query"
          SQL="SELECT platform,shop_code,shop_name,authorization_scope,active FROM commerce_sources WHERE shop_code='$SHOP_CODE' LIMIT 1;"
          SQL="$SQL" python3 - <<'PY' > d1-source-payload.json
          import json,os
          print(json.dumps({'sql':os.environ['SQL']}))
          PY
          code=$(curl --silent --show-error --output d1-source.json --write-out '%{http_code}' -X POST "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data @d1-source-payload.json)
          if [ "$code" = "200" ]; then
            python3 - <<'PY'
          import json
          d=json.load(open('d1-source.json'))
          text=json.dumps(d,ensure_ascii=False)
          if 'THLCRLWLHR' in text and 'owner_authorized_media_content_reviews' in text:
              print('Koonchaishop owner-authorized source registration is present.')
          else:
              print('Koonchaishop source registration not confirmed; storefront sales readiness is unaffected.')
          PY
          else
            echo "Koonchaishop source-library query skipped because optional commerce source schema is not available."
          fi

      - name: Publish launch-readiness verdict
        shell: bash
        run: |
          set -euo pipefail
          echo "### KHONCHAIHERB D1 launch readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database: $DATABASE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production D1: reachable by direct read-only REST query" >> "$GITHUB_STEP_SUMMARY"
          echo "- Core sales schema: ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sale-ready products: $SALE_READY_PRODUCTS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SALE_READY_PRODUCTS" -gt 0 ]; then
            echo "- Catalog data gate: READY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Catalog data gate: BLOCKED — no verified product currently has price, stock and product media" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
