name: Deploy RUKUBON Healthcare School

on:
  push:
    branches:
      - rakubon-care-school
    paths:
      - 'rakubon-care-school/**'
      - '.github/workflows/rukubon-cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: rukubon-cloudflare-pages
  cancel-in-progress: true

env:
  CF_PROJECT_NAME: rukubon-healthcare-school
  CF_PRODUCTION_BRANCH: rakubon-care-school

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the two Cloudflare secrets in GitHub repository Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Ensure Cloudflare Pages project exists
        working-directory: rakubon-care-school
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if wrangler pages project list | grep -Fq "$CF_PROJECT_NAME"; then
            echo "Cloudflare Pages project '$CF_PROJECT_NAME' already exists."
          else
            echo "Creating Cloudflare Pages project '$CF_PROJECT_NAME'..."
            wrangler pages project create "$CF_PROJECT_NAME" --production-branch="$CF_PRODUCTION_BRANCH"
          fi

      - name: Deploy website
        id: deploy
        working-directory: rakubon-care-school
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          wrangler pages deploy . --project-name="$CF_PROJECT_NAME" --branch="${GITHUB_REF_NAME}" 2>&1 | tee /tmp/rukubon-cloudflare-deploy.log
          DEPLOYMENT_URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' /tmp/rukubon-cloudflare-deploy.log | tail -1 || true)
          echo "deployment_url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        if: success()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          echo "## RUKUBON HEALTHCARE SCHOOL" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare Pages deployment completed successfully." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Deployment URL: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
