name: KHONCHAIHERB Production Public Smoke

on:
  push:
    branches: [storefront-social-commerce]
  workflow_run:
    workflows: ["Deploy KHONCHAIHERB to Cloudflare Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khonchaiherb-production-public-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify deployed storefront and public Koonchaishop feed
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SITE_ORIGIN: https://khonchaiherb-commerce.pages.dev
    steps:
      - name: Check deployed storefront v1.35 HTML
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 20 "$SITE_ORIGIN/" > storefront.html; then
              if grep -Fq '/tshop-v132-conversion-storefront.css?v=1.32.0' storefront.html \
                && grep -Fq '/tshop-v1321-search-visibility-fix.css?v=1.32.1' storefront.html \
                && grep -Fq '/tshop-v133-readable-storefront.css?v=1.33.1' storefront.html \
                && grep -Fq '/tshop-v134-structural-storefront.css?v=1.34.0' storefront.html \
                && grep -Fq '/tshop-v1341-header-dedupe.css?v=1.34.1' storefront.html \
                && grep -Fq '/tshop-v135-lower-standard.css?v=1.35.0' storefront.html \
                && grep -Fq '/kch-conversion-storefront.js?v=1.32.0' storefront.html \
                && grep -Fq '/kch-readable-storefront.js?v=1.33.1' storefront.html \
                && grep -Fq '/kch-v134-structural-storefront.js?v=1.34.0' storefront.html \
                && grep -Fq '/kch-v1341-header-dedupe.js?v=1.34.1' storefront.html \
                && grep -Fq 'KHONCHAIHERB' storefront.html; then
                ok=1
                break
              fi
            fi
            echo "Storefront v1.35 not visible yet (attempt $attempt/30); waiting for Pages deploy..."
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo 'Latest storefront v1.35 assets were not observed on Production.' >&2
            exit 1
          fi
          echo 'Deployed storefront v1.35 HTML: OK'

      - name: Verify deployed Seller Manager readiness guard
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location --max-time 20 "$SITE_ORIGIN/seller-koonchaishop.html" > seller-koonchaishop.html; then
              if grep -Fq '/kch-koonchaishop-admin-readiness.js?v=1.0.1' seller-koonchaishop.html; then ok=1; break; fi
            fi
            echo "Seller readiness guard v1.0.1 not visible yet (attempt $attempt/20); waiting for Pages deploy..."
            sleep 3
          done
          [ "$ok" = "1" ] || { echo 'Latest Seller Manager readiness guard was not observed on Production.' >&2; exit 1; }
          curl --fail --silent --show-error --location --max-time 20 "$SITE_ORIGIN/kch-koonchaishop-admin-readiness.js?v=1.0.1" > admin-readiness.js
          grep -Fq "const BUILD='1.0.1'" admin-readiness.js
          grep -Fq '__KCH_KOONCHAISHOP_ADMIN_READINESS_BOOT__' admin-readiness.js
          grep -Fq 'migration_0021_required' admin-readiness.js
          grep -Fq 'setForms(false)' admin-readiness.js
          echo 'Production Seller Manager readiness guard v1.0.1: OK'

      - name: Check public Koonchaishop feed contract
        id: source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 3 --max-time 20 \
            "$SITE_ORIGIN/api/koonchaishop-feed?limit=2" > koonchaishop-feed.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('koonchaishop-feed.json').read_text())
          source=data.get('source') or {}
          assert source.get('shopName')=='Koonchaishop', source
          assert source.get('shopCode')=='THLCRLWLHR', source
          assert source.get('platformKey')=='tiktok_shop', source
          assets=data.get('assets') or []
          reviews=data.get('reviews') or []
          assert isinstance(assets,list) and isinstance(reviews,list)
          for review in reviews:
              assert review.get('verifiedOnSite') is False, 'external review must never be on-site verified'
          ready=data.get('databaseReady') is True
          Path('production-source-state.txt').write_text(
              f"databaseReady={'true' if ready else 'false'}\nassets={len(assets)}\nreviews={len(reviews)}\n"
          )
          print('Public Koonchaishop feed contract: OK')
          PY
          cat production-source-state.txt
          ready=$(awk -F= '/^databaseReady=/{print $2}' production-source-state.txt)
          assets=$(awk -F= '/^assets=/{print $2}' production-source-state.txt)
          reviews=$(awk -F= '/^reviews=/{print $2}' production-source-state.txt)
          echo "database_ready=$ready" >> "$GITHUB_OUTPUT"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          echo "reviews=$reviews" >> "$GITHUB_OUTPUT"

      - name: Report production source readiness
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.source.outputs.database_ready }}" = "true" ]; then
            echo "### Production Koonchaishop feed: DATABASE READY" >> "$GITHUB_STEP_SUMMARY"
            echo "The deployed Pages Functions binding can read the Koonchaishop source schema." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Production Koonchaishop feed: DATABASE NOT READY" >> "$GITHUB_STEP_SUMMARY"
            echo "The deployed storefront is healthy, but migration 0021 is not readable through the production D1 binding yet." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Published assets returned by smoke query: ${{ steps.source.outputs.assets }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Published reviews returned by smoke query: ${{ steps.source.outputs.reviews }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed storefront assets and build markers
        shell: bash
        run: |
          set -euo pipefail
          fetch_asset(){ curl --fail --silent --show-error --location --max-time 20 "$SITE_ORIGIN/$1" > "$2"; echo "fetched $1"; }
          require_text(){ if grep -Fq "$2" "$1"; then echo "OK $3"; else echo "MISSING $3 :: expected [$2] in $1" >&2; exit 1; fi; }

          fetch_asset 'kch-koonchaishop-commerce.js?v=1.30.1' source-runtime.js
          fetch_asset 'tshop-v130-koonchaishop.css?v=1.30.0' source-styles.css
          fetch_asset 'kch-conversion-storefront.js?v=1.32.0' conversion-runtime.js
          fetch_asset 'tshop-v132-conversion-storefront.css?v=1.32.0' conversion-styles.css
          fetch_asset 'kch-readable-storefront.js?v=1.33.1' readable-runtime.js
          fetch_asset 'tshop-v133-readable-storefront.css?v=1.33.1' readable-styles.css
          fetch_asset 'kch-v134-structural-storefront.js?v=1.34.0' structural-runtime.js
          fetch_asset 'tshop-v134-structural-storefront.css?v=1.34.0' structural-styles.css
          fetch_asset 'kch-v1341-header-dedupe.js?v=1.34.1' header-dedupe-runtime.js
          fetch_asset 'tshop-v1341-header-dedupe.css?v=1.34.1' header-dedupe-styles.css
          fetch_asset 'tshop-v135-lower-standard.css?v=1.35.0' lower-standard.css
          fetch_asset 'sw.js?v=1.35.0' service-worker.js

          require_text source-runtime.js "const BUILD='1.30.1'" 'Koonchaishop runtime build'
          require_text source-styles.css 'KHONCHAIHERB Commerce v1.30' 'Koonchaishop style build'
          require_text conversion-runtime.js "const BUILD='1.32.0'" 'conversion runtime build'
          require_text conversion-styles.css 'KHONCHAIHERB v1.32.0' 'conversion style build'
          require_text readable-runtime.js "const BUILD='1.33.1'" 'readable storefront runtime build'
          require_text readable-styles.css 'KHONCHAIHERB v1.33.1' 'readable storefront style build'
          require_text structural-runtime.js "const BUILD='1.34.0'" 'structural runtime build'
          require_text structural-styles.css 'KHONCHAIHERB v1.34.0' 'structural style build'
          require_text structural-styles.css '#kch-v134-header.kch-v134-header' 'structural header selector'
          require_text structural-styles.css 'font-size:16px!important' 'readable 16px baseline'
          require_text structural-styles.css 'font-size:18px!important' 'product readable 18px baseline'
          require_text structural-styles.css '.kch-v134-obsolete-header' 'legacy header removal rule'
          require_text structural-runtime.js 'kch-master-shell' 'structural shell activation'
          require_text structural-runtime.js 'data-v134-go="account"' 'account action in structural header'
          require_text header-dedupe-runtime.js "const BUILD='1.34.1'" 'header de-duplication runtime build'
          require_text header-dedupe-runtime.js '__KCH_V1341_HEADER_DEDUPE__' 'header de-duplication boot guard'
          require_text header-dedupe-styles.css 'KHONCHAIHERB v1.34.1' 'header de-duplication style build'
          require_text lower-standard.css 'KHONCHAIHERB v1.35.0' 'lower storefront standard build'
          require_text lower-standard.css '.kch-footer-v2 .kch-footer-confidence' 'footer confidence rail standard'
          require_text lower-standard.css '.kch-footer-v2 .kch-master-footer-inner' 'footer information architecture standard'
          require_text lower-standard.css '.kch-master-home .kch-master-trust' 'pre-footer service standard'
          require_text service-worker.js "const CACHE='khonchaiherb-v" 'versioned service worker cache'
          require_text service-worker.js '/tshop-v133-readable-storefront.css?v=1.33.1' 'service worker v1.33 CSS cache'
          require_text service-worker.js '/kch-readable-storefront.js?v=1.33.1' 'service worker v1.33 JS cache'
          require_text service-worker.js '/tshop-v134-structural-storefront.css?v=1.34.0' 'service worker v1.34 CSS cache'
          require_text service-worker.js '/kch-v134-structural-storefront.js?v=1.34.0' 'service worker v1.34 JS cache'
          require_text service-worker.js '/tshop-v1341-header-dedupe.css?v=1.34.1' 'service worker v1.34.1 CSS cache'
          require_text service-worker.js '/kch-v1341-header-dedupe.js?v=1.34.1' 'service worker v1.34.1 JS cache'
          require_text service-worker.js '/tshop-v135-lower-standard.css?v=1.35.0' 'service worker v1.35 lower standard cache'
          echo 'Production v1.35 storefront assets: OK'
