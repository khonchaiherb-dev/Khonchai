name: KHONCHAIHERB Production Public Smoke

on:
  push:
    branches: [storefront-social-commerce]
  workflow_run:
    workflows: ["Deploy KHONCHAIHERB to Cloudflare Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khonchaiherb-production-public-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify clean Storefront V1 and public commerce runtime
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_ORIGIN: https://khonchaiherb-commerce.pages.dev
      STOREFRONT_VERSION: 2026.09.05.5
      STOREFRONT_META: v1-clean-2026-09-05
    steps:
      - name: Wait for clean Storefront V1 deployment
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "$SITE_ORIGIN/?production-smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" > storefront.html; then
              if grep -Fq "content=\"${STOREFRONT_META}\"" storefront.html \
                && grep -Fq "/storefront-v1.css?v=${STOREFRONT_VERSION}" storefront.html \
                && grep -Fq "/storefront-v1.js?v=${STOREFRONT_VERSION}" storefront.html; then
                ok=1
                break
              fi
            fi
            echo "Clean Storefront V1 not visible yet (attempt $attempt/60); waiting for production Pages deployment..."
            sleep 4
          done
          [ "$ok" = "1" ] || { echo 'Clean Storefront V1 fingerprint was not observed on canonical Production.' >&2; exit 1; }

          if grep -Eqi 'tshop-v[0-9]+|kch-rescue-live|kch-master-reference-2026|FLASH DEAL|Verified Purchase|WELCOME50|HERB10' storefront.html; then
            echo 'Legacy or unverified commerce content is still present in canonical Production HTML.' >&2
            exit 1
          fi
          grep -Fq 'KHON CHAI HERB' storefront.html
          grep -Fq 'data-product-grid' storefront.html
          grep -Fq 'data-layer="cart"' storefront.html
          grep -Fq 'data-layer="checkout"' storefront.html
          echo 'Canonical Production is serving clean Storefront V1: OK'

      - name: Verify clean storefront assets and service worker
        shell: bash
        run: |
          set -euo pipefail
          fetch(){
            local url="$1" out="$2"
            curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 --max-time 20 \
              -H 'Cache-Control: no-cache' "$SITE_ORIGIN/$url" > "$out"
          }

          fetch "storefront-v1.css?v=${STOREFRONT_VERSION}" storefront-v1.css
          fetch "storefront-v1.js?v=${STOREFRONT_VERSION}" storefront-v1.js
          fetch "sw.js?v=${STOREFRONT_VERSION}" service-worker.js

          grep -Fq -- '--kch-container:1280px' storefront-v1.css
          grep -Fq '@media(max-width:840px)' storefront-v1.css
          grep -Fq '@media(max-width:560px)' storefront-v1.css
          grep -Fq '/api/products' storefront-v1.js
          grep -Fq '/api/product-detail' storefront-v1.js
          grep -Fq '/api/payment-options' storefront-v1.js
          grep -Fq '/api/orders' storefront-v1.js
          grep -Fq 'idempotencyKey' storefront-v1.js
          grep -Fq "paymentMethod:'COD'" storefront-v1.js
          grep -Fq "/sw.js?v=${STOREFRONT_VERSION}" storefront-v1.js
          grep -Fq "resilient cache lifecycle ${STOREFRONT_VERSION}" service-worker.js
          grep -Fq "runtime-${STOREFRONT_VERSION}" service-worker.js
          grep -Fq "/storefront-v1.css?v=${STOREFRONT_VERSION}" service-worker.js
          grep -Fq "/storefront-v1.js?v=${STOREFRONT_VERSION}" service-worker.js
          grep -Fq 'Promise.allSettled(CORE.map' service-worker.js
          grep -Fq "new Request(url,{cache:'no-store'})" service-worker.js

          if grep -Eqi 'tshop-v[0-9]+|kch-rescue-live|kch-master-reference-2026' service-worker.js; then
            echo 'Service worker still references retired storefront generations.' >&2
            exit 1
          fi
          echo 'Canonical Storefront V1 assets and resilient service-worker generation: OK'

      - name: Verify live catalog and product media without creating an order
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 3 --max-time 20 \
            -H 'Cache-Control: no-cache' "$SITE_ORIGIN/api/products" > products.json
          python3 - <<'PY'
          import json, pathlib, urllib.parse
          data=json.loads(pathlib.Path('products.json').read_text())
          rows=data.get('products') or []
          assert rows, 'production catalog has no sale-ready product'
          live=[]
          for p in rows:
              price=float(p.get('price') or 0)
              stock=float(p.get('stock') or p.get('available_stock') or 0)
              if price>0 and stock>0:
                  image=p.get('image_url') or ((p.get('media') or [{}])[0].get('url') if isinstance(p.get('media'),list) else None)
                  assert image, f"sale-ready product missing media: {p.get('slug') or p.get('id')}"
                  live.append((p,image))
          assert live, 'catalog returned rows but none are sale-ready'
          p,image=live[0]
          pathlib.Path('product-image.txt').write_text(str(image))
          pathlib.Path('catalog-state.txt').write_text(
              f"sale_ready={len(live)}\nfirst_slug={p.get('slug','')}\nfirst_price={p.get('price','')}\nfirst_stock={p.get('stock',p.get('available_stock',''))}\n"
          )
          print(pathlib.Path('catalog-state.txt').read_text(),end='')
          PY

          image=$(cat product-image.txt)
          case "$image" in
            http://*|https://*) image_url="$image" ;;
            /*) image_url="$SITE_ORIGIN$image" ;;
            *) image_url="$SITE_ORIGIN/$image" ;;
          esac
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 --max-time 20 \
            --output /dev/null "$image_url"
          echo "sale_ready=$(awk -F= '/^sale_ready=/{print $2}' catalog-state.txt)" >> "$GITHUB_OUTPUT"
          echo 'Production live catalog and product media: OK'

      - name: Verify checkout and COD readiness without creating an order
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 3 --max-time 20 \
            -H 'Cache-Control: no-cache' "$SITE_ORIGIN/api/payment-options" > payment-options.json
          python3 - <<'PY'
          import json, pathlib
          data=json.loads(pathlib.Path('payment-options.json').read_text())
          assert data.get('checkoutEnabled') is True, data
          caps=data.get('capabilities') or []
          methods=data.get('methods') or []
          cod=False
          for row in [*caps,*methods]:
              if str(row.get('id','')).upper()=='COD' and row.get('enabled') is True:
                  cod=True
          assert cod, data
          for row in [*caps,*methods]:
              rid=str(row.get('id','')).upper()
              if rid in {'CARD','ONLINE','QR','PROMPTPAY','STRIPE'}:
                  assert row.get('enabled') is not True, f'unverified online payment is enabled: {row}'
          print('Checkout enabled and COD capability verified; no production order created.')
          PY

      - name: Verify deployed Seller Manager readiness guard
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 2 --max-time 20 \
            "$SITE_ORIGIN/seller-koonchaishop.html" > seller-koonchaishop.html
          grep -Fq '/kch-koonchaishop-admin-readiness.js?v=1.0.1' seller-koonchaishop.html
          curl --fail --silent --show-error --location --max-time 20 \
            "$SITE_ORIGIN/kch-koonchaishop-admin-readiness.js?v=1.0.1" > admin-readiness.js
          grep -Fq "const BUILD='1.0.1'" admin-readiness.js
          grep -Fq '__KCH_KOONCHAISHOP_ADMIN_READINESS_BOOT__' admin-readiness.js
          echo 'Production Seller Manager readiness guard: OK'

      - name: Verify Revenue Control Center surface
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 2 --max-time 20 \
            "$SITE_ORIGIN/seller-revenue.html" > seller-revenue.html
          grep -Fq 'Production & Revenue Control Center' seller-revenue.html
          grep -Fq 'noindex,nofollow,noarchive' seller-revenue.html
          grep -Fq '/api/admin/revenue-readiness' seller-revenue.html
          echo 'Production Revenue Control Center surface: OK'

      - name: Check public Koonchaishop feed provenance contract
        id: source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 3 --max-time 20 \
            "$SITE_ORIGIN/api/koonchaishop-feed?limit=2" > koonchaishop-feed.json
          python3 - <<'PY'
          import json, pathlib
          data=json.loads(pathlib.Path('koonchaishop-feed.json').read_text())
          source=data.get('source') or {}
          assert source.get('shopName')=='Koonchaishop', source
          assert source.get('shopCode')=='THLCRLWLHR', source
          assert source.get('platformKey')=='tiktok_shop', source
          assets=data.get('assets') or []
          reviews=data.get('reviews') or []
          assert isinstance(assets,list) and isinstance(reviews,list)
          for review in reviews:
              assert review.get('verifiedOnSite') is False, 'external review must never be marked on-site verified'
          pathlib.Path('source-state.txt').write_text(
              f"database_ready={'true' if data.get('databaseReady') is True else 'false'}\nassets={len(assets)}\nreviews={len(reviews)}\n"
          )
          print('Public Koonchaishop provenance contract: OK')
          PY
          cat source-state.txt
          echo "database_ready=$(awk -F= '/^database_ready=/{print $2}' source-state.txt)" >> "$GITHUB_OUTPUT"
          echo "assets=$(awk -F= '/^assets=/{print $2}' source-state.txt)" >> "$GITHUB_OUTPUT"
          echo "reviews=$(awk -F= '/^reviews=/{print $2}' source-state.txt)" >> "$GITHUB_OUTPUT"

      - name: Report production readiness
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### KHONCHAIHERB Clean Storefront V1 — Production Public Smoke'
            echo ''
            echo '- Canonical clean Storefront V1 fingerprint: PASS'
            echo '- Retired legacy storefront references in customer HTML: NONE'
            echo '- Storefront CSS/JS/service-worker generation contract: PASS'
            echo '- Live sale-ready catalog + product media: PASS'
            echo '- Checkout + COD readiness (no real order created): PASS'
            echo '- Seller Manager surface: PASS'
            echo '- Revenue Control Center surface: PASS'
            echo "- Sale-ready products observed: ${{ steps.catalog.outputs.sale_ready }}"
            echo "- Koonchaishop source database ready: ${{ steps.source.outputs.database_ready }}"
            echo "- Published source assets: ${{ steps.source.outputs.assets }}"
            echo "- Published source reviews: ${{ steps.source.outputs.reviews }}"
          } >> "$GITHUB_STEP_SUMMARY"
