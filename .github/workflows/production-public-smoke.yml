name: KHONCHAIHERB Production Public Smoke

on:
  push:
    branches: [storefront-social-commerce]
  workflow_run:
    workflows: ["Deploy KHONCHAIHERB to Cloudflare Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khonchaiherb-production-public-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify deployed storefront and public Koonchaishop feed
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_ORIGIN: https://khonchaiherb-commerce.pages.dev
    steps:
      - name: Check deployed storefront HTML
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 6 --retry-all-errors --retry-delay 3 \
            --max-time 20 \
            "$SITE_ORIGIN/" > storefront.html
          python3 - <<'PY'
          from pathlib import Path
          html=Path('storefront.html').read_text(errors='replace')
          required=[
            '/tshop-v130-koonchaishop.css?v=1.30.0',
            '/kch-koonchaishop-commerce.js?v=1.30.1',
            'KHONCHAIHERB'
          ]
          missing=[token for token in required if token not in html]
          if missing:
              raise SystemExit('deployed storefront is missing expected v1.30 assets: '+', '.join(missing))
          print('Deployed storefront v1.30 assets: OK')
          PY

      - name: Check public Koonchaishop feed contract
        id: source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 6 --retry-all-errors --retry-delay 3 \
            --max-time 20 \
            "$SITE_ORIGIN/api/koonchaishop-feed?limit=2" > koonchaishop-feed.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('koonchaishop-feed.json').read_text())
          source=data.get('source') or {}
          assert source.get('shopName')=='Koonchaishop', source
          assert source.get('shopCode')=='THLCRLWLHR', source
          assert source.get('platformKey')=='tiktok_shop', source
          assets=data.get('assets') or []
          reviews=data.get('reviews') or []
          assert isinstance(assets,list) and isinstance(reviews,list)
          for review in reviews:
              assert review.get('verifiedOnSite') is False, 'external review must never be on-site verified'
          ready=data.get('databaseReady') is True
          Path('production-source-state.txt').write_text(
              f"databaseReady={'true' if ready else 'false'}\nassets={len(assets)}\nreviews={len(reviews)}\n"
          )
          print('Public Koonchaishop feed contract: OK')
          PY
          cat production-source-state.txt
          ready=$(awk -F= '/^databaseReady=/{print $2}' production-source-state.txt)
          assets=$(awk -F= '/^assets=/{print $2}' production-source-state.txt)
          reviews=$(awk -F= '/^reviews=/{print $2}' production-source-state.txt)
          echo "database_ready=$ready" >> "$GITHUB_OUTPUT"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          echo "reviews=$reviews" >> "$GITHUB_OUTPUT"

      - name: Report production source readiness
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.source.outputs.database_ready }}" = "true" ]; then
            echo "### Production Koonchaishop feed: DATABASE READY" >> "$GITHUB_STEP_SUMMARY"
            echo "The deployed Pages Functions binding can read the Koonchaishop source schema." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Production Koonchaishop feed: DATABASE NOT READY" >> "$GITHUB_STEP_SUMMARY"
            echo "The deployed storefront is healthy, but migration 0021 is not readable through the production D1 binding yet." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Published assets returned by smoke query: ${{ steps.source.outputs.assets }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Published reviews returned by smoke query: ${{ steps.source.outputs.reviews }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public source assets are reachable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            "$SITE_ORIGIN/kch-koonchaishop-commerce.js?v=1.30.1" > source-runtime.js
          curl --fail --silent --show-error --location --max-time 20 \
            "$SITE_ORIGIN/tshop-v130-koonchaishop.css?v=1.30.0" > source-styles.css
          grep -q '__KCH_KOONCHAISHOP_COMMERCE__' source-runtime.js
          grep -q '.kch-source-section' source-styles.css
          echo "Production source runtime + styles: OK"
