name: KHONCHAIHERB Production Public Smoke

on:
  push:
    branches: [storefront-social-commerce]
  workflow_run:
    workflows: ["Deploy KHONCHAIHERB to Cloudflare Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khonchaiherb-production-public-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify deployed storefront and public Koonchaishop feed
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_ORIGIN: https://khonchaiherb-commerce.pages.dev
    steps:
      - name: Wait for current storefront deployment
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 35); do
            if curl --fail --silent --show-error --location --max-time 20 "$SITE_ORIGIN/" > storefront.html; then
              if grep -Fq 'KHONCHAIHERB' storefront.html \
                && grep -Fq 'tshop-v133-readable-storefront.css' storefront.html \
                && grep -Fq 'kch-readable-storefront.js' storefront.html \
                && grep -Fq 'tshop-v134-structural-storefront.css' storefront.html \
                && grep -Fq 'kch-v134-structural-storefront.js' storefront.html \
                && grep -Fq 'tshop-v1341-header-dedupe.css' storefront.html \
                && grep -Fq 'kch-v1341-header-dedupe.js' storefront.html \
                && grep -Fq 'tshop-v135-lower-standard.css' storefront.html; then
                ok=1
                break
              fi
            fi
            echo "Current storefront assets not visible yet (attempt $attempt/35); waiting for Pages deploy..."
            sleep 3
          done
          [ "$ok" = "1" ] || { echo 'Current storefront asset set was not observed on Production.' >&2; exit 1; }
          echo 'Current deployed storefront HTML: OK'

      - name: Verify deployed Seller Manager readiness guard
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location --max-time 20 "$SITE_ORIGIN/seller-koonchaishop.html" > seller-koonchaishop.html; then
              if grep -Fq '/kch-koonchaishop-admin-readiness.js?v=1.0.1' seller-koonchaishop.html; then ok=1; break; fi
            fi
            echo "Seller readiness guard not visible yet (attempt $attempt/20); waiting for Pages deploy..."
            sleep 3
          done
          [ "$ok" = "1" ] || { echo 'Seller Manager readiness guard was not observed on Production.' >&2; exit 1; }
          curl --fail --silent --show-error --location --max-time 20 "$SITE_ORIGIN/kch-koonchaishop-admin-readiness.js?v=1.0.1" > admin-readiness.js
          grep -Fq "const BUILD='1.0.1'" admin-readiness.js
          grep -Fq '__KCH_KOONCHAISHOP_ADMIN_READINESS_BOOT__' admin-readiness.js
          grep -Fq 'migration_0021_required' admin-readiness.js
          grep -Fq 'setForms(false)' admin-readiness.js
          echo 'Production Seller Manager readiness guard: OK'

      - name: Verify Revenue Control Center surface
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 2 --max-time 20 \
            "$SITE_ORIGIN/seller-revenue.html" > seller-revenue.html
          grep -Fq 'Production & Revenue Control Center' seller-revenue.html
          grep -Fq 'noindex,nofollow,noarchive' seller-revenue.html
          grep -Fq '/api/admin/revenue-readiness' seller-revenue.html
          grep -Fq '/api/admin/checkout-recovery' seller-revenue.html
          grep -Fq '/api/admin/cod-risk' seller-revenue.html
          echo 'Production Revenue Control Center surface: OK'

      - name: Check public Koonchaishop feed contract
        id: source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 3 --max-time 20 \
            "$SITE_ORIGIN/api/koonchaishop-feed?limit=2" > koonchaishop-feed.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('koonchaishop-feed.json').read_text())
          source=data.get('source') or {}
          assert source.get('shopName')=='Koonchaishop', source
          assert source.get('shopCode')=='THLCRLWLHR', source
          assert source.get('platformKey')=='tiktok_shop', source
          assets=data.get('assets') or []
          reviews=data.get('reviews') or []
          assert isinstance(assets,list) and isinstance(reviews,list)
          for review in reviews:
              assert review.get('verifiedOnSite') is False, 'external review must never be on-site verified'
          ready=data.get('databaseReady') is True
          Path('production-source-state.txt').write_text(
              f"databaseReady={'true' if ready else 'false'}\nassets={len(assets)}\nreviews={len(reviews)}\n"
          )
          print('Public Koonchaishop feed contract: OK')
          PY
          cat production-source-state.txt
          ready=$(awk -F= '/^databaseReady=/{print $2}' production-source-state.txt)
          assets=$(awk -F= '/^assets=/{print $2}' production-source-state.txt)
          reviews=$(awk -F= '/^reviews=/{print $2}' production-source-state.txt)
          echo "database_ready=$ready" >> "$GITHUB_OUTPUT"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          echo "reviews=$reviews" >> "$GITHUB_OUTPUT"

      - name: Verify deployed storefront behavioral invariants
        shell: bash
        run: |
          set -euo pipefail
          fetch_asset(){ curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 --max-time 20 "$SITE_ORIGIN/$1" > "$2"; echo "fetched $1"; }
          require_text(){ if grep -Fq "$2" "$1"; then echo "OK $3"; else echo "MISSING $3 :: expected [$2] in $1" >&2; exit 1; fi; }

          fetch_asset 'kch-readable-storefront.js?v=1.33.1' readable-runtime.js
          fetch_asset 'tshop-v134-structural-storefront.css?v=1.34.0' structural-styles.css
          fetch_asset 'kch-v134-structural-storefront.js?v=1.34.0' structural-runtime.js
          fetch_asset 'kch-v1341-header-dedupe.js?v=1.34.1' header-dedupe-runtime.js
          fetch_asset 'tshop-v1341-header-dedupe.css?v=1.34.1' header-dedupe-styles.css
          fetch_asset 'tshop-v135-lower-standard.css?v=1.35.0' lower-standard.css
          fetch_asset 'kch-revenue-core.js?v=1.0.0' revenue-core.js
          fetch_asset 'sw.js?v=1.35.0' service-worker.js

          require_text readable-runtime.js "const BUILD='1.33.1'" 'readable storefront runtime'
          require_text readable-runtime.js 'window.__KCH_MASTER_SEARCH__' 'canonical search owner bridge'
          require_text readable-runtime.js "owner.source='v133-window-input'" 'canonical search input handoff'
          require_text readable-runtime.js "removeAttribute('data-kch-v131-search-match')" 'legacy search state cleanup'
          require_text readable-runtime.js 'min-width:48px!important;min-height:48px!important' 'tablet 48px touch target guard'

          require_text structural-styles.css 'structural storefront baseline' 'structural storefront baseline marker'
          require_text structural-styles.css '#kch-v134-header.kch-v134-header' 'structural header selector'
          require_text structural-styles.css 'font-size:16px!important' 'readable 16px baseline'
          require_text structural-styles.css 'font-size:18px!important' 'product readable 18px baseline'
          require_text structural-styles.css '.kch-v134-obsolete-header' 'legacy header removal rule'
          require_text structural-runtime.js 'kch-master-shell' 'structural shell activation'
          require_text structural-runtime.js 'data-v134-go="account"' 'account action in structural header'
          require_text header-dedupe-runtime.js '__KCH_V1341_HEADER_DEDUPE__' 'header de-duplication boot guard'
          require_text header-dedupe-styles.css 'kch-v1341-hidden-legacy' 'header de-duplication CSS guard'
          require_text lower-standard.css '.kch-footer-v2 .kch-footer-confidence' 'footer confidence rail standard'
          require_text lower-standard.css '.kch-master-home .kch-master-trust' 'pre-footer service standard'
          require_text revenue-core.js '/api/checkout-session' 'checkout recovery session integration'
          require_text revenue-core.js 'recoveryAllowed:false' 'completed checkout recovery stop'
          require_text service-worker.js '/kch-readable-storefront.js?v=1.33.1' 'service worker readable runtime cache'
          require_text service-worker.js '/kch-v134-structural-storefront.js?v=1.34.0' 'service worker structural runtime cache'
          require_text service-worker.js '/kch-v1341-header-dedupe.js?v=1.34.1' 'service worker header dedupe cache'
          echo 'Production storefront behavioral invariants: OK'

      - name: Report production readiness
        shell: bash
        run: |
          set -euo pipefail
          echo "### KHONCHAIHERB Production Public Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "Storefront structure, canonical search bridge, tablet touch target, revenue core, Seller Manager and public Koonchaishop feed contracts were verified." >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.source.outputs.database_ready }}" = "true" ]; then
            echo "Koonchaishop source database: READY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Koonchaishop source database: NOT READY / migration or binding still required" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Published assets returned: ${{ steps.source.outputs.assets }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Published reviews returned: ${{ steps.source.outputs.reviews }}" >> "$GITHUB_STEP_SUMMARY"
