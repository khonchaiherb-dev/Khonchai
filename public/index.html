const S={frame:0,health:null,healthKnown:false,sanitizing:false,shelfKey:'',cartKey:''};
const DRAFT='kch-checkout-draft-session-v1';
const demo=p=>[[1,189,86,1248],[2,149,120,938],[3,459,42,524],[4,99,210,2201],[5,129,64,781],[6,699,25,194]].some(x=>Number(p?.id)===x[0]&&Number(p?.price)===x[1]&&Number(p?.stock)===x[2]&&Number(p?.sold)===x[3]);
const ready=p=>Boolean(p)&&Number(p.price||0)>0&&Number(p.stock||0)>0&&!p.comingSoon&&Boolean(String(p.image||'').trim())&&!demo(p);
const readyList=()=>Array.isArray(PRODUCTS)?PRODUCTS.filter(ready):[];
const productBySlug=s=>(Array.isArray(PRODUCTS)?PRODUCTS:[]).find(p=>String(p.slug)===String(s));
function sanitizeCart(){if(typeof cart==='undefined'||!Array.isArray(cart)||!Array.isArray(PRODUCTS)||S.sanitizing)return false;let changed=false;const next=[];for(const line of cart){const p=PRODUCTS.find(x=>Number(x.id)===Number(line.id));if(!ready(p)){changed=true;continue}const q=Math.max(1,Math.min(Number(p.stock||1),Number(line.qty||1)));const merged={...line,...p,qty:q,lineKey:line.lineKey||`${p.id}:${Number(line.variantId||0)}`};if(q!==Number(line.qty||1)||Number(line.price)!==Number(p.price)||String(line.image||'')!==String(p.image||''))changed=true;next.push(merged)}if(!changed)return false;S.sanitizing=true;cart=next;if(typeof save==='function')save();document.querySelectorAll('.badge').forEach(x=>x.textContent=typeof count==='function'?count():next.length);const page=typeof current==='undefined'?'':String(current);setTimeout(()=>{S.sanitizing=false;if(page==='cart'&&typeof cartPage==='function')cartPage();else if(page==='checkout'&&typeof checkout==='function')checkout()},0);return true}
function launchSafety(){if(typeof current==='undefined'||!['home','product'].includes(String(current)))return;document.querySelectorAll('.tshop-card[data-product],.flash-product[data-product]').forEach(el=>{el.hidden=!ready(productBySlug(el.dataset.product))});document.querySelectorAll('.tshop-meta').forEach(el=>el.hidden=true);document.querySelectorAll('.pdp-sold span').forEach(el=>{if(/ขายแล้ว|⭐/.test(el.textContent||''))el.hidden=true});document.querySelector('.flash-countdown')?.setAttribute('hidden','');const live=document.getElementById('live');if(live?.querySelector('.live-card'))live.hidden=true;const videos=document.querySelector('.video-feed')?.closest('.tshop-section');if(videos)videos.hidden=true;const list=readyList();document.querySelectorAll('.category-strip [data-cat]').forEach(b=>{const c=String(b.dataset.cat||'');b.hidden=c!=='ทั้งหมด'&&!list.some(p=>String(p.cat)===c)});if(String(current)==='product'&&typeof selected!=='undefined'&&!ready(selected)){document.querySelectorAll('[data-add],[data-buy]').forEach(b=>{b.disabled=true;if(b.matches('[data-buy]'))b.textContent='ยังไม่เปิดจำหน่าย';else b.textContent='รอยืนยันข้อมูลสินค้า'})}}
function shelf(){if(typeof current==='undefined'||current!=='home')return;const hero=document.querySelector('.tshop-hero');if(!hero)return;const list=readyList().slice(0,4),key=list.map(p=>`${p.id}:${p.price}:${p.stock}:${p.image}`).join('|');let el=document.querySelector('.kch-ready-shelf');if(!list.length){el?.remove();S.shelfKey='';return}if(el&&S.shelfKey===key)return;el?.remove();el=document.createElement('section');el.className='kch-ready-shelf';el.innerHTML=`<div class="kch-ready-head"><div><span>พร้อมสั่งซื้อ</span><h2>เลือกสินค้าที่พร้อมส่งได้ทันที</h2><p>แสดงเฉพาะรายการที่ยืนยันรูปสินค้า ราคา และสต็อกแล้ว</p></div><button type="button" data-kch-all>ดูสินค้าทั้งหมด</button></div><div class="kch-ready-grid">${list.map(p=>`<button type="button" class="kch-ready-card" data-kch-product="${esc(p.slug)}"><span class="kch-ready-media"><img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" decoding="async"></span><span class="kch-ready-copy"><b>${esc(p.name)}</b><small>${M(p.price)}</small><em><span class="material-symbols-rounded">inventory_2</span>พร้อมสั่งซื้อ</em></span></button>`).join('')}</div>`;hero.insertAdjacentElement('afterend',el);el.querySelectorAll('[data-kch-product]').forEach(b=>b.onclick=()=>{const p=productBySlug(b.dataset.kchProduct);if(p&&typeof product==='function')product(p)});el.querySelector('[data-kch-all]')?.addEventListener('click',()=>document.getElementById('recommend')?.scrollIntoView({behavior:'smooth'}));S.shelfKey=key}
function fastCart(){const qty=typeof count==='function'?Number(count()||0):0,amount=typeof subtotal==='function'?Number(subtotal()||0):0,page=typeof current==='undefined'?'':String(current),show=qty>0&&!['cart','checkout','orders','account'].includes(page),key=`${page}:${qty}:${amount}`;let el=document.querySelector('.kch-fast-cart');if(!show){el?.remove();S.cartKey=key;return}if(el&&S.cartKey===key)return;el?.remove();el=document.createElement('aside');el.className='kch-fast-cart';el.innerHTML=`<button type="button" class="kch-fast-cart-summary" data-kch-cart><span class="material-symbols-rounded">shopping_bag</span><span><b>${qty} รายการ</b><small>ยอดสินค้า ${M(amount)}</small></span></button><button type="button" class="kch-fast-cart-checkout" data-kch-checkout>ไปชำระเงิน</button>`;document.body.appendChild(el);el.querySelector('[data-kch-cart]').onclick=()=>typeof cartPage==='function'&&cartPage();el.querySelector('[data-kch-checkout]').onclick=()=>typeof checkout==='function'&&checkout();S.cartKey=key}
function draft(){if(typeof current==='undefined'||current!=='checkout')return;let data={};try{data=JSON.parse(sessionStorage.getItem(DRAFT)||'{}')||{}}catch{}const map={name:'#customer-name',phone:'#customer-phone',address:'#customer-address',district:'#customer-district',province:'#customer-province',postal:'#customer-postal',marketing:'#marketing-consent'},nodes=Object.fromEntries(Object.entries(map).map(([k,s])=>[k,document.querySelector(s)]));Object.entries(nodes).forEach(([k,e])=>{if(!e)return;if(e.type==='checkbox'){if(typeof data[k]==='boolean')e.checked=data[k]}else if(!e.value&&data[k])e.value=String(data[k])});const saveDraft=()=>{const v={};Object.entries(nodes).forEach(([k,e])=>{if(e)v[k]=e.type==='checkbox'?Boolean(e.checked):String(e.value||'').trim()});try{sessionStorage.setItem(DRAFT,JSON.stringify(v))}catch{}};Object.values(nodes).filter(Boolean).forEach(e=>{if(e.dataset.kchDraft)return;e.dataset.kchDraft='1';e.addEventListener('input',saveDraft);e.addEventListener('change',saveDraft);e.addEventListener('blur',()=>validate(e))})}
function validate(e){let ok=true;if(e.id==='customer-name')ok=e.value.trim().length>=2;if(e.id==='customer-phone')ok=e.value.replace(/\D/g,'').length>=9;if(e.id==='customer-address')ok=e.value.trim().length>=5;if(e.id==='customer-district'||e.id==='customer-province')ok=e.value.trim().length>=2;if(e.id==='customer-postal')ok=/^[0-9]{5}$/.test(e.value.trim());e.setAttribute('aria-invalid',ok?'false':'true')}
function checkoutEnhance(){if(typeof current==='undefined'||current!=='checkout')return;const page=document.querySelector('main.page');if(!page)return;if(!page.querySelector('.kch-checkout-progress')){const p=document.createElement('section');p.className='kch-checkout-progress';p.innerHTML='<div class="active"><i>1</i><span><b>ข้อมูลจัดส่ง</b><small>กรอกที่อยู่ผู้รับ</small></span></div><div class="active"><i>2</i><span><b>ชำระเงิน</b><small>เลือกวิธีชำระ</small></span></div><div><i>3</i><span><b>ยืนยันคำสั่งซื้อ</b><small>ตรวจยอดก่อนสั่ง</small></span></div>';page.querySelector('.page-title')?.insertAdjacentElement('afterend',p)}const payment=document.querySelector('.payment');if(payment&&!payment.querySelector('.kch-cod-note')){const n=document.createElement('div');n.className='kch-cod-note';n.innerHTML='<span class="material-symbols-rounded">verified_user</span><span><b>สั่งซื้อได้โดยไม่ต้องสมัครสมาชิก</b><small>ระบบตรวจราคา สต็อก และยอดรวมอีกครั้งก่อนสร้างคำสั่งซื้อ</small></span>';payment.appendChild(n)}const place=document.querySelector('[data-place]');if(place){let n=page.querySelector('.kch-system-note');if(!n){n=document.createElement('div');n.className='kch-system-note pending';place.insertAdjacentElement('beforebegin',n)}if(!S.healthKnown){place.disabled=true;n.className='kch-system-note pending';n.textContent='กำลังตรวจสอบระบบรับคำสั่งซื้อ…'}else if(S.health?.d1){if(place.dataset.kchHealthDisabled==='1'||place.textContent!=='กำลังยืนยันราคาและสร้างคำสั่งซื้อ...')place.disabled=false;place.dataset.kchHealthDisabled='0';n.className='kch-system-note ready';n.textContent='ระบบรับคำสั่งซื้อพร้อมใช้งาน'}else{place.disabled=true;place.dataset.kchHealthDisabled='1';n.className='kch-system-note pending';n.textContent='ระบบรับคำสั่งซื้อออนไลน์ยังไม่พร้อม'}}draft()}
function hint(){if(typeof current==='undefined'||current!=='product'||document.querySelector('.kch-buy-hint')||typeof selected==='undefined'||!ready(selected))return;const bar=document.querySelector('.pdp-bottom,.buybar');if(!bar)return;const n=document.createElement('div');n.className='kch-buy-hint';n.innerHTML='<span class="material-symbols-rounded">bolt</span><span><b>ซื้อได้ในไม่กี่ขั้นตอน</b><small>กด “ซื้อเลย” เพื่อไป Checkout หรือเพิ่มลงตะกร้าเพื่อซื้อหลายรายการ</small></span>';bar.insertAdjacentElement('beforebegin',n)}
function status(){if(typeof current==='undefined'||current!=='home'||!S.healthKnown||!S.health?.d1||document.querySelector('.kch-launch-status'))return;const hero=document.querySelector('.tshop-hero');if(!hero)return;const n=document.createElement('div');n.className='kch-launch-status';n.innerHTML='<span class="material-symbols-rounded">check_circle</span><b>ระบบสั่งซื้อออนไลน์พร้อมใช้งาน</b><small>เลือกสินค้า → ชำระเงิน → ติดตามคำสั่งซื้อ</small>';hero.insertAdjacentElement('beforebegin',n)}
function run(){if(S.frame)return;S.frame=requestAnimationFrame(()=>{S.frame=0;if(sanitizeCart())return;launchSafety();shelf();fastCart();checkoutEnhance();hint();status()})}
async function health(){try{const r=await fetch('/api/health',{cache:'no-store',headers:{Accept:'application/json'}});S.health=r.ok?await r.json().catch(()=>null):null}catch{S.health=null}S.healthKnown=true;run()}
new MutationObserver(run).observe(document.getElementById('app'),{childList:true,subtree:true,characterData:true});document.addEventListener('click',e=>{if(e.target.closest?.('[data-add],[data-buy],[data-go]'))setTimeout(run,0)},true);window.addEventListener('load',health,{once:true});run();
})();
</script>
</body>
</html>
