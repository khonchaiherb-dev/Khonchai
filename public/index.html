<script id="kch-product-detail-upgrade">
(()=>{
const HOME={title:'คุณชายสมุนไพร | KHONCHAIHERB สมุนไพรไทย',description:'คุณชายสมุนไพร (KHONCHAIHERB) ร้านสมุนไพรไทย เลือกซื้อสินค้า ดูข้อเสนอ รีวิว บัญชีสมาชิก และติดตามคำสั่งซื้อได้ในที่เดียว',ogTitle:'คุณชายสมุนไพร | KHONCHAIHERB',ogDescription:'เลือกซื้อสมุนไพรไทยจากคุณชายสมุนไพร พร้อมข้อมูลสินค้า ข้อเสนอ และการติดตามคำสั่งซื้อ'};

function meta(selector,attr,value){let el=document.head.querySelector(selector);if(!el){el=document.createElement('meta');const m=selector.match(/meta\[(name|property)="([^"]+)"\]/);if(!m)return;el.setAttribute(m[1],m[2]);document.head.appendChild(el)}el.setAttribute(attr,value)}
function productSchema(p){const schema={'@context':'https://schema.org','@type':'Product',name:String(p.name||''),description:String(p.desc||''),sku:String(p.sku||''),brand:{'@type':'Brand',name:'คุณชายสมุนไพร',alternateName:'KHONCHAIHERB'}};if(p.image)schema.image=[new URL(p.image,location.origin).href];const price=Number(p.price||0);if(price>0&&!p.comingSoon)schema.offers={'@type':'Offer',priceCurrency:'THB',price:String(price),availability:Number(p.stock||0)>0?'https://schema.org/InStock':'https://schema.org/OutOfStock',url:location.href};return schema}
function setProductSEO(p){const title=`${p.name} | คุณชายสมุนไพร KHONCHAIHERB`,description=String(p.desc||p.name||'').slice(0,155);document.title=title;meta('meta[name="description"]','content',description);meta('meta[property="og:title"]','content',title);meta('meta[property="og:description"]','content',description);meta('meta[property="og:type"]','content','product');if(p.image)meta('meta[property="og:image"]','content',new URL(p.image,location.origin).href);let script=document.getElementById('kch-product-structured-data');if(!script){script=document.createElement('script');script.id='kch-product-structured-data';script.type='application/ld+json';document.head.appendChild(script)}script.textContent=JSON.stringify(productSchema(p))}
function restoreHomeSEO(){document.title=HOME.title;meta('meta[name="description"]','content',HOME.description);meta('meta[property="og:title"]','content',HOME.ogTitle);meta('meta[property="og:description"]','content',HOME.ogDescription);meta('meta[property="og:type"]','content','website');document.querySelector('meta[property="og:image"]')?.remove();document.getElementById('kch-product-structured-data')?.remove();lastKey='home'}
function assurance(){const el=document.createElement('section');el.className='kch-pdp-assurance';el.setAttribute('aria-label','ความมั่นใจก่อนสั่งซื้อ');el.innerHTML='<div><span class="material-symbols-rounded">verified</span><span><b>ร้านทางการ</b><small>ข้อมูลสินค้าและคำสั่งซื้อชัดเจน</small></span></div><div><span class="material-symbols-rounded">payments</span><span><b>รองรับ COD</b><small>เมื่อรายการเข้าเงื่อนไข</small></span></div><div><span class="material-symbols-rounded">local_shipping</span><span><b>ติดตามได้</b><small>ตรวจสถานะคำสั่งซื้อได้</small></span></div><div><span class="material-symbols-rounded">receipt_long</span><span><b>ออกใบเสร็จ</b><small>หลังยืนยันการรับชำระ</small></span></div>';return el}
function enhance(){if(typeof current==='undefined')return;if(current!=='product'){if(lastKey!=='home')restoreHomeSEO();return}if(typeof selected==='undefined'||!selected)return;const pdp=document.querySelector('.tshop-pdp');if(!pdp)return;pdp.classList.add('kch-pdp-20');const ready=Number(selected.price||0)>0&&!selected.comingSoon;if(!ready){pdp.classList.add('kch-coming-soon');const price=pdp.querySelector('.pdp-price');if(price)price.innerHTML='<b>ราคาเร็ว ๆ นี้</b>';const add=pdp.querySelector('[data-add]'),buy=pdp.querySelector('[data-buy]');if(add){add.disabled=true;add.textContent='เตรียมจำหน่าย'}if(buy){buy.disabled=true;buy.textContent='อยู่ระหว่างเตรียมจำหน่าย'}}const block=pdp.querySelector('.pdp-price-block');if(block&&!block.querySelector('.kch-pdp-assurance'))block.appendChild(assurance());const key=`${selected.slug}:${selected.price}:${selected.stock}:${selected.image}`;if(key!==lastKey){setProductSEO(selected);lastKey=key}}
function schedule(){if(frame)return;frame=requestAnimationFrame(()=>{frame=0;enhance()})}
new MutationObserver(schedule).observe(document.getElementById('app'),{childList:true,subtree:true});window.addEventListener('popstate',schedule);window.addEventListener('load',schedule,{once:true});schedule();
})();
