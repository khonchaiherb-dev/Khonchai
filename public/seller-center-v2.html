<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#082c22">
<title>KHONCHAIHERB | ศูนย์บริหารร้านค้า</title>
<style>
:root{--deep:#082c22;--deep2:#0d3c2e;--leaf:#286449;--gold:#c7a75f;--paper:#fffdfa;--bg:#eef1ed;--ink:#17382b;--muted:#6f7d75;--line:#e3ded4;--ok:#26754d;--warn:#9d681b;--danger:#a23f36;--blue:#315e82;--shadow:0 16px 42px rgba(15,44,34,.09)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#1c6048 0,#0b3428 40%,#061d17 100%)}.authcard{width:min(440px,100%);padding:34px;border:1px solid rgba(225,200,137,.26);border-radius:26px;background:rgba(255,253,249,.98);box-shadow:0 28px 80px rgba(0,0,0,.28)}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:var(--deep);color:var(--gold);font:800 24px Georgia,serif}.brand b{display:block;font-size:18px;letter-spacing:.07em}.brand small{display:block;color:var(--muted);font-size:11px}.authcard .brand{margin-bottom:24px}.authcard h1{margin:0;font-size:27px}.authcard>p{margin:7px 0 22px;color:var(--muted)}.field{display:grid;gap:6px;margin:13px 0}.field span{font-size:12px;font-weight:800}.field input,.field select{min-height:48px;width:100%;padding:10px 12px;border:1px solid #d7ddd8;border-radius:12px;background:white;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#6b957f;box-shadow:0 0 0 3px rgba(40,100,73,.10)}.error{min-height:22px;color:var(--danger);font-size:12px}.primary,.soft,.danger{min-height:40px;padding:8px 12px;border:1px solid transparent;border-radius:10px;font-weight:800}.primary{background:var(--deep);color:#fff}.soft{background:#f1f5f1;border-color:#d8e1db;color:var(--deep)}.danger{background:#fff0ed;border-color:#edcec8;color:var(--danger)}.authcard .primary{width:100%;min-height:50px}
.portal{min-height:100vh;display:grid;grid-template-columns:264px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;padding:20px 14px;background:linear-gradient(180deg,#092f24,#07251d);color:white;overflow:auto}.sidebrand{padding:6px 8px 20px;border-bottom:1px solid rgba(255,255,255,.1)}.sidebrand .mark{background:rgba(255,255,255,.08);color:#e4c777}.sidebrand small{color:#9cb4a8}.nav{display:grid;gap:5px;margin-top:17px}.nav button{display:flex;align-items:center;gap:11px;min-height:45px;padding:9px 11px;border:0;border-radius:11px;background:transparent;color:#cad8d1;text-align:left;font-weight:750}.nav button:hover,.nav button.active{background:rgba(255,255,255,.09);color:white}.ico{width:25px;text-align:center;font-size:17px}.sidefoot{margin-top:22px;padding:14px 10px;border-top:1px solid rgba(255,255,255,.1);color:#9fb5aa;font-size:11px}.sidefoot b{display:block;color:white;font-size:12px}.workspace{min-width:0}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;min-height:72px;padding:11px 26px;border-bottom:1px solid #dedfd8;background:rgba(247,248,243,.95);backdrop-filter:blur(14px)}.mobilemenu{display:none;width:42px;height:42px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--deep)}.topcopy b{display:block;font-size:18px}.topcopy small{display:block;color:var(--muted);font-size:11px}.topspacer{flex:1}.identity{display:flex;align-items:center;gap:9px}.avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#dfeae3;color:var(--deep);font-weight:900}.identity b,.identity small{display:block}.identity small{color:var(--muted);font-size:10px}.main{max-width:1540px;margin:auto;padding:25px 28px 60px}.pagehead{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:17px}.pagehead h1{margin:0;font-size:29px;line-height:1.2}.pagehead p{margin:6px 0 0;color:var(--muted)}.pageactions{display:flex;gap:8px;flex-wrap:wrap}.statusline{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px}.metric{min-width:0;padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:var(--shadow)}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{display:block;margin-top:5px;font-size:22px;line-height:1.25}.metric small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:13px;margin-top:13px}.panel{min-width:0;margin-top:13px;border:1px solid var(--line);border-radius:17px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden}.grid2 .panel{margin-top:0}.panelhead{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid #ebe7de}.panelhead h2{margin:0;font-size:16px}.panelhead p{margin:3px 0 0;color:var(--muted);font-size:11px}.panelhead .right{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px 12px;border-bottom:1px solid #eee9df;text-align:left;vertical-align:middle}th{position:sticky;top:0;background:#faf8f3;color:#738078;font-size:10px;text-transform:uppercase;letter-spacing:.04em}td{font-size:12px}.money{font-weight:850;font-variant-numeric:tabular-nums}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#eef1ee;color:#617068;font-size:10px;font-weight:850}.pill.ok{background:#e8f5ed;color:var(--ok)}.pill.warn{background:#fff3df;color:var(--warn)}.pill.bad{background:#fff0ed;color:var(--danger)}.pill.blue{background:#edf4fa;color:var(--blue)}.empty{padding:31px;text-align:center;color:var(--muted)}.queue{display:grid;gap:8px;padding:13px}.queueitem{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #e3e7e2;border-radius:11px;background:#fbfcfa}.queueitem strong{display:grid;place-items:center;min-width:34px;height:34px;border-radius:9px;background:#edf3ee}.queueitem.critical strong{background:#fff0ed;color:var(--danger)}.queueitem span{font-size:12px}.healthgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:13px}.health{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid #e5e7e2;border-radius:11px;background:#fbfcfa}.health span{font-size:11px}.dot{width:9px;height:9px;border-radius:50%;background:#c7cec9}.dot.ok{background:#3d9968}.dot.bad{background:#c45b52}.notice{margin:13px;padding:11px;border:1px solid #e4dccb;border-radius:11px;background:#fffaf0;color:#775d2c;font-size:11px}.formrow{display:grid;grid-template-columns:1fr 130px 2fr auto;gap:8px;align-items:end;padding:13px;border-bottom:1px solid #ebe6dc}.formrow input,.formrow select{min-height:39px;padding:8px 10px;border:1px solid #d9ddd8;border-radius:9px;background:white}.formrow label{display:grid;gap:4px;color:#66756d;font-size:10px;font-weight:800}.sessionlist{display:grid;gap:8px;padding:13px}.session{display:flex;align-items:center;gap:11px;padding:10px;border:1px solid #e4e7e3;border-radius:11px}.session .device{flex:1}.session b,.session small{display:block}.session small{color:var(--muted);font-size:10px}.alertcards{display:grid;gap:10px;padding:13px}.alertcard{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:12px;padding:13px;border:1px solid #e4e4dc;border-radius:13px;background:#fff}.alertbar{border-radius:999px;background:#c7cec9}.alertcard.critical .alertbar{background:var(--danger)}.alertcard.warning .alertbar{background:#d19a38}.alerttitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.alerttitle b{font-size:13px}.alertmeta{margin-top:5px;color:var(--muted);font-size:11px}.alertactions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}.alertactions select{min-height:38px;max-width:180px;padding:7px 8px;border:1px solid #d7ddd8;border-radius:9px;background:white}.approval-actions{display:flex;gap:6px;flex-wrap:wrap}.loading{display:grid;place-items:center;min-height:250px;color:var(--muted)}.spinner{width:28px;height:28px;margin-bottom:9px;border:3px solid #dce4de;border-top-color:var(--leaf);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;z-index:100;right:20px;bottom:20px;max-width:min(430px,calc(100% - 40px));padding:12px 14px;border-radius:11px;background:#143d2f;color:#fff;box-shadow:0 15px 44px rgba(0,0,0,.22);font-size:12px}.toast.bad{background:#84362f}
@media(max-width:1200px){.metrics{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.formrow{grid-template-columns:1fr 1fr}.formrow button{align-self:end}.alertcard{grid-template-columns:8px 1fr}.alertactions{grid-column:2;justify-content:flex-start}}
@media(max-width:820px){.portal{grid-template-columns:1fr}.sidebar{position:fixed;z-index:50;left:0;top:0;width:270px;transform:translateX(-105%);transition:transform .2s ease}.sidebar.open{transform:translateX(0)}.mobilemenu{display:block}.topbar{padding:10px 13px}.identity span:last-child{display:none}.main{padding:19px 13px 50px}.pagehead{align-items:flex-start;flex-direction:column}.metrics{grid-template-columns:repeat(2,1fr)}.metric b{font-size:19px}.healthgrid{grid-template-columns:1fr}.formrow{grid-template-columns:1fr}.topcopy small{display:none}.alertactions select{max-width:100%;width:100%}}
</style>
</head>
<body>
<section id="auth" class="auth">
  <form id="loginForm" class="authcard" autocomplete="on">
    <div class="brand"><span class="mark">K</span><span><b>KHONCHAIHERB</b><small>ศูนย์บริหารร้านค้า</small></span></div>
    <h1>เข้าสู่ระบบพนักงาน</h1>
    <p>ใช้บัญชีพนักงานของคุณเพื่อเข้าถึงข้อมูลตามสิทธิ์ที่ได้รับ</p>
    <label class="field"><span>ชื่อผู้ใช้</span><input id="username" autocomplete="username" required minlength="3"></label>
    <label class="field"><span>รหัสผ่าน</span><input id="password" type="password" autocomplete="current-password" required></label>
    <div id="loginError" class="error" role="alert"></div>
    <button id="loginButton" class="primary" type="submit">เข้าสู่ศูนย์บริหารร้านค้า</button>
  </form>
</section>
<section id="portal" class="portal hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand sidebrand"><span class="mark">K</span><span><b>KHONCHAIHERB</b><small>ศูนย์บริหารร้านค้า</small></span></div>
    <nav id="nav" class="nav"></nav>
    <div class="sidefoot"><b id="sideUser">—</b><span id="sideRole">—</span></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <button id="mobileMenu" class="mobilemenu" type="button" aria-label="เปิดเมนู">☰</button>
      <div class="topcopy"><b id="viewTitle">ภาพรวมร้านค้า</b><small id="sessionText">กำลังตรวจสอบเซสชัน</small></div>
      <div class="topspacer"></div>
      <div class="identity"><span id="avatar" class="avatar">K</span><span><b id="topUser">—</b><small id="topRole">—</small></span></div>
      <button id="logout" class="soft" type="button">ออกจากระบบ</button>
    </header>
    <main id="main" class="main"></main>
  </div>
</section>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const state={staff:null,csrfToken:'',view:'dashboard',cache:{}};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:0}).format(Number(n||0));
const integer=n=>new Intl.NumberFormat('th-TH').format(Number(n||0));
const dateTime=v=>v?new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short'}).format(new Date(String(v).replace(' ','T')+(String(v).includes('Z')?'':'Z'))):'—';
const can=p=>Boolean(state.staff?.permissions?.includes('*')||state.staff?.permissions?.includes(p));
const canManageAlerts=()=>['owner','admin','operations','warehouse','finance'].includes(String(state.staff?.role||''));
const unsafe=m=>!['GET','HEAD','OPTIONS'].includes(String(m||'GET').toUpperCase());
const parseJson=v=>{try{return JSON.parse(v||'{}')}catch{return {}}};
function toast(text,bad=false){const el=$('#toast');el.textContent=text;el.className=`toast${bad?' bad':''}`;clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3600)}
function roleLabel(role){return ({owner:'เจ้าของระบบ',admin:'ผู้ดูแลระบบ',operations:'ฝ่ายปฏิบัติการ',warehouse:'คลังสินค้า',finance:'ฝ่ายการเงิน',support:'ฝ่ายบริการลูกค้า',viewer:'ผู้ดูข้อมูล'})[role]||role||'—'}
function pill(text,type=''){return `<span class="pill ${type}">${esc(text)}</span>`}
function metric(label,value,sub=''){return `<article class="metric"><span>${esc(label)}</span><b>${esc(value)}</b>${sub?`<small>${esc(sub)}</small>`:''}</article>`}
function loading(){return '<div class="loading"><div><div class="spinner"></div>กำลังโหลดข้อมูล...</div></div>'}
function showLogin(message=''){$('#portal').classList.add('hidden');$('#auth').classList.remove('hidden');$('#loginError').textContent=message;state.staff=null;state.csrfToken=''}
function showPortal(){$('#auth').classList.add('hidden');$('#portal').classList.remove('hidden')}
async function request(path,options={}){const method=String(options.method||'GET').toUpperCase(),headers={Accept:'application/json',...(options.headers||{})};if(options.body)headers['Content-Type']='application/json';if(unsafe(method)&&state.csrfToken)headers['X-KCH-CSRF']=state.csrfToken;const r=await fetch(path,{...options,method,headers,credentials:'same-origin',cache:method==='GET'?'no-store':undefined});const data=await r.json().catch(()=>({}));if(r.status===401){showLogin('เซสชันหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง');throw Object.assign(new Error('staff_auth_required'),{status:401,data})}if(!r.ok)throw Object.assign(new Error(data.error||`HTTP ${r.status}`),{status:r.status,data});return data}
async function refreshSession(){const r=await fetch('/api/staff/me',{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok){showLogin();return false}const d=await r.json();state.staff=d.staff;state.csrfToken=d.csrfToken||'';updateIdentity();return true}
function updateIdentity(){const s=state.staff||{},name=s.displayName||s.username||'พนักงาน';$('#topUser').textContent=name;$('#sideUser').textContent=name;$('#topRole').textContent=roleLabel(s.role);$('#sideRole').textContent=roleLabel(s.role);$('#avatar').textContent=String(name).trim().charAt(0).toUpperCase()||'K';$('#sessionText').textContent=s.expiresAt?`เซสชันถึง ${dateTime(s.expiresAt)}`:'เข้าสู่ระบบแล้ว';buildNav()}
const navItems=[
 ['dashboard','⌂','ภาพรวมร้านค้า',()=>can('analytics.read')||can('*')],
 ['orders','▤','คำสั่งซื้อ',()=>can('orders.read')],
 ['inventory','◫','สินค้าและสต็อก',()=>can('inventory.read')],
 ['finance','฿','การเงินและ COD',()=>can('finance.read')],
 ['alerts','!','ศูนย์แจ้งเตือน',()=>can('orders.read')],
 ['approvals','✓','ศูนย์อนุมัติ',()=>can('approvals.manage')],
 ['operations','⚙','ปฏิบัติการ',()=>can('analytics.read')],
 ['security','◇','ความปลอดภัย',()=>can('audit.read')],
 ['team','♙','พนักงานและสิทธิ์',()=>can('staff.read')],
 ['continuity','⟳','สำรองและความต่อเนื่อง',()=>can('backup.manage')]
];
function buildNav(){const visible=navItems.filter(x=>x[3]());if(!visible.some(x=>x[0]===state.view))state.view=visible[0]?.[0]||'orders';$('#nav').innerHTML=visible.map(x=>`<button type="button" class="${x[0]===state.view?'active':''}" data-view="${x[0]}"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('')}
function titleFor(view){return navItems.find(x=>x[0]===view)?.[2]||'ศูนย์บริหารร้านค้า'}
async function cached(key,loader,force=false){if(!force&&state.cache[key]&&Date.now()-state.cache[key].at<30000)return state.cache[key].data;const data=await loader();state.cache[key]={at:Date.now(),data};return data}
async function openView(view,force=false){state.view=view;buildNav();view=state.view;$('#viewTitle').textContent=titleFor(view);$('#sidebar').classList.remove('open');$('#main').innerHTML=loading();try{if(view==='dashboard')await renderDashboard(force);else if(view==='orders')await renderOrders(force);else if(view==='inventory')await renderInventory(force);else if(view==='finance')await renderFinance(force);else if(view==='alerts')await renderAlerts(force);else if(view==='approvals')await renderApprovals(force);else if(view==='operations')await renderOperations(force);else if(view==='security')await renderSecurity(force);else if(view==='team')await renderTeam(force);else if(view==='continuity')await renderContinuity(force)}catch(e){if(e.status!==401)$('#main').innerHTML=`<div class="panel"><div class="empty">โหลดข้อมูลไม่สำเร็จ: ${esc(e.data?.error||e.message)}</div></div>`}}
async function renderDashboard(force=false){const [c,ops,alerts]=await Promise.all([cached('center',()=>request('/api/admin/commerce-command-center'),force),cached('ops',()=>request('/api/admin/ops-monitoring'),force).catch(()=>null),cached('alerts',()=>request('/api/admin/operational-alerts'),force).catch(()=>null)]);const k=ops?.kpi||{},a=alerts?.counts||{};$('#main').innerHTML=`<div class="pagehead"><div><h1>ภาพรวมร้านค้า</h1><p>ยอดขาย กำไร คำสั่งซื้อ COD และงานสำคัญที่ต้องติดตาม</p></div><div class="pageactions"><button class="soft" data-refresh>รีเฟรชข้อมูล</button></div></div><div class="statusline">${pill(`สิทธิ์: ${roleLabel(state.staff.role)}`,'blue')}${alerts?pill(`แจ้งเตือนที่เปิดอยู่ ${integer(a.active)}`,Number(a.critical)?'bad':'ok'):''}</div><section class="metrics">${metric('ยอดขาย 30 วัน',money(c.sales30d?.gross),`${integer(c.sales30d?.orders)} ออเดอร์`)}${metric('กำไรขั้นต้น 30 วัน',money(c.profit30d?.grossProfit),`Margin ${Number(c.profit30d?.marginPct||0).toFixed(1)}%`)}${metric('มูลค่าต่อออเดอร์',money(c.sales30d?.aov),'AOV')}${metric('COD รับแล้ว',money(c.cod?.netCollected),`${integer(c.cod?.exceptions)} รายการผิดปกติ`)}${metric('แจ้งเตือนวิกฤต',integer(a.critical||0),`${integer(a.unassigned||0)} รายการยังไม่มีผู้รับผิดชอบ`)}${metric('รออนุมัติ',integer(k.approvals_pending||0),'รายการความเสี่ยงสูง')}</section><div class="grid2"><section class="panel"><div class="panelhead"><div><h2>งานที่ควรจัดการก่อน</h2><p>เรียงจากความเสี่ยงของออเดอร์ การเงิน และคลัง</p></div><div class="right"><button class="soft" data-view-jump="alerts">เปิดศูนย์แจ้งเตือน</button></div></div><div class="queue"><div class="queueitem ${Number(a.critical)?'critical':''}"><strong>${integer(a.critical||0)}</strong><span>แจ้งเตือนระดับวิกฤต</span></div><div class="queueitem"><strong>${integer(k.stale_fulfillment||0)}</strong><span>ออเดอร์ค้างจัดเตรียมเกิน 24 ชั่วโมง</span></div><div class="queueitem ${Number(k.cod_exceptions||0)?'critical':''}"><strong>${integer(k.cod_exceptions||0)}</strong><span>COD ต้องตรวจสอบ</span></div><div class="queueitem"><strong>${integer(k.expiring_30d_units||0)}</strong><span>หน่วยสินค้าที่ใกล้หมดอายุภายใน 30 วัน</span></div></div></section><section class="panel"><div class="panelhead"><div><h2>การอนุมัติและคิวปฏิบัติการ</h2></div>${can('approvals.manage')?'<div class="right"><button class="soft" data-view-jump="approvals">เปิดศูนย์อนุมัติ</button></div>':''}</div><div class="queue"><div class="queueitem"><strong>${integer(k.approvals_pending||0)}</strong><span>รายการรออนุมัติ</span></div><div class="queueitem"><strong>${integer(k.open_fulfillment||0)}</strong><span>ออเดอร์รอจัดเตรียม/แพ็ก</span></div><div class="queueitem"><strong>${integer(k.open_returns||0)}</strong><span>คำขอคืนสินค้าที่ยังเปิดอยู่</span></div><div class="queueitem"><strong>${integer(k.low_stock_products||0)}</strong><span>สินค้าใกล้หมด</span></div></div></section></div>`}

async function renderTeam(force=false){const d=await cached('staff',()=>request('/api/admin/staff'),force),rows=d.staff||[];$('#main').innerHTML=`<div class="pagehead"><div><h1>พนักงานและสิทธิ์</h1><p>ดูบัญชี บทบาท สถานะ และจำนวนเซสชันที่กำลังใช้งาน</p></div><div class="pageactions"><button class="soft" data-refresh>รีเฟรชข้อมูล</button></div></div><section class="panel"><div class="panelhead"><div><h2>บัญชีพนักงาน</h2></div></div><div class="tablewrap"><table><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อแสดง</th><th>บทบาท</th><th>สถานะ</th><th>เซสชัน</th><th>เข้าสู่ระบบล่าสุด</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td><b>${esc(r.username)}</b></td><td>${esc(r.display_name)}</td><td>${pill(roleLabel(r.role),'blue')}</td><td>${pill(Number(r.active)?'ใช้งาน':'ปิดใช้งาน',Number(r.active)?'ok':'bad')}</td><td>${integer(r.active_sessions)}</td><td>${dateTime(r.last_login_at)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">ยังไม่มีบัญชีพนักงาน</td></tr>'}</tbody></table></div></section>`}
async function renderContinuity(force=false){const d=await cached('backup',()=>request('/api/admin/backup'),force),snapshots=d.snapshots||[],integrity=d.integrity||[],maintenance=d.maintenance||[];$('#main').innerHTML=`<div class="pagehead"><div><h1>สำรองและความต่อเนื่อง</h1><p>ตรวจความสมบูรณ์ของข้อมูลและหลักฐานความพร้อมในการกู้คืน</p></div><div class="pageactions"><button class="soft" data-integrity>ตรวจความสมบูรณ์</button><button class="soft" data-manifest>สร้าง Backup Manifest</button><button class="soft" data-refresh>รีเฟรชข้อมูล</button></div></div><div class="notice">Backup Manifest เป็นข้อมูลกำกับและจำนวนระเบียน ไม่ใช่สำเนาข้อมูลลูกค้า การกู้คืนจริงใช้กระบวนการสำรอง/กู้คืนของ Cloudflare D1</div><div class="grid2"><section class="panel"><div class="panelhead"><div><h2>Integrity Scan</h2></div></div><div class="tablewrap"><table><thead><tr><th>เวลา</th><th>สถานะ</th><th>คะแนน</th><th>ผิดปกติ</th><th>ผู้ดำเนินการ</th></tr></thead><tbody>${integrity.length?integrity.map(r=>`<tr><td>${dateTime(r.created_at)}</td><td>${pill(r.status,r.status==='ok'?'ok':'warn')}</td><td>${esc(r.score)}</td><td>${integer(r.anomalies_count)}</td><td>${esc(r.created_by||'—')}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">ยังไม่มีผลตรวจ</td></tr>'}</tbody></table></div></section><section class="panel"><div class="panelhead"><div><h2>Backup Manifest</h2></div></div><div class="tablewrap"><table><thead><tr><th>เวลา</th><th>เลขที่</th><th>Schema</th><th>สถานะ</th></tr></thead><tbody>${snapshots.length?snapshots.map(r=>`<tr><td>${dateTime(r.created_at)}</td><td>${esc(r.snapshot_no)}</td><td>${esc(r.schema_version)}</td><td>${pill(r.status,r.status==='verified'?'ok':'warn')}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">ยังไม่มี manifest</td></tr>'}</tbody></table></div></section></div>${maintenance.length?`<section class="panel"><div class="panelhead"><div><h2>Maintenance ล่าสุด</h2></div></div><div class="tablewrap"><table><thead><tr><th>เวลา</th><th>งาน</th><th>สถานะ</th><th>จำนวนที่กระทบ</th><th>ผู้ดำเนินการ</th></tr></thead><tbody>${maintenance.map(r=>`<tr><td>${dateTime(r.created_at)}</td><td>${esc(r.job_key)}</td><td>${pill(r.status,r.status==='completed'?'ok':'warn')}</td><td>${integer(r.affected_rows)}</td><td>${esc(r.run_by||'—')}</td></tr>`).join('')}</tbody></table></div></section>`:''}`}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const username=$('#username').value.trim(),password=$('#password').value,btn=$('#loginButton');$('#loginError').textContent='';btn.disabled=true;btn.textContent='กำลังเข้าสู่ระบบ...';try{const r=await fetch('/api/staff/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({username,password})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'login_failed'),{status:r.status,data:d});await refreshSession();showPortal();await openView(state.view,true);$('#password').value=''}catch(err){$('#loginError').textContent=err.status===423?'บัญชีถูกล็อกชั่วคราวจากการเข้าสู่ระบบไม่สำเร็จหลายครั้ง':err.status===401?'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง':'เข้าสู่ระบบไม่สำเร็จ กรุณาลองใหม่'}finally{btn.disabled=false;btn.textContent='เข้าสู่ศูนย์บริหารร้านค้า'}});
$('#logout').addEventListener('click',async()=>{try{await fetch('/api/staff/logout',{method:'POST',credentials:'same-origin',headers:{Accept:'application/json'}})}catch{}state.cache={};showLogin();toast('ออกจากระบบแล้ว')});
$('#mobileMenu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)openView(b.dataset.view)});
$('#main').addEventListener('click',async e=>{
 const jump=e.target.closest('[data-view-jump]');if(jump)return openView(jump.dataset.viewJump,true);
 if(e.target.closest('[data-refresh]'))return openView(state.view,true);
 const alertButton=e.target.closest('[data-alert-action]');if(alertButton){if(!canManageAlerts()){toast('บัญชีนี้มีสิทธิ์อ่านรายการเท่านั้น',true);return}const action=alertButton.dataset.alertAction,key=alertButton.dataset.alertKey;let assignedTo=null,note='';if(action==='assign'){const select=$(`[data-alert-assignee="${CSS.escape(key)}"]`);assignedTo=select?.value?Number(select.value):Number(state.staff?.id);if(!assignedTo){toast('กรุณาเลือกผู้รับผิดชอบ',true);return}}if(action==='resolve'){if(!confirm('ยืนยันว่ารายการนี้ตรวจสอบและดำเนินการแล้ว?'))return;note=prompt('หมายเหตุการปิดงาน (ไม่บังคับ)','')||''}if(action==='reopen'&&!confirm('เปิดรายการนี้กลับมาดำเนินการอีกครั้ง?'))return;try{await request('/api/admin/operational-alerts',{method:'POST',body:JSON.stringify({action,alertKey:key,assignedTo,note})});state.cache.alerts=null;toast(action==='resolve'?'ปิดงานแล้ว':action==='assign'?'มอบหมายงานแล้ว':action==='reopen'?'เปิดงานอีกครั้งแล้ว':'รับทราบรายการแล้ว');openView('alerts',true)}catch(err){toast(`ดำเนินการไม่สำเร็จ: ${err.data?.error||err.message}`,true)}return}
 const approval=e.target.closest('[data-approval-decision]');if(approval){const decision=approval.dataset.approvalDecision,id=Number(approval.dataset.approvalId);if(decision==='approved'&&!confirm('ยืนยันอนุมัติรายการนี้?'))return;const note=decision==='rejected'?(prompt('ระบุเหตุผลที่ปฏิเสธ','')||''):'';if(decision==='rejected'&&!note.trim()){toast('กรุณาระบุเหตุผลที่ปฏิเสธ',true);return}try{const r=await request('/api/admin/approvals',{method:'POST',body:JSON.stringify({id,decision,note})});state.cache.approvals=null;state.cache.ops=null;toast(r.status==='pending'?`บันทึกการอนุมัติแล้ว (${r.approvals}/${r.required})`:decision==='approved'?'อนุมัติและดำเนินการแล้ว':'ปฏิเสธรายการแล้ว');openView('approvals',true)}catch(err){toast(`อนุมัติไม่สำเร็จ: ${err.data?.error||err.message}`,true)}return}
 if(e.target.closest('[data-revoke-others]')){if(!confirm('ยืนยันออกจากระบบบนอุปกรณ์อื่นทั้งหมด?'))return;try{await request('/api/staff/sessions',{method:'POST',body:JSON.stringify({action:'revoke_others'})});toast('ยกเลิกเซสชันอุปกรณ์อื่นแล้ว');openView('security',true)}catch{toast('ดำเนินการไม่สำเร็จ',true)}return}
 const revoke=e.target.closest('[data-revoke-session]');if(revoke){if(!confirm('ยืนยันยกเลิกเซสชันนี้?'))return;try{await request('/api/staff/sessions',{method:'POST',body:JSON.stringify({action:'revoke',sessionRef:revoke.dataset.revokeSession})});toast('ยกเลิกเซสชันแล้ว');openView('security',true)}catch{toast('ยกเลิกเซสชันไม่สำเร็จ',true)}return}
 if(e.target.closest('[data-integrity]')){try{await request('/api/admin/backup',{method:'POST',body:JSON.stringify({action:'integrity_scan'})});toast('ตรวจความสมบูรณ์ของข้อมูลแล้ว');openView('continuity',true)}catch(err){toast(`ตรวจไม่สำเร็จ: ${err.data?.error||err.message}`,true)}return}
 if(e.target.closest('[data-manifest]')){try{await request('/api/admin/backup',{method:'POST',body:JSON.stringify({action:'create_manifest'})});toast('สร้าง Backup Manifest แล้ว');openView('continuity',true)}catch(err){toast(`สร้าง Manifest ไม่สำเร็จ: ${err.data?.error||err.message}`,true)}return}
});
$('#main').addEventListener('submit',async e=>{if(e.target.id!=='stockForm')return;e.preventDefault();const productId=Number($('#stockProduct').value),delta=Number($('#stockDelta').value),reason=$('#stockReason').value.trim();if(!Number.isInteger(delta)||delta===0||reason.length<3){toast('กรุณาระบุจำนวนและเหตุผลให้ครบ',true);return}if(!confirm(`ยืนยันปรับสต็อก ${delta>0?'+':''}${delta} หน่วย?`))return;try{await request('/api/admin/inventory',{method:'POST',body:JSON.stringify({productId,delta,reason})});state.cache.inventory=null;toast('บันทึกการปรับสต็อกแล้ว');openView('inventory',true)}catch(err){toast(`ปรับสต็อกไม่สำเร็จ: ${err.data?.error||err.message}`,true)}});
(async function boot(){try{if(await refreshSession()){showPortal();await openView(state.view,true)}}catch{showLogin()}})();
setInterval(()=>{if(state.staff)refreshSession().catch(()=>{})},5*60*1000);
</script>
