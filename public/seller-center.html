<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#092d23">
<title>KHONCHAIHERB | ศูนย์บริหารร้านค้า</title>
<style>
:root{--deep:#092d23;--deep2:#0e3b2e;--leaf:#246047;--gold:#c5a45e;--cream:#f5f1e8;--paper:#fffdf9;--ink:#17372b;--muted:#6e7b74;--line:#e2ddd2;--ok:#23724a;--warn:#a46b16;--danger:#a33e35;--blue:#2d5d83;--shadow:0 18px 48px rgba(20,49,38,.10)}
*{box-sizing:border-box}html{background:#eef0eb}body{margin:0;color:var(--ink);background:#eef0eb;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#1b5b45 0,#0b3428 38%,#061d17 100%)}.authcard{width:min(440px,100%);padding:34px;border:1px solid rgba(222,196,132,.26);border-radius:26px;background:rgba(255,253,249,.98);box-shadow:0 28px 80px rgba(0,0,0,.28)}.authbrand{display:flex;align-items:center;gap:13px;margin-bottom:25px}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:var(--deep);color:var(--gold);font:800 24px Georgia,serif}.authbrand b{display:block;font-size:19px;letter-spacing:.06em}.authbrand small{display:block;color:var(--muted);font-size:12px}.authcard h1{margin:0;font-size:27px;line-height:1.25}.authcard>p{margin:8px 0 22px;color:var(--muted)}.field{display:grid;gap:6px;margin:13px 0}.field span{font-size:12px;font-weight:800}.field input,.field select{width:100%;min-height:48px;border:1px solid #d8d9d2;border-radius:12px;background:white;padding:10px 12px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#6d947f;box-shadow:0 0 0 3px rgba(36,96,71,.10)}.error{min-height:22px;margin:8px 0;color:var(--danger);font-size:12px}.primary,.soft,.danger{min-height:42px;border:1px solid transparent;border-radius:11px;padding:8px 13px;font-weight:800}.primary{background:var(--deep);color:#fff}.soft{background:#f1f5f1;border-color:#d9e2dc;color:var(--deep)}.danger{background:#fff1ee;border-color:#edd1cb;color:var(--danger)}.authcard .primary{width:100%;min-height:50px;margin-top:4px}
.portal{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;padding:20px 14px;background:linear-gradient(180deg,#092f24,#07251d);color:white;overflow:auto}.sidebrand{display:flex;align-items:center;gap:11px;padding:6px 8px 22px;border-bottom:1px solid rgba(255,255,255,.10)}.sidebrand .mark{background:rgba(255,255,255,.08);color:#e6c779}.sidebrand b{display:block;letter-spacing:.06em}.sidebrand small{display:block;color:#9db4a9;font-size:11px}.nav{display:grid;gap:5px;margin-top:18px}.nav button{display:flex;align-items:center;gap:11px;min-height:46px;border:0;border-radius:12px;background:transparent;color:#cbd8d2;padding:9px 11px;text-align:left;font-weight:750}.nav button:hover,.nav button.active{background:rgba(255,255,255,.09);color:#fff}.nav .ico{width:25px;text-align:center;font-size:18px}.sidefoot{margin-top:22px;padding:15px 10px;border-top:1px solid rgba(255,255,255,.10);color:#9fb4aa;font-size:11px}.sidefoot b{display:block;color:#fff;font-size:12px}.workspace{min-width:0}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;min-height:74px;padding:12px 26px;border-bottom:1px solid #dedfd8;background:rgba(247,247,242,.94);backdrop-filter:blur(14px)}.mobilemenu{display:none;width:42px;height:42px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--deep)}.topcopy{min-width:0}.topcopy b{display:block;font-size:18px}.topcopy small{display:block;color:var(--muted)}.topspacer{flex:1}.identity{display:flex;align-items:center;gap:10px;min-width:0}.avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#dfeae3;color:var(--deep);font-weight:900}.identity span{min-width:0}.identity b,.identity small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.identity small{color:var(--muted);font-size:11px}.main{max-width:1540px;margin:auto;padding:26px 28px 60px}.pagehead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.pagehead h1{margin:0;font-size:30px;line-height:1.2}.pagehead p{margin:6px 0 0;color:var(--muted)}.pageactions{display:flex;gap:8px;flex-wrap:wrap}.statusline{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #dce2dd;border-radius:999px;background:#f8faf8;padding:5px 9px;font-size:11px;font-weight:750;color:#53665c}.chip.ok{background:#eaf6ee;border-color:#d0e7d8;color:var(--ok)}.chip.warn{background:#fff5e7;border-color:#ead9bb;color:var(--warn)}.chip.bad{background:#fff0ed;border-color:#ebcec8;color:var(--danger)}
.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.metric{min-width:0;padding:16px;border:1px solid var(--line);border-radius:17px;background:var(--paper);box-shadow:var(--shadow)}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{display:block;margin-top:6px;font-size:23px;line-height:1.2}.metric small{display:block;margin-top:5px;color:var(--muted);font-size:10px}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}.panel{min-width:0;margin-top:14px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden}.grid2 .panel{margin-top:0}.panelhead{display:flex;align-items:center;gap:12px;padding:16px 17px;border-bottom:1px solid #ebe6dc}.panelhead h2{margin:0;font-size:17px}.panelhead p{margin:3px 0 0;color:var(--muted);font-size:11px}.panelhead .right{margin-left:auto;display:flex;gap:8px;align-items:center}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:11px 13px;border-bottom:1px solid #eee9df;vertical-align:middle}th{position:sticky;top:0;background:#faf8f3;color:#728078;font-size:10px;text-transform:uppercase;letter-spacing:.04em}td{font-size:12px}.money{font-weight:850;font-variant-numeric:tabular-nums}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;background:#eef1ee;color:#627168}.pill.ok{background:#e8f5ed;color:var(--ok)}.pill.warn{background:#fff3df;color:var(--warn)}.pill.bad{background:#fff0ed;color:var(--danger)}.pill.blue{background:#edf4fa;color:var(--blue)}.empty{padding:32px;text-align:center;color:var(--muted)}.queue{display:grid;gap:8px;padding:14px}.queueitem{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid #e3e7e2;border-radius:12px;background:#fbfcfa}.queueitem strong{display:grid;place-items:center;min-width:34px;height:34px;border-radius:10px;background:#edf3ee}.queueitem.critical strong{background:#fff0ed;color:var(--danger)}.queueitem span{font-size:12px}.healthgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:14px}.health{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;border:1px solid #e5e7e2;border-radius:12px;background:#fbfcfa}.health span{font-size:11px}.dot{width:9px;height:9px;border-radius:50%;background:#c7cec9}.dot.ok{background:#3f9a69}.dot.bad{background:#c65c52}.tools{display:flex;gap:8px;flex-wrap:wrap;padding:14px}.notice{margin:14px;padding:12px;border:1px solid #e4dccb;border-radius:12px;background:#fffaf0;color:#785d2b;font-size:11px}.formrow{display:grid;grid-template-columns:1fr 1fr 130px 2fr auto;gap:8px;align-items:end;padding:14px;border-bottom:1px solid #ebe6dc}.formrow input,.formrow select{min-height:40px;border:1px solid #d9ddd8;border-radius:10px;background:white;padding:8px 10px}.formrow label{display:grid;gap:4px;font-size:10px;font-weight:800;color:#66756d}.sessionlist{display:grid;gap:8px;padding:14px}.session{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid #e4e7e3;border-radius:12px}.session .device{flex:1}.session b,.session small{display:block}.session small{color:var(--muted);font-size:10px}.eventsev{font-weight:850}.eventsev.warning,.eventsev.high{color:var(--warn)}.eventsev.critical{color:var(--danger)}
.loading{display:grid;place-items:center;min-height:260px;color:var(--muted)}.spinner{width:28px;height:28px;border:3px solid #dce4de;border-top-color:var(--leaf);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;z-index:100;right:20px;bottom:20px;max-width:min(420px,calc(100% - 40px));padding:12px 14px;border-radius:12px;background:#153d2f;color:white;box-shadow:0 15px 45px rgba(0,0,0,.22);font-size:12px}.toast.bad{background:#84362f}
@media(max-width:1200px){.metrics{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.formrow{grid-template-columns:1fr 1fr 1fr}.formrow label:nth-child(4){grid-column:1/3}.formrow button{align-self:end}}
@media(max-width:820px){.portal{grid-template-columns:1fr}.sidebar{position:fixed;z-index:50;left:0;top:0;width:270px;transform:translateX(-105%);transition:transform .2s ease}.sidebar.open{transform:translateX(0)}.mobilemenu{display:block}.topbar{padding:10px 14px}.identity span{display:none}.main{padding:20px 14px 50px}.pagehead{align-items:flex-start;flex-direction:column}.metrics{grid-template-columns:repeat(2,1fr)}.metric b{font-size:20px}.healthgrid{grid-template-columns:1fr}.formrow{grid-template-columns:1fr}.formrow label:nth-child(4){grid-column:auto}.topcopy small{display:none}}
</style>
</head>
<body>
<section id="auth" class="auth">
  <form id="loginForm" class="authcard" autocomplete="on">
    <div class="authbrand"><span class="mark">K</span><span><b>KHONCHAIHERB</b><small>ศูนย์บริหารร้านค้า</small></span></div>
    <h1>เข้าสู่ระบบพนักงาน</h1>
    <p>ใช้บัญชีพนักงานของคุณเพื่อเข้าถึงข้อมูลตามสิทธิ์ที่ได้รับ</p>
    <label class="field"><span>ชื่อผู้ใช้</span><input id="username" name="username" autocomplete="username" required minlength="3"></label>
    <label class="field"><span>รหัสผ่าน</span><input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <div id="loginError" class="error" role="alert"></div>
    <button id="loginButton" class="primary" type="submit">เข้าสู่ศูนย์บริหารร้านค้า</button>
  </form>
</section>

<section id="portal" class="portal hidden">
  <aside id="sidebar" class="sidebar">
    <div class="sidebrand"><span class="mark">K</span><span><b>KHONCHAIHERB</b><small>ศูนย์บริหารร้านค้า</small></span></div>
    <nav id="nav" class="nav"></nav>
    <div class="sidefoot"><b id="sideUser">—</b><span id="sideRole">—</span></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <button id="mobileMenu" class="mobilemenu" type="button" aria-label="เปิดเมนู">☰</button>
      <div class="topcopy"><b id="viewTitle">ภาพรวมร้านค้า</b><small id="sessionText">กำลังตรวจสอบเซสชัน</small></div>
      <div class="topspacer"></div>
      <div class="identity"><span id="avatar" class="avatar">K</span><span><b id="topUser">—</b><small id="topRole">—</small></span></div>
      <button id="logout" class="soft" type="button">ออกจากระบบ</button>
    </header>
    <main id="main" class="main"></main>
  </div>
</section>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const state={staff:null,csrfToken:'',sessionRef:'',view:'dashboard',cache:{},loading:false};
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:0}).format(Number(n||0));
const integer=n=>new Intl.NumberFormat('th-TH').format(Number(n||0));
const dateTime=v=>v?new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short'}).format(new Date(String(v).replace(' ','T')+(String(v).includes('Z')?'':'Z'))):'—';
const can=p=>Boolean(state.staff?.permissions?.includes('*')||state.staff?.permissions?.includes(p));
const unsafe=m=>!['GET','HEAD','OPTIONS'].includes(String(m||'GET').toUpperCase());

function toast(text,bad=false){const el=$('#toast');el.textContent=text;el.className=`toast${bad?' bad':''}`;clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3600)}
function roleLabel(role){return ({owner:'เจ้าของระบบ',admin:'ผู้ดูแลระบบ',operations:'ฝ่ายปฏิบัติการ',warehouse:'คลังสินค้า',finance:'ฝ่ายการเงิน',support:'ฝ่ายบริการลูกค้า',viewer:'ผู้ดูข้อมูล'})[role]||role||'—'}
function pill(text,type=''){return `<span class="pill ${type}">${esc(text)}</span>`}
function metric(label,value,sub=''){return `<article class="metric"><span>${esc(label)}</span><b>${esc(value)}</b>${sub?`<small>${esc(sub)}</small>`:''}</article>`}
function loading(){return '<div class="loading"><div><div class="spinner"></div>กำลังโหลดข้อมูล...</div></div>'}
function showLogin(message=''){$('#portal').classList.add('hidden');$('#auth').classList.remove('hidden');$('#loginError').textContent=message;state.staff=null;state.csrfToken=''}
function showPortal(){$('#auth').classList.add('hidden');$('#portal').classList.remove('hidden')}

async function request(path,options={}){
  const method=String(options.method||'GET').toUpperCase();
  const headers={Accept:'application/json',...(options.headers||{})};
  if(options.body)headers['Content-Type']='application/json';
  if(unsafe(method)&&state.csrfToken)headers['X-KCH-CSRF']=state.csrfToken;
  const r=await fetch(path,{...options,method,headers,credentials:'same-origin',cache:method==='GET'?'no-store':undefined});
  const data=await r.json().catch(()=>({}));
  if(r.status===401){showLogin('เซสชันหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง');throw Object.assign(new Error('staff_auth_required'),{status:401,data})}
  if(!r.ok)throw Object.assign(new Error(data.error||`HTTP ${r.status}`),{status:r.status,data});
  return data;
}
async function refreshSession(){
  const r=await fetch('/api/staff/me',{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});
  if(!r.ok){showLogin();return false}
  const d=await r.json();state.staff=d.staff;state.csrfToken=d.csrfToken||'';state.sessionRef=d.staff?.sessionRef||d.sessionRef||'';updateIdentity();return true
}
function updateIdentity(){
  const s=state.staff||{};const name=s.displayName||s.username||'พนักงาน';
  $('#topUser').textContent=name;$('#sideUser').textContent=name;$('#topRole').textContent=roleLabel(s.role);$('#sideRole').textContent=roleLabel(s.role);$('#avatar').textContent=String(name).trim().charAt(0).toUpperCase()||'K';
  $('#sessionText').textContent=s.expiresAt?`เซสชันถึง ${dateTime(s.expiresAt)}`:'เข้าสู่ระบบแล้ว';
  buildNav();
}

const navItems=[
  ['dashboard','⌂','ภาพรวมร้านค้า',()=>can('analytics.read')||can('*')],
  ['orders','▤','คำสั่งซื้อ',()=>can('orders.read')],
  ['inventory','◫','สินค้าและสต็อก',()=>can('inventory.read')],
  ['finance','฿','การเงินและ COD',()=>can('finance.read')],
  ['operations','⚙','ปฏิบัติการ',()=>can('analytics.read')],
  ['security','◇','ความปลอดภัย',()=>can('audit.read')],
  ['team','♙','พนักงานและสิทธิ์',()=>can('staff.read')],
  ['continuity','⟳','สำรองและความต่อเนื่อง',()=>can('backup.manage')]
];
function buildNav(){
  const visible=navItems.filter(x=>x[3]());
  if(!visible.some(x=>x[0]===state.view))state.view=visible[0]?.[0]||'dashboard';
  $('#nav').innerHTML=visible.map(x=>`<button type="button" class="${x[0]===state.view?'active':''}" data-view="${x[0]}"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('');
}
function titleFor(view){return navItems.find(x=>x[0]===view)?.[2]||'ศูนย์บริหารร้านค้า'}
async function openView(view,force=false){
  state.view=view;buildNav();$('#viewTitle').textContent=titleFor(view);$('#sidebar').classList.remove('open');
  const main=$('#main');main.innerHTML=loading();
  try{
    if(view==='dashboard')await renderDashboard(force);
    else if(view==='orders')await renderOrders(force);
    else if(view==='inventory')await renderInventory(force);
    else if(view==='finance')await renderFinance(force);
    else if(view==='operations')await renderOperations(force);
    else if(view==='security')await renderSecurity(force);
    else if(view==='team')await renderTeam(force);
    else if(view==='continuity')await renderContinuity(force);
  }catch(e){if(e.status!==401)main.innerHTML=`<div class="panel"><div class="empty">โหลดข้อมูลไม่สำเร็จ: ${esc(e.data?.error||e.message)}</div></div>`}
}
async function cached(key,loader,force=false){if(!force&&state.cache[key]&&Date.now()-state.cache[key].at<30000)return state.cache[key].data;const data=await loader();state.cache[key]={at:Date.now(),data};return data}

async function renderDashboard(force=false){
  const [center,ops]=await Promise.all([
    cached('center',()=>request('/api/admin/commerce-command-center'),force),
    cached('ops',()=>request('/api/admin/ops-monitoring'),force).catch(()=>null)
  ]);
  const c=center;const actions=c.actions||[];const k=ops?.kpi||{};
  $('#main').innerHTML=`
    <div class="pagehead"><div><h1>ภาพรวมร้านค้า</h1><p>ยอดขาย กำไร คำสั่งซื้อ COD และสิ่งที่ต้องดำเนินการในจุดเดียว</p></div><div class="pageactions"><button class="soft" data-refresh>รีเฟรชข้อมูล</button></div></div>
    <div class="statusline">${ops?pill(ops.ok?'ระบบหลักพร้อมทำงาน':'มีรายการที่ต้องตรวจสอบ',ops.ok?'ok':'warn'):''}${pill(`สิทธิ์: ${roleLabel(state.staff.role)}`,'blue')}</div>
    <section class="metrics">
      ${metric('ยอดขาย 30 วัน',money(c.sales30d?.gross),`${integer(c.sales30d?.orders)} ออเดอร์`)}
      ${metric('กำไรขั้นต้น 30 วัน',money(c.profit30d?.grossProfit),`Margin ${Number(c.profit30d?.marginPct||0).toFixed(1)}%`)}
      ${metric('มูลค่าต่อออเดอร์',money(c.sales30d?.aov),'AOV')}
      ${metric('ลูกค้าซื้อซ้ำ',`${Number(c.customers?.repeatRate||0).toFixed(1)}%`,`${integer(c.customers?.repeat)} คน`)}
      ${metric('สินค้าพร้อมขาย',`${integer(c.catalog?.saleReady)}/${integer(c.catalog?.active)}`,'จากสินค้าที่เปิดใช้งาน')}
      ${metric('COD รับแล้ว',money(c.cod?.netCollected),`${integer(c.cod?.exceptions)} รายการผิดปกติ`)}
    </section>
    <div class="grid2">
      <section class="panel"><div class="panelhead"><div><h2>สิ่งที่ต้องดำเนินการ</h2><p>จัดลำดับจากข้อมูลการขายและปฏิบัติการล่าสุด</p></div></div><div class="queue">${actions.length?actions.map(a=>`<div class="queueitem ${a.priority==='critical'?'critical':''}"><strong>${integer(a.count)}</strong><span>${esc(a.label)}</span></div>`).join(''):'<div class="empty">ไม่มีรายการเร่งด่วน</div>'}</div></section>
      <section class="panel"><div class="panelhead"><div><h2>ภาระงานปฏิบัติการ</h2><p>รายการที่กำลังรอทีมดำเนินการ</p></div></div><div class="queue">
        <div class="queueitem"><strong>${integer(k.open_fulfillment||0)}</strong><span>ออเดอร์รอจัดเตรียม/แพ็ก</span></div>
        <div class="queueitem ${Number(k.cod_exceptions||0)?'critical':''}"><strong>${integer(k.cod_exceptions||0)}</strong><span>COD ต้องตรวจสอบ</span></div>
        <div class="queueitem"><strong>${integer(k.open_returns||0)}</strong><span>คำขอคืนสินค้าที่ยังเปิดอยู่</span></div>
        <div class="queueitem"><strong>${integer(k.low_stock_products||0)}</strong><span>สินค้าใกล้หมด</span></div>
      </div></section>
    </div>`;
}

async function renderOrders(force=false){
  const d=await cached('orders',()=>request('/api/admin/orders?limit=100'),force);const rows=d.orders||[];
  $('#main').innerHTML=`<div class="pagehead"><div><h1>คำสั่งซื้อ</h1><p>ตรวจสอบการชำระเงินและสถานะการจัดส่งล่าสุด</p></div><div class="pageactions"><button class="soft" data-refresh>รีเฟรชข้อมูล</button></div></div>
  <section class="panel"><div class="panelhead"><div><h2>รายการล่าสุด</h2><p>${integer(rows.length)} รายการ</p></div></div><div class="tablewrap"><table><thead><tr><th>ออเดอร์</th><th>ลูกค้า</th><th>ยอดรวม</th><th>วิธีชำระ</th><th>การชำระ</th><th>จัดส่ง</th><th>สถานะ</th><th>วันที่</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td><b>${esc(r.order_no)}</b></td><td>${esc(r.customer_name||'—')}</td><td class="money">${money(r.total)}</td><td>${esc(r.payment_method||'—')}</td><td>${pill(r.payment_status||'—',/paid|collected/.test(r.payment_status||'')?'ok':'warn')}</td><td>${pill(r.fulfillment_status||'—',r.fulfillment_status==='delivered'?'ok':'')}</td><td>${esc(r.status||'—')}</td><td>${dateTime(r.created_at)}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">ยังไม่มีคำสั่งซื้อ</td></tr>'}</tbody></table></div></section>`;
}

async function renderInventory(force=false){
  const d=await cached('inventory',()=>request('/api/admin/inventory'),force);const rows=d.products||[];
  const adjustment=can('inventory.manage')?`<form id="stockForm" class="formrow"><label>สินค้า<select id="stockProduct" required>${rows.map(p=>`<option value="${p.product_id}">${esc(p.name)} • ${esc(p.sku||'')}</option>`).join('')}</select></label><label>ปรับจำนวน<input id="stockDelta" type="number" step="1" required placeholder="เช่น 10 หรือ -2"></label><label>ประเภท<select id="stockType"><option value="adjust">ปรับสต็อก</option></select></label><label>เหตุผล<input id="stockReason" required minlength="3" placeholder="ระบุเหตุผลที่ตรวจสอบย้อนหลังได้"></label><button class="primary" type="submit">บันทึก</button></form>`:'';
  $('#main').innerHTML=`<div class="pagehead"><div><h1>สินค้าและสต็อก</h1><p>ดูยอดคงเหลือ ยอดจอง และสต็อกที่พร้อมขาย</p></div><div class="pageactions"><button class="soft" data-refresh>รีเฟรชข้อมูล</button></div></div>
  <section class="panel"><div class="panelhead"><div><h2>สต็อกสินค้า</h2><p>${integer(rows.length)} รายการ</p></div></div>${adjustment}<div class="tablewrap"><table><thead><tr><th>สินค้า</th><th>SKU</th><th>สต็อก</th><th>จอง</th><th>พร้อมใช้</th><th>จุดเตือน</th><th>สถานะ</th></tr></thead><tbody>${rows.map(p=>{const low=Number(p.available_stock)<=Number(p.low_stock_threshold);return `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.sku||'—')}</td><td>${integer(p.stock)}</td><td>${integer(p.reserved_stock)}</td><td><b>${integer(p.available_stock)}</b></td><td>${integer(p.low_stock_threshold)}</td><td>${pill(low?'ใกล้หมด/หมด':'ปกติ',low?'warn':'ok')}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">ยังไม่มีข้อมูลสินค้า</td></tr>'}</tbody></table></div></section>`;
}

async function renderFinance(force=false){
  const date=new Date().toISOString().slice(0,10);const d=await cached(`finance:${date}`,()=>request(`/api/admin/finance?date=${date}`),force);const s=d.summary||{},rows=d.ledger||[];
  $('#main').innerHTML=`<div class="pagehead"><div><h1>การเงินและ COD</h1><p>ติดตามเงินรับ ค่าธรรมเนียม คืนเงิน ต้นทุน และข้อยกเว้น COD</p></div><div class="pageactions"><button class="soft" data-refresh>รีเฟรชข้อมูล</button></div></div>
  <section class="metrics">${metric('COD รับวันนี้',money(s.codCollected),`${integer(s.paidOrders)} ออเดอร์`)}${metric('ค่าธรรมเนียม COD',money(s.codFees))}${metric('คืนเงิน',money(s.refunds),`${integer(s.refundsPending)} รายการค้าง`)}${metric('ต้นทุนสินค้า',money(s.cogs))}${metric('เงินสุทธิ',money(s.netCash))}${metric('COD ผิดปกติ',integer(s.codExceptions),Number(s.codExceptions)?'ต้องตรวจสอบ':'ปกติ')}</section>
  <section class="panel"><div class="panelhead"><div><h2>บัญชีรายการวันนี้</h2><p>${esc(d.date)}</p></div></div><div class="tablewrap"><table><thead><tr><th>เวลา</th><th>ประเภท</th><th>ออเดอร์</th><th>อ้างอิง</th><th>รายละเอียด</th><th>จำนวนเงิน</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${dateTime(r.created_at)}</td><td>${esc(r.entry_type)}</td><td>${esc(r.order_no||'—')}</td><td>${esc(r.reference_id||'—')}</td><td>${esc(r.description||'—')}</td><td class="money">${money(r.amount)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">ยังไม่มีรายการในวันนี้</td></tr>'}</tbody></table></div></section>`;
}

async function renderOperations(force=false){
  const d=await cached('ops',()=>request('/api/admin/ops-monitoring'),force);const b=d.bindings||{},k=d.kpi||{};const items=[['ฐานข้อมูล',b.d1],['ระบบยืนยันตัวตนลูกค้า',b.auth],['คลังรูปสินค้า',b.productMedia],['คลังสื่อรีวิว',b.reviewMedia],['Webhook ขนส่ง',b.shippingWebhook],['Webhook แจ้งเตือน',b.notificationWebhook],['ตรวจสอบก่อนจัดส่ง',b.packingVerification]];
  $('#main').innerHTML=`<div class="pagehead"><div><h1>ปฏิบัติการ</h1><p>ตรวจความพร้อมของบริการสำคัญและภาระงานที่รอการดำเนินการ</p></div><div class="pageactions"><button class="soft" data-refresh>ตรวจใหม่</button></div></div>
  <div class="grid2"><section class="panel"><div class="panelhead"><div><h2>บริการที่จำเป็น</h2><p>แสดงเฉพาะสถานะพร้อม/ไม่พร้อม ไม่แสดงค่าความลับ</p></div></div><div class="healthgrid">${items.map(x=>`<div class="health"><span>${esc(x[0])}</span><i class="dot ${x[1]?'ok':'bad'}"></i></div>`).join('')}</div></section>
  <section class="panel"><div class="panelhead"><div><h2>คิวงาน</h2><p>ภาระงานที่ควรติดตาม</p></div></div><div class="queue"><div class="queueitem"><strong>${integer(k.open_fulfillment)}</strong><span>Fulfillment เปิดอยู่</span></div><div class="queueitem ${Number(k.cod_exceptions)?'critical':''}"><strong>${integer(k.cod_exceptions)}</strong><span>COD exceptions</span></div><div class="queueitem"><strong>${integer(k.notification_failed)}</strong><span>แจ้งเตือนส่งไม่สำเร็จ</span></div><div class="queueitem"><strong>${integer(k.po_pending_approval)}</strong><span>PO รออนุมัติ</span></div><div class="queueitem"><strong>${integer(k.active_waves)}</strong><span>Picking wave ที่กำลังทำงาน</span></div></div></section></div>`;
}

async function renderSecurity(force=false){
  const loaders=[cached('sessions',()=>request('/api/staff/sessions'),force),cached('securityEvents',()=>request('/api/admin/security-events?limit=100'),force).catch(()=>({events:[]}))];const [sessionsData,eventsData]=await Promise.all(loaders);const sessions=sessionsData.sessions||[],events=eventsData.events||[];
  $('#main').innerHTML=`<div class="pagehead"><div><h1>ความปลอดภัย</h1><p>เซสชันพนักงานและเหตุการณ์ด้านสิทธิ์การเข้าถึง</p></div><div class="pageactions"><button class="soft" data-refresh>รีเฟรชข้อมูล</button>${sessions.length>1?'<button class="danger" data-revoke-others>ออกจากระบบอุปกรณ์อื่น</button>':''}</div></div>
  <section class="panel"><div class="panelhead"><div><h2>อุปกรณ์ที่เข้าสู่ระบบ</h2><p>บัญชีของคุณ</p></div></div><div class="sessionlist">${sessions.map(s=>`<div class="session"><span class="avatar">${s.current_session?'✓':'•'}</span><div class="device"><b>${esc(s.device_label||'Browser session')} ${s.current_session?'(เครื่องนี้)':''}</b><small>ใช้งานล่าสุด ${dateTime(s.last_seen_at)} • หมดอายุ ${dateTime(s.expires_at)}</small></div>${s.current_session?'':`<button class="danger" type="button" data-revoke-session="${esc(s.session_ref)}">ยกเลิกเซสชัน</button>`}</div>`).join('')||'<div class="empty">ไม่พบเซสชัน</div>'}</div></section>
  <section class="panel"><div class="panelhead"><div><h2>เหตุการณ์ล่าสุด</h2><p>บันทึกการเข้าสู่ระบบ การปฏิเสธสิทธิ์ และการแก้ไขข้อมูลสำคัญ</p></div></div><div class="tablewrap"><table><thead><tr><th>เวลา</th><th>ระดับ</th><th>เหตุการณ์</th><th>ผู้ใช้</th><th>เส้นทาง</th><th>ผล</th></tr></thead><tbody>${events.length?events.map(e=>`<tr><td>${dateTime(e.created_at)}</td><td><span class="eventsev ${esc(e.severity)}">${esc(e.severity)}</span></td><td>${esc(e.event_type)}</td><td>${esc(e.display_name||e.username||'ระบบ')}</td><td>${esc(e.route||'—')}</td><td>${esc(e.status_code??'—')}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">ยังไม่มีเหตุการณ์ที่แสดง</td></tr>'}</tbody></table></div></section>`;
}

async function renderTeam(force=false){
  const d=await cached('staff',()=>request('/api/admin/staff'),force);const rows=d.staff||[];
  $('#main').innerHTML=`<div class="pagehead"><div><h1>พนักงานและสิทธิ์</h1><p>ดูบัญชี บทบาท สถานะ และจำนวนเซสชันที่กำลังใช้งาน</p></div><div class="pageactions"><button class="soft" data-refresh>รีเฟรชข้อมูล</button></div></div>
  <section class="panel"><div class="panelhead"><div><h2>บัญชีพนักงาน</h2><p>การแก้ไขสิทธิ์ควรทำโดย Owner/Admin ที่ได้รับมอบหมาย</p></div></div><div class="tablewrap"><table><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อแสดง</th><th>บทบาท</th><th>สถานะ</th><th>เซสชัน</th><th>เข้าสู่ระบบล่าสุด</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td><b>${esc(r.username)}</b></td><td>${esc(r.display_name)}</td><td>${pill(roleLabel(r.role),'blue')}</td><td>${pill(Number(r.active)?'ใช้งาน':'ปิดใช้งาน',Number(r.active)?'ok':'bad')}</td><td>${integer(r.active_sessions)}</td><td>${dateTime(r.last_login_at)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">ยังไม่มีบัญชีพนักงาน</td></tr>'}</tbody></table></div></section>`;
}

async function renderContinuity(force=false){
  const d=await cached('backup',()=>request('/api/admin/backup'),force);const snapshots=d.snapshots||[],integrity=d.integrity||[],maintenance=d.maintenance||[];
  $('#main').innerHTML=`<div class="pagehead"><div><h1>สำรองและความต่อเนื่อง</h1><p>ตรวจความสมบูรณ์ของข้อมูลและหลักฐานความพร้อมในการกู้คืน</p></div><div class="pageactions"><button class="soft" data-integrity>ตรวจความสมบูรณ์</button><button class="soft" data-manifest>สร้าง Backup Manifest</button><button class="soft" data-refresh>รีเฟรชข้อมูล</button></div></div>
  <div class="notice">Backup Manifest ในหน้านี้เป็นข้อมูลกำกับและจำนวนระเบียน ไม่ใช่สำเนาข้อมูลลูกค้า การกู้คืนจริงต้องใช้กระบวนการสำรอง/กู้คืนของ Cloudflare D1 และควรทดสอบการกู้คืนเป็นระยะ</div>
  <div class="grid2"><section class="panel"><div class="panelhead"><div><h2>Integrity Scan</h2><p>ผลตรวจล่าสุด</p></div></div><div class="tablewrap"><table><thead><tr><th>เวลา</th><th>สถานะ</th><th>คะแนน</th><th>รายการผิดปกติ</th><th>ผู้ดำเนินการ</th></tr></thead><tbody>${integrity.length?integrity.map(r=>`<tr><td>${dateTime(r.created_at)}</td><td>${pill(r.status,r.status==='ok'?'ok':'warn')}</td><td>${esc(r.score)}</td><td>${integer(r.anomalies_count)}</td><td>${esc(r.created_by||'—')}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">ยังไม่มีผลตรวจ</td></tr>'}</tbody></table></div></section>
  <section class="panel"><div class="panelhead"><div><h2>Backup Manifest</h2><p>รายการล่าสุด</p></div></div><div class="tablewrap"><table><thead><tr><th>เวลา</th><th>เลขที่</th><th>Schema</th><th>สถานะ</th></tr></thead><tbody>${snapshots.length?snapshots.map(r=>`<tr><td>${dateTime(r.created_at)}</td><td>${esc(r.snapshot_no)}</td><td>${esc(r.schema_version)}</td><td>${pill(r.status,r.status==='verified'?'ok':'warn')}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">ยังไม่มี manifest</td></tr>'}</tbody></table></div></section></div>
  ${maintenance.length?`<section class="panel"><div class="panelhead"><div><h2>Maintenance ล่าสุด</h2></div></div><div class="tablewrap"><table><thead><tr><th>เวลา</th><th>งาน</th><th>สถานะ</th><th>จำนวนที่กระทบ</th><th>ผู้ดำเนินการ</th></tr></thead><tbody>${maintenance.map(r=>`<tr><td>${dateTime(r.created_at)}</td><td>${esc(r.job_key)}</td><td>${pill(r.status,r.status==='completed'?'ok':'warn')}</td><td>${integer(r.affected_rows)}</td><td>${esc(r.run_by||'—')}</td></tr>`).join('')}</tbody></table></div></section>`:''}`;
}

$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const username=$('#username').value.trim(),password=$('#password').value;const btn=$('#loginButton');$('#loginError').textContent='';btn.disabled=true;btn.textContent='กำลังเข้าสู่ระบบ...';
  try{const r=await fetch('/api/staff/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({username,password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'login_failed'),{status:r.status,data:d});state.staff={...d.staff,permissions:[]};state.csrfToken=d.csrfToken||'';await refreshSession();showPortal();await openView('dashboard',true);$('#password').value=''}catch(err){const msg=err.status===423?'บัญชีถูกล็อกชั่วคราวจากการเข้าสู่ระบบไม่สำเร็จหลายครั้ง':err.status===401?'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง':'เข้าสู่ระบบไม่สำเร็จ กรุณาลองใหม่';$('#loginError').textContent=msg}finally{btn.disabled=false;btn.textContent='เข้าสู่ศูนย์บริหารร้านค้า'}
});
$('#logout').addEventListener('click',async()=>{try{await fetch('/api/staff/logout',{method:'POST',credentials:'same-origin',headers:{Accept:'application/json'}})}catch{}state.cache={};showLogin();toast('ออกจากระบบแล้ว')});
$('#mobileMenu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)openView(b.dataset.view)});
$('#main').addEventListener('click',async e=>{
  if(e.target.closest('[data-refresh]'))return openView(state.view,true);
  if(e.target.closest('[data-revoke-others]')){if(!confirm('ยืนยันออกจากระบบบนอุปกรณ์อื่นทั้งหมด?'))return;try{await request('/api/staff/sessions',{method:'POST',body:JSON.stringify({action:'revoke_others'})});state.cache.sessions=null;toast('ยกเลิกเซสชันอุปกรณ์อื่นแล้ว');openView('security',true)}catch(err){toast('ดำเนินการไม่สำเร็จ',true)}return}
  const revoke=e.target.closest('[data-revoke-session]');if(revoke){if(!confirm('ยืนยันยกเลิกเซสชันนี้?'))return;try{await request('/api/staff/sessions',{method:'POST',body:JSON.stringify({action:'revoke',sessionRef:revoke.dataset.revokeSession})});toast('ยกเลิกเซสชันแล้ว');openView('security',true)}catch{toast('ยกเลิกเซสชันไม่สำเร็จ',true)}return}
  if(e.target.closest('[data-integrity]')){try{await request('/api/admin/backup',{method:'POST',body:JSON.stringify({action:'integrity_scan'})});toast('ตรวจความสมบูรณ์ของข้อมูลแล้ว');openView('continuity',true)}catch(err){toast(`ตรวจไม่สำเร็จ: ${err.data?.error||err.message}`,true)}return}
  if(e.target.closest('[data-manifest]')){try{await request('/api/admin/backup',{method:'POST',body:JSON.stringify({action:'create_manifest'})});toast('สร้าง Backup Manifest แล้ว');openView('continuity',true)}catch(err){toast(`สร้าง Manifest ไม่สำเร็จ: ${err.data?.error||err.message}`,true)}return}
});
$('#main').addEventListener('submit',async e=>{
  if(e.target.id!=='stockForm')return;e.preventDefault();const productId=Number($('#stockProduct').value),delta=Number($('#stockDelta').value),reason=$('#stockReason').value.trim();if(!Number.isInteger(delta)||delta===0||reason.length<3){toast('กรุณาระบุจำนวนและเหตุผลให้ครบ',true);return}if(!confirm(`ยืนยันปรับสต็อก ${delta>0?'+':''}${delta} หน่วย?`))return;try{await request('/api/admin/inventory',{method:'POST',body:JSON.stringify({productId,delta,reason})});state.cache.inventory=null;toast('บันทึกการปรับสต็อกแล้ว');openView('inventory',true)}catch(err){toast(`ปรับสต็อกไม่สำเร็จ: ${err.data?.error||err.message}`,true)}});

(async function boot(){try{if(await refreshSession()){showPortal();await openView('dashboard',true)}}catch{showLogin()}})();
setInterval(()=>{if(state.staff)refreshSession().catch(()=>{})},5*60*1000);
</script>
</body>
</html>
